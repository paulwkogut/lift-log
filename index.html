      </svg>`;
    }
    function backIcon() {
      return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
    }
    function chevron() {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;
    }
    function dotsIcon() {
      return `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>`;
    }

    function readDraftInputs() {
      const w = document.getElementById("draft-weight");
      const r = document.getElementById("draft-reps");
      if (w) draft.weight = w.value;
      if (r) draft.reps = r.value;
    }
    function readAuthInputs() {
      const email = document.getElementById("auth-email");
      const password = document.getElementById("auth-password");
      const password2 = document.getElementById("auth-password2");
      if (email) authForm.email = email.value;
      if (password) authForm.password = password.value;
      if (password2) authForm.password2 = password2.value;
    }
    function parseWeight(str) {
      const n = parseFloat(String(str).replace(",", "."));
      if (!Number.isFinite(n) || n < 0) return null;
      return n;
    }
    function parseReps(str) {
      const n = parseInt(String(str), 10);
      if (!Number.isFinite(n) || n < 1) return null;
      return n;
    }
    function validateAuth(mode) {
      const email = authForm.email.trim();
      if (mode !== "recovery") {
        if (!email || email.indexOf("@") === -1) return "Enter a valid email.";
      }
      if (mode === "forgot") return "";
      if (!authForm.password || authForm.password.length < 6) return "Use at least 6 characters.";
      if ((mode === "signup" || mode === "recovery") && authForm.password !== authForm.password2) return "Passwords don't match.";
      return "";
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach(el => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          go(el.getAttribute("data-go"));
        });
      });

      const overlay = document.querySelector(".overlay");
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay && (!modal || modal.type !== "migrate-local")) closeModal();
        });
        const sheet = overlay.querySelector(".sheet");
        if (sheet) sheet.addEventListener("click", (e) => e.stopPropagation());
      }

      const nameInput = document.getElementById("modal-name");
      if (nameInput && modal && (modal.type === "add-exercise" || modal.type === "rename-exercise")) {
        setTimeout(() => { nameInput.focus(); nameInput.select(); }, 30);
        nameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") saveExerciseName();
        });
      }

      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", (e) => {
          const action = el.getAttribute("data-action");
          if (action === "close-modal" && e.currentTarget.classList.contains("overlay") && e.target !== el) return;
          handleAction(action, el);
        });
      });

      const dw = document.getElementById("draft-weight");
      const dr = document.getElementById("draft-reps");
      if (dw) dw.addEventListener("input", () => { draft.weight = dw.value; });
      if (dr) dr.addEventListener("input", () => { draft.reps = dr.value; });
      document.querySelectorAll("[data-draft-weight]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-draft-weight");
          readWorkoutDraft(id);
        });
      });
      document.querySelectorAll("[data-draft-reps]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-draft-reps");
          readWorkoutDraft(id);
        });
      });
      const tplName = document.getElementById("tpl-name");
      if (tplName) tplName.addEventListener("change", () => saveTemplateName());

      const authFormEl = document.getElementById("auth-form");
      if (authFormEl) authFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        submitAuth();
      });
      const recoveryFormEl = document.getElementById("recovery-form");
      if (recoveryFormEl) recoveryFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        submitNewPassword();
      });
      ["auth-email", "auth-password", "auth-password2"].forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;
        input.addEventListener("input", () => {
          if (id === "auth-email") authForm.email = input.value;
          if (id === "auth-password") authForm.password = input.value;
          if (id === "auth-password2") authForm.password2 = input.value;
        });
      });
    }

    function closeModal() {
      modal = null;
      render();
    }

    async function handleAction(action, el) {
      if (action === "close-modal") return closeModal();
      if (action === "auth-mode") {
        authMode = el.getAttribute("data-mode") || "login";
        authError = "";
        authNotice = "";
        authForm.password = "";
        authForm.password2 = "";
        focusAuthField = "auth-email";
        render();
        return;
      }
      if (action === "retry-load") {
        dataReadyFor = null;
        bootError = "";
        loadAccount();
        return;
      }
      if (action === "log-out") {
        authForm.password = "";
        authForm.password2 = "";
        try {
          await sb.auth.signOut();
        } catch (err) {
          showToast(err.message || "Couldn't log out.");
        }
        return;
      }
      if (action === "migrate-dismiss") {
        localStorage.setItem(migrationFlag(), "dismissed");
        modal = null;
        render();
        return;
      }
      if (action === "migrate-import") return migrateImport();
      if (action === "add-exercise") {
        modal = { type: "add-exercise", value: "" };
        return render();
      }
      if (action === "ex-menu") {
        modal = { type: "ex-menu", id: route.id };
        return render();
      }
      if (action === "rename-exercise") {
        const ex = exerciseById((modal && modal.id) || route.id);
        modal = { type: "rename-exercise", id: ex && ex.id, value: ex ? ex.name : "" };
        return render();
      }
      if (action === "confirm-delete-ex") {
        modal = { type: "confirm-delete-ex", id: (modal && modal.id) || route.id };
        return render();
      }
      if (action === "delete-exercise") return deleteExercise();
      if (action === "save-exercise-name") return saveExerciseName();
      if (action === "step-w") {
        readDraftInputs();
        const cur = parseWeight(draft.weight);
        const base = cur == null ? 0 : cur;
        const next = Math.max(0, Math.round((base + Number(el.getAttribute("data-dir")) * weightStep()) * 10) / 10);
        draft.weight = String(next);
        draftExId = route.id;
        return render();
      }
      if (action === "step-r") {
        readDraftInputs();
        const cur = parseReps(draft.reps);
        const base = cur == null ? 0 : cur;
        const next = Math.max(1, base + Number(el.getAttribute("data-dir")));
        draft.reps = String(next);
        draftExId = route.id;
        return render();
      }
      if (action === "add-set") return addSet();
      if (action === "edit-set") {
        modal = { type: "edit-set", id: el.getAttribute("data-id") };
        return render();
      }
      if (action === "save-set") return saveSetEdit();
      if (action === "delete-set") return deleteSet(el.getAttribute("data-id"));
      if (action === "set-unit") return setUnit(el.getAttribute("data-unit"));
      if (action === "export-json") return exportJson();
      if (action === "import-json") return chooseImportFile();
      if (action === "do-import") return doImport();
      if (action === "start-template") return startTemplate(el.getAttribute("data-id"));
      if (action === "resume-workout") return go("#/workout");
      if (action === "edit-template") return go("#/template/" + encodeURIComponent(el.getAttribute("data-id")));
      if (action === "new-template") {
        modal = { type: "new-template", value: "" };
        return render();
      }
      if (action === "save-new-template") return saveNewTemplate();
      if (action === "save-template-name") return saveTemplateName();
      if (action === "tpl-move") return moveTemplateExercise(el.getAttribute("data-id"), el.getAttribute("data-index"), el.getAttribute("data-dir"));
      if (action === "tpl-remove") return removeTemplateExercise(el.getAttribute("data-id"), el.getAttribute("data-index"));
      if (action === "tpl-add-open") {
        modal = { type: "add-template-exercise", id: el.getAttribute("data-id"), value: "" };
        return render();
      }
      if (action === "tpl-add-existing") return addTemplateExercise(el.getAttribute("data-id"), el.getAttribute("data-name"));
      if (action === "tpl-add-named") return addNamedTemplateExercise(el.getAttribute("data-id"));
      if (action === "delete-template") return deleteTemplate(el.getAttribute("data-id"));
      if (action === "wo-step-w" || action === "wo-step-r") return stepWorkout(action, el);
      if (action === "wo-add-set") return addWorkoutSet(el.getAttribute("data-id"));
      if (action === "finish-workout") return finishWorkout();
    }

    async function submitAuth() {
      if (authBusy) return;
      readAuthInputs();
      const mode = authMode === "signup" || authMode === "forgot" ? authMode : "login";
      const problem = validateAuth(mode);
      authError = "";
      authNotice = "";
      if (problem) {
        authError = problem;
        render();
        return;
      }
      authBusy = true;
      render();
      try {
        if (mode === "forgot") {
          const { error } = await sb.auth.resetPasswordForEmail(authForm.email.trim(), {
            redirectTo: currentPageUrl()
          });
          if (error) throw error;
          authNotice = "Check your email for a link to reset your password.";
          return;
        }
        if (mode === "signup") {
          const { data, error } = await sb.auth.signUp({
            email: authForm.email.trim(),
            password: authForm.password,
            options: { emailRedirectTo: currentPageUrl() }
          });
          if (error) throw error;
          if (!data.session) {
            authMode = "login";
            authForm.password = "";
            authForm.password2 = "";
            authNotice = "Check your email to confirm your account, then log in.";
          }
          return;
        }
        const { error } = await sb.auth.signInWithPassword({
          email: authForm.email.trim(),
          password: authForm.password
        });
        if (error) throw error;
        authForm.password = "";
      } catch (err) {
        authError = err.message || "Something went wrong.";
      } finally {
        authBusy = false;
        render();
      }
    }

    async function submitNewPassword() {
      if (authBusy) return;
      readAuthInputs();
      const problem = validateAuth("recovery");
      if (problem) {
        authError = problem;
        render();
        return;
      }
      authBusy = true;
      authError = "";
      render();
      try {
        const { error } = await sb.auth.updateUser({ password: authForm.password });
        if (error) throw error;
        recoveryMode = false;
        authForm.password = "";
        authForm.password2 = "";
        authBusy = false;
        if (!dataReadyFor && session) await loadAccount();
        else render();
        showToast("Password updated");
      } catch (err) {
        authError = err.message || "Couldn't update that password.";
        authBusy = false;
        render();
      }
    }

    async function saveExerciseName() {
      if (saving) return;
      const input = document.getElementById("modal-name");
      const name = (input ? input.value : (modal && modal.value) || "").trim();
      if (!name) { showToast("Give the exercise a name"); return; }
      const exists = state.exercises.some(e => e.name.toLowerCase() === name.toLowerCase() && e.id !== (modal && modal.id));
      if (exists) { showToast("That exercise already exists"); return; }
      saving = true;
      try {
        if (modal.type === "add-exercise") {
          const ex = { id: uid(), name, custom: true, createdAt: Date.now() };
          await persistExerciseInsert(ex);
          state.exercises.push(ex);
          modal = null;
          saving = false;
          showToast("Exercise added");
          go("#/exercise/" + encodeURIComponent(ex.id));
          return;
        }
        const ex = exerciseById(modal.id);
        if (!ex) { modal = null; render(); return; }
        const prev = ex.name;
        ex.name = name;
        try {
          await persistExerciseName(ex.id, name);
        } catch (err) {
          ex.name = prev;
          throw err;
        }
        modal = null;
        saving = false;
        showToast("Renamed");
      } catch (err) {
        const duplicate = err.code === "23505";
        showToast(duplicate ? "That exercise already exists" : (err.message || "Couldn't save that exercise."));
      } finally {
        saving = false;
      }
    }

    async function deleteExercise() {
      if (saving || !modal) return;
      const id = modal.id;
      const exBackup = state.exercises.slice();
      const setBackup = state.sets.slice();
      saving = true;
      state.exercises = state.exercises.filter(e => e.id !== id);
      state.sets = state.sets.filter(s => s.exerciseId !== id);
      try {
        await persistExerciseDelete(id);
        modal = null;
        saving = false;
        showToast("Exercise deleted");
        go("#/");
      } catch (err) {
        state.exercises = exBackup;
        state.sets = setBackup;
        showToast(err.message || "Couldn't delete that exercise.");
      } finally {
        saving = false;
      }
    }

    async function addSet() {
      if (saving) return;
      readDraftInputs();
      const w = parseWeight(draft.weight);
      const r = parseReps(draft.reps);
      if (w == null) { showToast("Enter a valid weight"); return; }
      if (r == null) { showToast("Enter at least 1 rep"); return; }
      const row = {
        id: uid(),
        exerciseId: route.id,
        weightLbs: toLbs(w),
        reps: r,
        createdAt: Date.now()
      };
      saving = true;
      state.sets.push(row);
      draft = { weight: String(w), reps: String(r) };
      draftExId = route.id;
      try {
        await persistSetInsert(row, w);
        saving = false;
        showToast("Set logged");
      } catch (err) {
        state.sets = state.sets.filter(s => s.id !== row.id);
        showToast(err.message || "Couldn't log that set.");
      } finally {
        saving = false;
      }
    }

    async function saveSetEdit() {
      if (saving) return;
      const s = state.sets.find(x => x.id === modal.id);
      if (!s) return closeModal();
      const w = parseWeight(document.getElementById("edit-weight").value);
      const r = parseReps(document.getElementById("edit-reps").value);
      if (w == null) { showToast("Enter a valid weight"); return; }
      if (r == null) { showToast("Enter at least 1 rep"); return; }
      const prevW = s.weightLbs;
      const prevR = s.reps;
      s.weightLbs = toLbs(w);
      s.reps = r;
      saving = true;
      try {
        await persistSetUpdate(s.id, w, r);
        modal = null;
        saving = false;
        showToast("Set updated");
      } catch (err) {
        s.weightLbs = prevW;
        s.reps = prevR;
        showToast(err.message || "Couldn't update that set.");
      } finally {
        saving = false;
      }
    }

    async function deleteSet(id) {
      if (saving) return;
      const backup = state.sets.slice();
      state.sets = state.sets.filter(s => s.id !== id);
      saving = true;
      try {
        await persistSetDelete(id);
        saving = false;
        showToast("Set deleted");
      } catch (err) {
        state.sets = backup;
        showToast(err.message || "Couldn't delete that set.");
      } finally {
        saving = false;
      }
    }

    async function setUnit(next) {
      if (next === state.settings.unit) return;
      if (next !== "lbs" && next !== "kg") return;
      const prev = state.settings.unit;
      state.settings.unit = next;
      draftExId = null;
      try {
        await persistUnit(next);
        showToast("Unit set to " + next);
      } catch (err) {
        state.settings.unit = prev;
        showToast(err.message || "Couldn't update units.");
      }
    }

    function exportJson() {
      const payload = {
        version: 2,
        settings: { unit: state.settings.unit },
        exercises: state.exercises,
        sets: state.sets
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      const day = todayKey(Date.now());
      a.href = URL.createObjectURL(blob);
      a.download = "lift-log-backup-" + day + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      showToast("Backup downloaded");
    }

    function chooseImportFile() {
      const input = document.getElementById("import-file");
      if (!input) return;
      input.value = "";
      input.onchange = () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!data || !Array.isArray(data.exercises) || !Array.isArray(data.sets)) {
              showToast("That file isn’t a valid Lift Log backup");
              return;
            }
            modal = { type: "confirm-import", data };
            render();
          } catch {
            showToast("Couldn’t read that JSON file");
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    async function doImport() {
      if (!modal || modal.type !== "confirm-import" || modal.busy) return;
      const data = modal.data;
      modal = { type: "confirm-import", data, busy: true };
      render();
      try {
        await replaceWithBackup(data);
        modal = null;
        draftExId = null;
        dataReadyFor = null;
        await loadAccount();
        showToast("Backup imported");
      } catch (err) {
        modal = null;
        dataReadyFor = null;
        showToast(err.message || "Couldn't import that backup.");
        await loadAccount();
      }
    }

    async function migrateImport() {
      if (!modal || modal.type !== "migrate-local" || modal.busy) return;
      const data = modal.data;
      modal = { type: "migrate-local", data, busy: true };
      render();
      try {
        await mergeLegacy(data);
        localStorage.setItem(migrationFlag(), new Date().toISOString());
        modal = null;
        dataReadyFor = null;
        await loadAccount();
        showToast("Saved logs imported");
      } catch (err) {
        modal = { type: "migrate-local", data, error: err.message || "Couldn't import those logs." };
        render();
      }
    }

    function templatesCacheKey() {
      return "lift-log-templates:" + (session && session.user ? session.user.id : "");
    }
    function lastTemplateKey() {
      return "lift-log-last-template:" + (session && session.user ? session.user.id : "");
    }
    function templatesSeedKey() {
      return "lift-log-templates-seeded:" + (session && session.user ? session.user.id : "");
    }
    function activeWorkoutKey() {
      return "lift-log-active-workout:" + (session && session.user ? session.user.id : "");
    }
    function isMissingSchema(error) {
      if (!error) return false;
      const code = String(error.code || "");
      const msg = String(error.message || "").toLowerCase();
      if (code === "42P01" || code === "42703" || code === "PGRST205" || code === "PGRST204") return true;
      return msg.includes("does not exist") || msg.includes("could not find") || msg.includes("schema cache");
    }
    function builtinTemplateRecords() {
      return BUILTIN_TEMPLATES.map(t => ({
        id: "local-" + t.kind,
        name: t.name,
        kind: t.kind,
        position: t.position,
        exerciseNames: t.names.slice()
      }));
    }
    function readTemplateCache() {
      try {
        const raw = localStorage.getItem(templatesCacheKey());
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.templates)) return null;
        return data;
      } catch {
        return null;
      }
    }
    function cacheTemplates() {
      if (!session || !session.user) return;
      localStorage.setItem(templatesCacheKey(), JSON.stringify({
        seeded: true,
        templates: state.templates,
        lastTemplateId: state.lastTemplateId || null
      }));
    }
    function useLocalTemplates() {
      templatesMode = "local";
      const cached = readTemplateCache();
      state.templates = cached ? cached.templates : builtinTemplateRecords();
      state.lastTemplateId = (cached && cached.lastTemplateId) || localStorage.getItem(lastTemplateKey()) || null;
      restoreActive();
    }
    function rowToTemplate(row) {
      const names = Array.isArray(row.exercise_names) ? row.exercise_names : [];
      return {
        id: row.id,
        name: row.name,
        kind: row.kind || "custom",
        position: row.position || 0,
        exerciseNames: names.map(n => String(n))
      };
    }
    function templateById(id) {
      return (state.templates || []).find(t => t.id === id);
    }
    function suggestedTemplate() {
      const last = templateById(state.lastTemplateId);
      const lastKind = last && ROTATION.indexOf(last.kind) !== -1 ? last.kind : null;
      const nextKind = lastKind ? ROTATION[(ROTATION.indexOf(lastKind) + 1) % ROTATION.length] : "push";
      return (state.templates || []).find(t => t.kind === nextKind) || null;
    }
    function restoreActive() {
      try {
        const raw = localStorage.getItem(activeWorkoutKey());
        if (!raw) { activeWorkout = null; return; }
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.exerciseIds) || !data.exerciseIds.length) {
          activeWorkout = null;
          return;
        }
        activeWorkout = data;
      } catch {
        activeWorkout = null;
      }
    }
    function persistActive() {
      if (!activeWorkout) localStorage.removeItem(activeWorkoutKey());
      else localStorage.setItem(activeWorkoutKey(), JSON.stringify(activeWorkout));
    }
    async function loadTemplates() {
      try {
        const res = await sb.from("templates").select("id,name,kind,position,exercise_names").order("position", { ascending: true });
        if (res.error) {
          console.warn(res.error);
          if (!(state.templates || []).length || isMissingSchema(res.error)) useLocalTemplates();
          return;
        }
        templatesMode = "remote";
        let rows = res.data || [];
        if (!rows.length && !localStorage.getItem(templatesSeedKey())) {
          const flag = await sb.from("user_settings").select("templates_seeded").maybeSingle();
          const already = !flag.error && flag.data && flag.data.templates_seeded;
          if (!already) {
            const cached = readTemplateCache();
            const source = cached && cached.templates && cached.templates.length ? cached.templates : null;
            rows = await seedRemoteTemplates(source);
          }
        }
        state.templates = rows.map(rowToTemplate).sort((a, b) => a.position - b.position || a.name.localeCompare(b.name));
        const lastRes = await sb.from("user_settings").select("last_template_id").maybeSingle();
        state.lastTemplateId = (lastRes.data && lastRes.data.last_template_id) || localStorage.getItem(lastTemplateKey()) || null;
        cacheTemplates();
        restoreActive();
      } catch (err) {
        console.warn(err);
        if (!(state.templates || []).length) useLocalTemplates();
      }
    }
    async function seedRemoteTemplates(source) {
      const list = source && source.length ? source : builtinTemplateRecords();
      const idMap = {};
      const rows = list.map((t, i) => {
        const id = uid();
        if (t.id) idMap[t.id] = id;
        const kind = ROTATION.indexOf(t.kind) === -1 ? "custom" : t.kind;
        return {
          id,
          user_id: session.user.id,
          name: t.name,
          kind,
          position: t.position != null ? t.position : i,
          exercise_names: t.exerciseNames || t.names || []
        };
      });
      const ins = await sb.from("templates").insert(rows);
      if (ins.error && ins.error.code !== "23505") console.warn(ins.error);
      if (state.lastTemplateId && idMap[state.lastTemplateId]) {
        state.lastTemplateId = idMap[state.lastTemplateId];
        localStorage.setItem(lastTemplateKey(), state.lastTemplateId);
      }
      const again = await sb.from("templates").select("id,name,kind,position,exercise_names").order("position", { ascending: true });
      if (again.error) return [];
      if ((again.data && again.data.length) || (ins.error && ins.error.code === "23505")) {
        localStorage.setItem(templatesSeedKey(), "1");
        await sb.from("user_settings").update({ templates_seeded: true }).eq("user_id", session.user.id);
      }
      return again.data || [];
    }
    async function saveTemplateRecord(t) {
      const names = t.exerciseNames.map(n => String(n).trim()).filter(Boolean).slice(0, 20);
      t.exerciseNames = names;
      if (templatesMode === "remote" && String(t.id).indexOf("local-") !== 0) {
        const res = await sb.from("templates").update({
          name: t.name,
          kind: t.kind,
          position: t.position,
          exercise_names: names
        }).eq("id", t.id);
        if (res.error) {
          if (!isMissingSchema(res.error)) throw asError(res.error, "Couldn't save that template.");
          templatesMode = "local";
        }
      }
      cacheTemplates();
    }
    function findExistingExercise(name) {
      const wanted = String(name || "").trim().toLowerCase();
      if (!wanted) return null;
      const exact = state.exercises.find(e => e.name.toLowerCase() === wanted);
      if (exact) return exact;
      const aliases = NAME_ALIASES[wanted] || [];
      for (const alias of aliases) {
        const hit = state.exercises.find(e => e.name.toLowerCase() === alias.toLowerCase());
        if (hit) return hit;
      }
      return null;
    }
    async function ensureExercise(name) {
      const existing = findExistingExercise(name);
      if (existing) return existing;
      const clean = String(name || "").trim().slice(0, 60);
      if (!clean) throw new Error("Give the exercise a name");
      const ex = {
        id: uid(),
        name: clean,
        custom: DEFAULT_NAMES.indexOf(clean) === -1,
        createdAt: Date.now()
      };
      await persistExerciseInsert(ex);
      state.exercises.push(ex);
      return ex;
    }
    function templateLabel(t) {
      return (t.exerciseNames || []).map(name => {
        const existing = findExistingExercise(name);
        return existing ? existing.name : name;
      }).join(" · ");
    }
    function renderWorkoutSection() {
      const templates = state.templates || [];
      const next = suggestedTemplate();
      const cards = templates.map(t => {
        const isNext = next && next.id === t.id;
        return `<article class="wo-card${isNext ? " next" : ""}">
          <button type="button" class="wo-start" data-action="start-template" data-id="${escapeHtml(t.id)}" aria-label="Start ${escapeHtml(t.name)}">
            ${isNext ? '<span class="kicker">Next</span>' : ""}
            <span class="nm">${escapeHtml(t.name)}</span>
            <span class="sub">${escapeHtml(templateLabel(t) || "No exercises yet")}</span>
          </button>
          <button type="button" class="mini" data-action="edit-template" data-id="${escapeHtml(t.id)}" aria-label="Edit ${escapeHtml(t.name)}">Edit</button>
        </article>`;
      }).join("");
      const resume = activeWorkout
        ? `<button type="button" class="resume-bar" data-action="resume-workout">Resume ${escapeHtml(activeWorkout.name)}</button>`
        : "";
      return `<div class="eyebrow">Start workout</div>
        ${resume}
        <div class="wo-list">${cards || `<div class="empty">No templates yet.</div>`}</div>
        <button type="button" class="add-ex new-template" data-action="new-template">+ New template</button>`;
    }
    function renderWorkout() {
      if (!activeWorkout) {
        return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Workout</h1>
        </header>
        <main class="screen"><div class="empty">No workout in progress.</div>
        <button class="add-ex" data-go="#/">Back to list</button></main>`;
      }
      const blocks = activeWorkout.exerciseIds.map(id => {
        const ex = exerciseById(id);
        const name = ex ? ex.name : "Missing exercise";
        ensureWorkoutDraft(id);
        const d = workoutDrafts[id];
        const prior = setsFor(id).filter(s => s.createdAt < activeWorkout.startedAt);
        const last = prior.length ? prior[prior.length - 1] : null;
        const lastTxt = last ? `Last: ${fmtWeight(last.weightLbs, true)} × ${last.reps}` : "No sets yet";
        const sessionSets = setsFor(id).filter(s => s.createdAt >= activeWorkout.startedAt);
        const logged = sessionSets.map(s => `${fmtWeight(s.weightLbs, true)} × ${s.reps}`).join(" · ");
        return `<section class="wo-block">
          <div class="wo-ex-name">${escapeHtml(name)}</div>
          <div class="wo-last">${escapeHtml(lastTxt)}</div>
          <div class="logger wo-logger">
            <div class="logger-grid">
              <div class="stepper">
                <div class="unit-lbl">Weight (${unit()})</div>
                <input id="wo-w-${escapeHtml(id)}" data-draft-weight="${escapeHtml(id)}" inputmode="decimal" type="text" value="${escapeHtml(d.weight)}" aria-label="Weight for ${escapeHtml(name)}">
                <div class="step-row">
                  <button type="button" class="step-btn" data-action="wo-step-w" data-id="${escapeHtml(id)}" data-dir="-1" aria-label="Decrease weight for ${escapeHtml(name)}">−</button>
                  <button type="button" class="step-btn" data-action="wo-step-w" data-id="${escapeHtml(id)}" data-dir="1" aria-label="Increase weight for ${escapeHtml(name)}">+</button>
                </div>
              </div>
              <div class="stepper">
                <div class="unit-lbl">Reps</div>
                <input id="wo-r-${escapeHtml(id)}" data-draft-reps="${escapeHtml(id)}" inputmode="numeric" type="text" value="${escapeHtml(d.reps)}" aria-label="Reps for ${escapeHtml(name)}">
                <div class="step-row">
                  <button type="button" class="step-btn" data-action="wo-step-r" data-id="${escapeHtml(id)}" data-dir="-1" aria-label="Decrease reps for ${escapeHtml(name)}">−</button>
                  <button type="button" class="step-btn" data-action="wo-step-r" data-id="${escapeHtml(id)}" data-dir="1" aria-label="Increase reps for ${escapeHtml(name)}">+</button>
                </div>
              </div>
            </div>
            <button type="button" class="add-set" data-action="wo-add-set" data-id="${escapeHtml(id)}" ${saving ? "disabled" : ""}>Add set</button>
          </div>
          ${logged ? `<div class="session-set">This workout: ${escapeHtml(logged)}</div>` : ""}
        </section>`;
      }).join("");
      return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>${escapeHtml(activeWorkout.name)}</h1>
        </header>
        <main class="screen">
          ${blocks}
          <div class="finish-bar">
            <button type="button" class="add-set" data-action="finish-workout">Finish workout</button>
          </div>
        </main>`;
    }
    function renderTemplateEditor() {
      const t = templateById(route.id);
      if (!t) {
        return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Template</h1>
        </header>
        <main class="screen"><div class="empty">That template is gone.</div></main>`;
      }
      const rows = t.exerciseNames.map((name, i) => `<div class="tpl-row">
        <span class="set-idx">${i + 1}</span>
        <span class="name">${escapeHtml(name)}</span>
        <button type="button" class="mini" data-action="tpl-move" data-id="${escapeHtml(t.id)}" data-index="${i}" data-dir="-1" aria-label="Move ${escapeHtml(name)} up">Up</button>
        <button type="button" class="mini" data-action="tpl-move" data-id="${escapeHtml(t.id)}" data-index="${i}" data-dir="1" aria-label="Move ${escapeHtml(name)} down">Down</button>
        <button type="button" class="mini danger" data-action="tpl-remove" data-id="${escapeHtml(t.id)}" data-index="${i}" aria-label="Remove ${escapeHtml(name)}">Remove</button>
      </div>`).join("");
      const del = t.kind === "custom"
        ? `<button type="button" class="add-ex" data-action="delete-template" data-id="${escapeHtml(t.id)}" style="margin-top:16px;color:var(--danger)">Delete template</button>`
        : "";
      return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Edit</h1>
        </header>
        <main class="screen">
          <label class="field-lbl" for="tpl-name">Name</label>
          <input class="text-input" id="tpl-name" maxlength="40" value="${escapeHtml(t.name)}">
          <button type="button" class="btn primary" data-action="save-template-name" style="width:100%;margin-bottom:16px">Save name</button>
          <div class="eyebrow">Exercises</div>
          ${rows || `<div class="empty">No exercises in this template yet.</div>`}
          <button type="button" class="add-ex" data-action="tpl-add-open" data-id="${escapeHtml(t.id)}" style="margin-top:8px">+ Add exercise</button>
          ${del}
        </main>`;
    }
    function ensureWorkoutDraft(exId) {
      const existing = workoutDrafts[exId];
      if (existing && existing.weight !== "" && existing.reps !== "") return;
      const prior = setsFor(exId).filter(s => !activeWorkout || s.createdAt < activeWorkout.startedAt);
      const last = prior.length ? prior[prior.length - 1] : null;
      workoutDrafts[exId] = last
        ? { weight: fmtWeight(last.weightLbs, false), reps: String(last.reps) }
        : { weight: unit() === "kg" ? "20" : "45", reps: "5" };
    }
    function readWorkoutDraft(exId) {
      ensureWorkoutDraft(exId);
      const w = document.getElementById("wo-w-" + exId);
      const r = document.getElementById("wo-r-" + exId);
      if (w) workoutDrafts[exId].weight = w.value;
      if (r) workoutDrafts[exId].reps = r.value;
    }
    function stepWorkout(action, el) {
      const id = el.getAttribute("data-id");
      readWorkoutDraft(id);
      const dir = Number(el.getAttribute("data-dir"));
      if (action === "wo-step-w") {
        const cur = parseWeight(workoutDrafts[id].weight);
        const base = cur == null ? 0 : cur;
        workoutDrafts[id].weight = String(Math.max(0, Math.round((base + dir * weightStep()) * 10) / 10));
      } else {
        const cur = parseReps(workoutDrafts[id].reps);
        const base = cur == null ? 0 : cur;
        workoutDrafts[id].reps = String(Math.max(1, base + dir));
      }
      render();
    }
    async function addWorkoutSet(exId) {
      if (saving) return;
      readWorkoutDraft(exId);
      const w = parseWeight(workoutDrafts[exId].weight);
      const r = parseReps(workoutDrafts[exId].reps);
      if (w == null) { showToast("Enter a valid weight"); return; }
      if (r == null) { showToast("Enter at least 1 rep"); return; }
      const row = {
        id: uid(),
        exerciseId: exId,
        weightLbs: toLbs(w),
        reps: r,
        createdAt: Date.now()
      };
      saving = true;
      state.sets.push(row);
      workoutDrafts[exId] = { weight: String(w), reps: String(r) };
      try {
        await persistSetInsert(row, w);
        saving = false;
        showToast("Set logged");
      } catch (err) {
        state.sets = state.sets.filter(s => s.id !== row.id);
        showToast(err.message || "Couldn't log that set.");
      } finally {
        saving = false;
      }
    }
    async function startTemplate(id) {
      if (saving) return;
      const t = templateById(id);
      if (!t) return;
      if (!t.exerciseNames.length) { showToast("Add an exercise to this template first"); return; }
      saving = true;
      try {
        const exerciseIds = [];
        for (const name of t.exerciseNames) {
          const ex = await ensureExercise(name);
          if (exerciseIds.indexOf(ex.id) === -1) exerciseIds.push(ex.id);
        }
        activeWorkout = {
          templateId: t.id,
          name: t.name,
          kind: t.kind,
          exerciseIds,
          startedAt: Date.now()
        };
        workoutDrafts = {};
        persistActive();
        saving = false;
        go("#/workout");
      } catch (err) {
        saving = false;
        showToast(err.message || "Couldn't start that workout.");
      }
    }
    async function finishWorkout() {
      if (!activeWorkout) return go("#/");
      const finishedId = activeWorkout.templateId;
      state.lastTemplateId = finishedId;
      localStorage.setItem(lastTemplateKey(), finishedId || "");
      if (templatesMode === "remote" && finishedId && String(finishedId).indexOf("local-") !== 0) {
        const res = await sb.from("user_settings").update({ last_template_id: finishedId }).eq("user_id", session.user.id);
        if (res.error) console.warn(res.error);
      }
      activeWorkout = null;
      workoutDrafts = {};
      persistActive();
      cacheTemplates();
      showToast("Workout finished");
      go("#/");
    }
    async function saveNewTemplate() {
      const input = document.getElementById("tpl-new-name");
      const name = (input ? input.value : (modal && modal.value) || "").trim().slice(0, 40);
      if (!name) { showToast("Give the template a name"); return; }
      if (state.templates.some(t => t.name.toLowerCase() === name.toLowerCase())) {
        showToast("That template already exists");
        return;
      }
      try {
        const t = {
          id: uid(),
          name,
          kind: "custom",
          position: state.templates.length,
          exerciseNames: []
        };
        if (templatesMode === "remote") {
          const res = await sb.from("templates").insert({
            id: t.id,
            user_id: session.user.id,
            name: t.name,
            kind: "custom",
            position: t.position,
            exercise_names: []
          });
          if (res.error) {
            if (!isMissingSchema(res.error)) throw asError(res.error, "Couldn't create that template.");
            templatesMode = "local";
            t.id = "local-" + t.id;
          }
        } else {
          t.id = "local-" + t.id;
        }
        state.templates.push(t);
        cacheTemplates();
        modal = null;
        go("#/template/" + encodeURIComponent(t.id));
      } catch (err) {
        showToast(err.message || "Couldn't create that template.");
      }
    }
    async function saveTemplateName() {
      const t = templateById(route.id);
      const input = document.getElementById("tpl-name");
      if (!t || !input) return;
      const name = input.value.trim().slice(0, 40);
      if (!name) { showToast("Give the template a name"); return; }
      if (state.templates.some(other => other.id !== t.id && other.name.toLowerCase() === name.toLowerCase())) {
        showToast("That template already exists");
        return;
      }
      const prev = t.name;
      t.name = name;
      try {
        await saveTemplateRecord(t);
        showToast("Template saved");
      } catch (err) {
        t.name = prev;
        showToast(err.message || "Couldn't save that template.");
      }
    }
    async function moveTemplateExercise(id, index, dir) {
      const t = templateById(id);
      const i = parseInt(index, 10);
      const delta = Number(dir);
      if (!t || !Number.isFinite(i)) return;
      const j = i + delta;
      if (j < 0 || j >= t.exerciseNames.length) return;
      const names = t.exerciseNames.slice();
      const swap = names[i];
      names[i] = names[j];
      names[j] = swap;
      t.exerciseNames = names;
      try {
        await saveTemplateRecord(t);
        render();
      } catch (err) {
        showToast(err.message || "Couldn't save that template.");
      }
    }
    async function removeTemplateExercise(id, index) {
      const t = templateById(id);
      const i = parseInt(index, 10);
      if (!t || !Number.isFinite(i)) return;
      t.exerciseNames = t.exerciseNames.filter((_, n) => n !== i);
      try {
        await saveTemplateRecord(t);
        render();
      } catch (err) {
        showToast(err.message || "Couldn't save that template.");
      }
    }
    async function addTemplateExercise(id, name) {
      const clean = String(name || "").trim().slice(0, 60);
      const t = templateById(id);
      if (!t || !clean) return;
      if (t.exerciseNames.some(n => n.toLowerCase() === clean.toLowerCase())) {
        showToast("That exercise is already in the template");
        return;
      }
      t.exerciseNames = t.exerciseNames.concat(clean);
      try {
        await saveTemplateRecord(t);
        modal = null;
        showToast("Exercise added");
      } catch (err) {
        t.exerciseNames = t.exerciseNames.slice(0, -1);
        showToast(err.message || "Couldn't save that template.");
      }
    }
    function addNamedTemplateExercise(id) {
      const input = document.getElementById("tpl-add-name");
      const name = input ? input.value : (modal && modal.value) || "";
      return addTemplateExercise(id, name);
    }
    async function deleteTemplate(id) {
      const t = templateById(id);
      if (!t || t.kind !== "custom") return;
      if (templatesMode === "remote" && String(id).indexOf("local-") !== 0) {
        const res = await sb.from("templates").delete().eq("id", id);
        if (res.error && !isMissingSchema(res.error)) {
          showToast(res.error.message || "Couldn't delete that template.");
          return;
        }
      }
      state.templates = state.templates.filter(item => item.id !== id);
      if (state.lastTemplateId === id) state.lastTemplateId = null;
      cacheTemplates();
      showToast("Template deleted");
      go("#/");
    }


    window.addEventListener("hashchange", () => {
      if (isAuthHash(location.hash)) return;
      route = parseHash();
      if (route.name !== "exercise") draftExId = null;
      if (!modal || modal.type !== "migrate-local") modal = null;
      render();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal && modal.type !== "migrate-local" && !modal.busy) closeModal();
    });

    sb.auth.onAuthStateChange((event, sess) => onAuth(event, sess));

    setTimeout(() => {
      if (authResolved) return;
      sb.auth.getSession().then(({ data }) => {
        if (authResolved) return;
        bootFromSession(data && data.session ? "SIGNED_IN" : "INITIAL_SESSION", (data && data.session) || null);
      }).catch(() => {
        if (authResolved) return;
        authResolved = true;
        loading = false;
        authError = authError || "Couldn't check your session.";
        render();
      });
    }, 2500);

    render();
  })();
  </script>
</body>
</html>
