<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="application-name" content="Lift Log">
  <meta name="description" content="Log your lifts by exercise. Each account keeps its own history.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0d'/%3E%3Crect x='4' y='14' width='24' height='4' rx='1' fill='%23ff6a2a'/%3E%3Crect x='3' y='10' width='5' height='12' rx='1.5' fill='%23ffd7a8'/%3E%3Crect x='24' y='10' width='5' height='12' rx='1.5' fill='%23ffd7a8'/%3E%3C/svg%3E">
  <title>Lift Log</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --bg-elev: #121216;
      --surface: #18181e;
      --surface-2: #202028;
      --line: #2a2a34;
      --text: #f4f1ec;
      --muted: #8d8a86;
      --faint: #5c5a58;
      --accent: #ff6a2a;
      --accent-2: #ffd7a8;
      --accent-dim: rgba(255, 106, 42, 0.16);
      --good: #3ee08f;
      --good-dim: rgba(62, 224, 143, 0.12);
      --danger: #ff5a5a;
      --danger-dim: rgba(255, 90, 90, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --radius: 18px;
      --tap: 52px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      overscroll-behavior: none;
    }
    button, input { font: inherit; color: inherit; }
    button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; }
    input { background: none; border: 0; outline: none; }
    input[type="number"] { -moz-appearance: textfield; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(24px + var(--safe-b));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(10px + var(--safe-t)) 14px 10px;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
    }
    .topbar.scrolled { border-bottom-color: var(--line); }
    .topbar h1 {
      flex: 1;
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--accent);
      display: grid;
      place-items: center;
    }
    .brand-mark svg { display: block; }
    .brand h1 { font-size: 22px; }

    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--text);
      flex-shrink: 0;
    }
    .icon-btn:active { background: var(--surface-2); transform: scale(0.96); }
    .icon-btn.ghost { color: var(--muted); }

    .screen { padding: 8px 16px 0; flex: 1; }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 8px 2px 10px;
    }

    .ex-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
    .ex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px 10px 16px;
      min-height: 64px;
    }
    .ex-row:active { transform: scale(0.99); background: var(--surface-2); }
    .ex-row .meta { flex: 1; min-width: 0; }
    .ex-row .name {
      font-weight: 650;
      font-size: 17px;
      letter-spacing: -0.02em;
      display: block;
    }
    .ex-row .last {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      display: block;
    }
    .ex-row .chev { color: var(--faint); flex-shrink: 0; }
    .add-ex-wrap {
      position: sticky;
      bottom: 0;
      margin: 8px -16px 0;
      padding: 14px 16px calc(8px + var(--safe-b));
      background: linear-gradient(180deg, transparent, var(--bg) 36%);
    }
    .add-ex {
      width: 100%;
      min-height: var(--tap);
      border-radius: var(--radius);
      border: 1.5px dashed #3a3a44;
      background: var(--bg-elev);
      color: var(--accent-2);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .add-ex:active { background: var(--surface); }

    .pr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pr-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
    }
    .pr-card .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .pr-card .val {
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.04em;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .pr-card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .pr-card.best .val { color: var(--good); }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 12px 8px;
      margin-bottom: 16px;
    }
    .chart-card .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 2px 4px 8px;
    }
    .chart-wrap { height: 128px; }
    .chart-wrap svg { width: 100%; height: 100%; display: block; }
    .chart-empty {
      height: 128px;
      display: grid;
      place-items: center;
      color: var(--faint);
      font-size: 13px;
    }

    .logger {
      background: linear-gradient(180deg, #1a1a22 0%, var(--surface) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 14px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .logger-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
    }
    .stepper { text-align: center; }
    .stepper .unit-lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stepper input {
      width: 100%;
      min-width: 0;
      text-align: center;
      font-size: 40px;
      font-weight: 750;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      padding: 2px 0 4px;
      height: 52px;
    }
    .step-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }
    .step-btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 26px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent-2);
    }
    .step-btn:active { background: var(--accent-dim); transform: scale(0.95); }
    .add-set {
      margin-top: 14px;
      width: 100%;
      height: 58px;
      border-radius: 16px;
      background: var(--accent);
      color: #1a0a00;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.02em;
    }
    .add-set:active { filter: brightness(0.92); transform: scale(0.99); }
    .add-set:disabled { opacity: 0.45; }

    .day-group { margin-bottom: 16px; }
    .day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 4px 8px;
    }
    .day-head .when { font-weight: 700; font-size: 14px; }
    .day-head .vol { color: var(--muted); font-size: 12px; }
    .set-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 8px 8px 14px;
      margin-bottom: 6px;
      min-height: 52px;
    }
    .set-idx {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      width: 18px;
    }
    .set-main { flex: 1; font-weight: 650; font-variant-numeric: tabular-nums; }
    .set-main span { color: var(--muted); font-weight: 500; }
    .row-actions { display: flex; gap: 4px; }
    .mini {
      min-width: 44px;
      height: 44px;
      padding: 0 10px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .mini:active { background: var(--surface-2); }
    .mini.danger { color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 22px 12px;
      font-size: 14px;
    }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      width: 100%;
      text-align: left;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
    }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row .k { font-weight: 650; }
    .settings-row .d { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .settings-row:active.tappable { background: var(--surface-2); }

    .seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
    }
    .seg button {
      min-width: 64px;
      height: 36px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
    }
    .seg button.on {
      background: var(--accent);
      color: #1a0a00;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      padding: 4px 8px 16px;
      line-height: 1.5;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-elev);
      border-radius: 22px 22px 0 0;
      padding: 10px 16px calc(20px + var(--safe-b));
      border-top: 1px solid var(--line);
      animation: up 0.22s ease;
    }
    @keyframes up {
      from { transform: translateY(16px); opacity: 0.6; }
      to { transform: none; opacity: 1; }
    }
    .grab {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: #3a3a44;
      margin: 4px auto 14px;
    }
    .sheet h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: -0.02em; }
    .field-lbl {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .text-input, .num-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 17px;
      margin-bottom: 14px;
    }
    .num-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sheet-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      font-weight: 750;
    }
    .btn.primary { background: var(--accent); color: #1a0a00; }
    .btn.primary:active { filter: brightness(0.92); }
    .btn.ghost { background: var(--surface-2); color: var(--text); }
    .btn.danger { background: var(--danger-dim); color: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + var(--safe-b));
      transform: translateX(-50%);
      background: #f4f1ec;
      color: #16140f;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      z-index: 80;
      box-shadow: var(--shadow);
      animation: pop 0.2s ease;
      max-width: calc(100% - 32px);
    }
    @keyframes pop {
      from { transform: translateX(-50%) translateY(8px); opacity: 0; }
      to { transform: translateX(-50%); opacity: 1; }
    }

    .more-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .more-menu button {
      text-align: left;
      padding: 14px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 650;
      min-height: 52px;
    }
    .more-menu button:active { background: var(--surface-2); }
    .more-menu button.warn { color: var(--danger); }

    .settings-row > div:first-child { min-width: 0; flex: 1; }
    .settings-row .d { overflow-wrap: anywhere; }

    .auth-card {
      background: linear-gradient(180deg, #1a1a22 0%, var(--surface) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 16px 16px;
      margin-top: 8px;
      box-shadow: var(--shadow);
    }
    .auth-card h2 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    .auth-lead {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 16px;
      line-height: 1.45;
    }
    .auth-links { display: flex; flex-direction: column; margin-top: 6px; }
    .auth-link {
      min-height: 44px;
      padding: 10px 8px;
      color: var(--accent-2);
      font-weight: 650;
      width: 100%;
      text-align: center;
    }
    .auth-link:active { opacity: 0.7; }
    .form-error {
      color: var(--danger);
      background: var(--danger-dim);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .form-note {
      color: var(--accent-2);
      background: var(--accent-dim);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .status-block {
      min-height: 52dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      color: var(--muted);
      padding: 12px 8px 24px;
    }
    .status-block h2 { color: var(--text); margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .status-block .add-set { width: min(100%, 320px); }
    .status-block .form-error { width: min(100%, 320px); text-align: left; }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn:disabled, .add-set:disabled { opacity: 0.45; }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }

    .wo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .wo-card {
      display: flex;
      align-items: stretch;
      gap: 4px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 6px 6px 14px;
      min-height: 84px;
    }
    .wo-card.next {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(255, 106, 42, 0.18), var(--surface) 58%);
    }
    .wo-start { flex: 1; min-width: 0; text-align: left; padding: 8px 4px; }
    .wo-start .kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .wo-start .nm {
      display: block;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin-top: 2px;
    }
    .wo-start .sub {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wo-card .mini { align-self: center; }
    .resume-bar {
      width: 100%;
      min-height: 52px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: var(--accent);
      color: #1a0a00;
      font-weight: 800;
    }
    .new-template { margin: 4px 0 18px; }
    .wo-block {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 12px 10px;
      margin-bottom: 12px;
    }
    .wo-ex-name { font-weight: 750; font-size: 17px; letter-spacing: -0.02em; }
    .wo-last { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .wo-logger { margin: 10px 0 0; box-shadow: none; padding: 12px; }
    .wo-logger .stepper input { font-size: 32px; height: 44px; }
    .session-set { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .finish-bar {
      position: sticky;
      bottom: 0;
      margin: 8px -16px 0;
      padding: 12px 16px calc(8px + var(--safe-b));
      background: linear-gradient(180deg, transparent, var(--bg) 28%);
    }
    .tpl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 8px 8px 14px;
      margin-bottom: 6px;
      min-height: 52px;
    }
    .tpl-row .name { flex: 1; min-width: 0; font-weight: 650; }
    .pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; margin-bottom: 12px; }
    .pick-list button {
      text-align: left;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 650;
    }

  </style>
</head>

      "pull-up": ["Lat Pulldown"],
      "lat pulldown": ["Pull-up"]
    };

    const appEl = document.getElementById("app");
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      appEl.innerHTML = statusBlock("Couldn't load the sign-in library. Check your connection and refresh.", false);
      return;
    }

    let sb;
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          // Implicit flow puts the recovery tokens in the URL hash and emits PASSWORD_RECOVERY.
          flowType: "implicit",
          storage: window.localStorage
        }
      });
    } catch (err) {
      appEl.innerHTML = statusBlock("Couldn't start sign-in. Refresh and try again.", false);
      return;
    }

    let state = blankState();
    let route = parseHash();
    let modal = null;
    let toastTimer = 0;
    let toastMsg = "";
    let draft = { weight: "", reps: "" };
    let draftExId = null;
    let session = null;
    let authMode = "login";
    let authForm = { email: "", password: "", password2: "" };
    let authError = readAuthHashError();
    let authNotice = "";
    let authBusy = false;
    let authResolved = false;
    let recoveryMode = hashSignalsRecovery();
    let loading = false;
    let bootError = "";
    let dataReadyFor = null;
    let loadSeq = 0;
    let accountLoad = null;
    let saving = false;
    let focusAuthField = "";
    let templatesMode = "local";
    let activeWorkout = null;
    let workoutDrafts = {};

    function blankState() {
      return {
        version: 2,
        settings: { unit: "lbs" },
        exercises: [],
        sets: [],
        templates: [],
        lastTemplateId: null
      };
    }

    function statusBlock(message, spinning) {
      return `<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">${barbellIcon()}</div><h1>Lift Log</h1></div></header>
        <main class="screen"><div class="status-block">
          ${spinning ? '<div class="spinner" aria-hidden="true"></div>' : ""}
          <h2>${escapeHtml(message)}</h2>
        </div></main>`;
    }

    function uid() {
      if (globalThis.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function hashSignalsRecovery() {
      return /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
    }

    function isAuthHash(hash) {
      return /access_token=|refresh_token=|error=|type=/.test(hash || "");
    }

    function readAuthHashError() {
      const raw = (location.hash || "").replace(/^#/, "");
      if (!raw || raw.startsWith("/") || raw.indexOf("error=") === -1) return "";
      const params = new URLSearchParams(raw);
      return (params.get("error_description") || params.get("error") || "").replace(/\+/g, " ");
    }

    function stripAuthParams() {
      const hash = location.hash || "";
      const search = location.search || "";
      if (!isAuthHash(hash) && !/[?&]code=/.test(search)) return;
      const url = new URL(location.href);
      url.hash = "";
      url.searchParams.delete("code");
      history.replaceState(null, "", url.pathname + url.search);
      route = parseHash();
    }

    function currentPageUrl() {
      const url = new URL(location.href);
      url.hash = "";
      return url.toString();
    }

    function parseHash() {
      const raw = location.hash || "";
      if (isAuthHash(raw)) return { name: "home" };
      const h = raw.replace(/^#/, "") || "/";
      if (h === "/settings") return { name: "settings" };
      if (h === "/workout") return { name: "workout" };
      const tm = h.match(/^\/template\/([^/]+)$/);
      if (tm) return { name: "template", id: decodeURIComponent(tm[1]) };
      const m = h.match(/^\/exercise\/([^/]+)$/);
      if (m) return { name: "exercise", id: decodeURIComponent(m[1]) };
      return { name: "home" };
    }

    function go(hash) {
      if (location.hash === hash) render();
      else location.hash = hash;
    }

    function unit() { return state.settings.unit; }
    function toDisplay(lbs) {
      if (unit() === "kg") return lbs / LB_PER_KG;
      return lbs;
    }
    function toLbs(val) {
      if (unit() === "kg") return val * LB_PER_KG;
      return val;
    }
    function toLbsFrom(weight, fromUnit) {
      const n = typeof weight === "number" ? weight : parseFloat(weight);
      if (!Number.isFinite(n)) return 0;
      if (fromUnit === "kg") return n * LB_PER_KG;
      return n;
    }
    function fmtWeight(lbs, withUnit) {
      const n = toDisplay(lbs);
      const rounded = unit() === "kg" ? Math.round(n * 10) / 10 : Math.round(n * 2) / 2;
      const s = unit() === "kg"
        ? (Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1))
        : (Number.isInteger(rounded) ? String(rounded) : String(rounded));
      return withUnit ? s + " " + unit() : s;
    }
    function weightStep() { return unit() === "kg" ? 2.5 : 5; }
    function epley(lbs, reps) {
      if (!reps || reps < 1 || !lbs) return 0;
      if (reps === 1) return lbs;
      return lbs * (1 + reps / 30);
    }
    function todayKey(ts) {
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
    function formatDay(key) {
      const [y, m, d] = key.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      const today = todayKey(Date.now());
      const yest = todayKey(Date.now() - 86400000);
      if (key === today) return "Today";
      if (key === yest) return "Yesterday";
      return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }
    function repLabel(n) { return n === 1 ? "1 rep" : n + " reps"; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"'`]/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;"
      }[c]));
    }
    function toIso(ts) {
      const n = typeof ts === "number" ? ts : Date.parse(ts);
      if (!Number.isFinite(n)) return new Date().toISOString();
      return new Date(n).toISOString();
    }
    function asError(error, fallback) {
      const err = new Error((error && error.message) || fallback || "Something went wrong.");
      if (error && error.code) err.code = error.code;
      return err;
    }
    function migrationFlag() {
      return "lift-log-v1-migrated:" + (session && session.user ? session.user.id : "");
    }
    function readLegacy() {
      try {
        const raw = localStorage.getItem(LEGACY_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.exercises) || !Array.isArray(data.sets)) return null;
        return data;
      } catch {
        return null;
      }
    }

    function setsFor(exId) {
      return state.sets.filter(s => s.exerciseId === exId).sort((a, b) => a.createdAt - b.createdAt);
    }
    function lastSet(exId) {
      const list = setsFor(exId);
      return list.length ? list[list.length - 1] : null;
    }
    function prsFor(exId) {
      const list = setsFor(exId);
      if (!list.length) return { heaviest: null, epley: null };
      let heaviest = list[0];
      let best = list[0];
      let bestVal = epley(list[0].weightLbs, list[0].reps);
      for (const s of list) {
        if (s.weightLbs > heaviest.weightLbs) heaviest = s;
        const v = epley(s.weightLbs, s.reps);
        if (v > bestVal) { bestVal = v; best = s; }
      }
      return { heaviest, epley: { set: best, value: bestVal } };
    }
    function topWeightByDay(exId) {
      const map = new Map();
      for (const s of setsFor(exId)) {
        const k = todayKey(s.createdAt);
        const prev = map.get(k);
        if (!prev || s.weightLbs > prev) map.set(k, s.weightLbs);
      }
      return Array.from(map.entries()).map(([date, weightLbs]) => ({ date, weightLbs }));
    }
    function ensureDraft(exId) {
      if (draftExId === exId && draft.weight !== "" && draft.reps !== "") return;
      const last = lastSet(exId);
      if (last) {
        draft = { weight: fmtWeight(last.weightLbs, false), reps: String(last.reps) };
      } else {
        draft = { weight: unit() === "kg" ? "20" : "45", reps: "5" };
      }
      draftExId = exId;
    }
    function showToast(msg) {
      toastMsg = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastMsg = ""; render(); }, 1800);
      render();
    }
    function exerciseById(id) {
      return state.exercises.find(e => e.id === id);
    }
    function signedInEmail() {
      return (session && session.user && session.user.email) || "";
    }

    function applyServerState(exercises, sets, settings) {
      const templates = state.templates || [];
      const lastTemplateId = state.lastTemplateId || null;
      state = {
        version: 2,
        settings: { unit: settings && settings.unit === "kg" ? "kg" : "lbs" },
        exercises: (exercises || []).map(ex => ({
          id: ex.id,
          name: ex.name,
          custom: !!ex.custom,
          createdAt: ex.created_at ? new Date(ex.created_at).getTime() : Date.now()
        })),
        sets: (sets || []).map(s => ({
          id: s.id,
          exerciseId: s.exercise_id,
          weightLbs: toLbsFrom(s.weight, s.unit),
          reps: parseInt(s.reps, 10),
          createdAt: new Date(s.performed_at).getTime()
        })),
        templates,
        lastTemplateId
      };
    }

    async function fetchAll() {
      const [exRes, setRes, settingsRes] = await Promise.all([
        sb.from("exercises").select("id,name,custom,created_at").order("created_at", { ascending: true }),
        sb.from("sets").select("id,exercise_id,weight,reps,unit,performed_at").order("performed_at", { ascending: true }),
        sb.from("user_settings").select("unit").maybeSingle()
      ]);
      if (exRes.error) throw asError(exRes.error, "Couldn't load exercises.");
      if (setRes.error) throw asError(setRes.error, "Couldn't load sets.");
      if (settingsRes.error) throw asError(settingsRes.error, "Couldn't load settings.");
      return {
        exercises: exRes.data || [],
        sets: setRes.data || [],
        settings: settingsRes.data
      };
    }

    async function seedAccount(uid) {
      const rows = DEFAULT_NAMES.map(name => ({ user_id: uid, name, custom: false }));
      const ex = await sb.from("exercises").insert(rows);
      if (ex.error) throw asError(ex.error, "Couldn't set up your exercises.");
      const st = await sb.from("user_settings").insert({ user_id: uid, unit: "lbs" });
      if (st.error) throw asError(st.error, "Couldn't set up your settings.");
    }

    function offerMigration() {
      if (!session || !session.user) return;
      if (localStorage.getItem(migrationFlag())) return;
      const data = readLegacy();
      if (!data) return;
      modal = { type: "migrate-local", data };
    }

    function loadAccount() {
      if (accountLoad) return accountLoad;
      accountLoad = doLoad().finally(() => { accountLoad = null; });
      return accountLoad;
    }

    async function doLoad() {
      const seq = ++loadSeq;
      const uid = session && session.user && session.user.id;
      if (!uid) return;
      loading = true;
      bootError = "";
      render();
      try {
        let pack = await fetchAll();
        if (seq !== loadSeq) return;
        const brandNew = !pack.settings && pack.exercises.length === 0 && pack.sets.length === 0;
        if (brandNew) {
          await seedAccount(uid);
          if (seq !== loadSeq) return;
          pack = await fetchAll();
        } else if (!pack.settings) {
          const st = await sb.from("user_settings").insert({ user_id: uid, unit: "lbs" });
          if (st.error) throw asError(st.error, "Couldn't set up your settings.");
          pack.settings = { unit: "lbs" };
        }
        if (seq !== loadSeq) return;
        applyServerState(pack.exercises, pack.sets, pack.settings);
        await loadTemplates();
        if (seq !== loadSeq) return;
        dataReadyFor = uid;
        loading = false;
        bootError = "";
        offerMigration();
        render();
      } catch (err) {
        if (seq !== loadSeq) return;
        console.error(err);
        loading = false;
        bootError = err.message || "Couldn't load your log.";
        render();
      }
    }

    async function persistExerciseInsert(ex) {
      const res = await sb.from("exercises").insert({
        id: ex.id,
        user_id: session.user.id,
        name: ex.name,
        custom: !!ex.custom,
        created_at: new Date(ex.createdAt).toISOString()
      });
      if (res.error) throw asError(res.error, "Couldn't add that exercise.");
    }

    async function persistExerciseName(id, name) {
      const res = await sb.from("exercises").update({ name }).eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't rename that exercise.");
    }

    async function persistExerciseDelete(id) {
      const res = await sb.from("exercises").delete().eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't delete that exercise.");
    }

    async function persistSetInsert(row, displayWeight) {
      const res = await sb.from("sets").insert({
        id: row.id,
        user_id: session.user.id,
        exercise_id: row.exerciseId,
        weight: displayWeight,
        reps: row.reps,
        unit: unit(),
        performed_at: new Date(row.createdAt).toISOString()
      });
      if (res.error) throw asError(res.error, "Couldn't log that set.");
    }

    async function persistSetUpdate(id, displayWeight, reps) {
      const res = await sb.from("sets").update({
        weight: displayWeight,
        reps,
        unit: unit()
      }).eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't update that set.");
    }

    async function persistSetDelete(id) {
      const res = await sb.from("sets").delete().eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't delete that set.");
    }

    async function persistUnit(next) {
      const res = await sb.from("user_settings").upsert({
        user_id: session.user.id,
        unit: next,
        updated_at: new Date().toISOString()
      }, { onConflict: "user_id" });
      if (res.error) throw asError(res.error, "Couldn't update units.");
    }

    function rowsFromBackup(data) {
      const idMap = new Map();
      const seen = new Map();
      const exRows = [];
      for (const ex of data.exercises) {
        const name = String((ex && ex.name) || "").trim().slice(0, 60);
        if (!name) continue;
        const key = name.toLowerCase();
        if (seen.has(key)) {
          if (ex.id != null) idMap.set(ex.id, seen.get(key));
          continue;
        }
        const id = uid();
        seen.set(key, id);
        if (ex.id != null) idMap.set(ex.id, id);
        exRows.push({
          id,
          user_id: session.user.id,
          name,
          custom: !!(ex && ex.custom),
          created_at: toIso(ex && ex.createdAt)
        });
      }
      const setRows = [];
      for (const s of data.sets) {
        const exerciseId = idMap.get(s.exerciseId);
        if (!exerciseId) continue;
        const weight = toLbsFrom(s.weightLbs, "lbs");
        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(weight) || weight < 0 || !Number.isFinite(reps) || reps < 1) continue;
        setRows.push({
          id: uid(),
          user_id: session.user.id,
          exercise_id: exerciseId,
          weight,
          reps,
          unit: "lbs",
          performed_at: toIso(s.createdAt)
        });
      }
      const unitName = data.settings && data.settings.unit === "kg" ? "kg" : "lbs";
      return { exRows, setRows, unitName };
    }

    async function replaceWithBackup(data) {
      const built = rowsFromBackup(data);
      const uidNow = session.user.id;
      const deleted = await sb.from("exercises").delete().eq("user_id", uidNow);
      if (deleted.error) throw asError(deleted.error, "Couldn't replace your log.");
      if (built.exRows.length) {
        const ex = await sb.from("exercises").insert(built.exRows);
        if (ex.error) throw asError(ex.error, "Couldn't import exercises.");
      }
      if (built.setRows.length) {
        const sets = await sb.from("sets").insert(built.setRows);
        if (sets.error) throw asError(sets.error, "Couldn't import sets.");
      }
      await persistUnit(built.unitName);
    }

    async function mergeLegacy(data) {
      const nameToId = new Map(state.exercises.map(e => [e.name.trim().toLowerCase(), e.id]));
      const idMap = new Map();
      const newRows = [];
      for (const ex of data.exercises) {
        const name = String((ex && ex.name) || "").trim().slice(0, 60);
        if (!name) continue;
        const key = name.toLowerCase();
        let id = nameToId.get(key);
        if (!id) {
          id = uid();
          nameToId.set(key, id);
          newRows.push({
            id,
            user_id: session.user.id,
            name,
            custom: ex.custom !== false,
            created_at: toIso(ex.createdAt)
          });
        }
        if (ex.id != null) idMap.set(ex.id, id);
      }
      if (newRows.length) {
        const ex = await sb.from("exercises").insert(newRows);
        if (ex.error) throw asError(ex.error, "Couldn't import exercises.");
      }
      const setRows = [];
      for (const s of data.sets) {
        const exerciseId = idMap.get(s.exerciseId);
        if (!exerciseId) continue;
        const weight = toLbsFrom(s.weightLbs, "lbs");
        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(weight) || weight < 0 || !Number.isFinite(reps) || reps < 1) continue;
        setRows.push({
          id: uid(),
          user_id: session.user.id,
          exercise_id: exerciseId,
          weight,
          reps,
          unit: "lbs",
          performed_at: toIso(s.createdAt)
        });
      }
      if (setRows.length) {
        const sets = await sb.from("sets").insert(setRows);
        if (sets.error) throw asError(sets.error, "Couldn't import sets.");
      }
      if (data.settings && (data.settings.unit === "kg" || data.settings.unit === "lbs")) {
        await persistUnit(data.settings.unit);
      }
    }

    function onAuth(event, sess) {
      if (event === "PASSWORD_RECOVERY") recoveryMode = true;
      if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
        if (sess) session = sess;
        return;
      }
      const next = (!sess || event === "SIGNED_OUT") ? null : sess;
      if (!next) {
        session = null;
        loadSeq++;
      } else {
        session = next;
        if (!recoveryMode && dataReadyFor !== next.user.id) {
          loading = true;
          bootError = "";
        }
      }
      setTimeout(() => bootFromSession(event, next), 0);
    }

    function bootFromSession(event, sess) {
      if (recoveryMode && sess && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        session = sess;
        authResolved = true;
        loading = false;
        stripAuthParams();
        render();
        return;
      }
      if (!sess) {
        const failedRecovery = recoveryMode;
        session = null;
        recoveryMode = false;
        dataReadyFor = null;
        state = blankState();
        activeWorkout = null;
        workoutDrafts = {};
        templatesMode = "local";
        modal = null;
        draft = { weight: "", reps: "" };
        draftExId = null;
        loading = false;
        bootError = "";
        authResolved = true;
        authBusy = false;
        authMode = "login";
        authNotice = "";
        authForm.password = "";
        authForm.password2 = "";
        if (failedRecovery) {
          authMode = "forgot";
          authError = authError || "This reset link is invalid or expired.";
        } else {
          authError = "";
        }
        stripAuthParams();
        render();
        return;
      }
      session = sess;
      authResolved = true;
      stripAuthParams();
      if (dataReadyFor === sess.user.id && !bootError) {
        loading = false;
        render();
        return;
      }
      loadAccount();
    }

    function svgChart(points) {
      if (!points.length) return '<div class="chart-empty">Log a few sessions to see your trend</div>';
      const w = 360, h = 128, padL = 8, padR = 8, padT = 12, padB = 22;
      const ys = points.map(p => toDisplay(p.weightLbs));
      let min = Math.min(...ys), max = Math.max(...ys);
      if (min === max) { min = min * 0.9; max = max * 1.1 || 1; }
      const span = max - min || 1;
      const x = (i) => {
        if (points.length === 1) return w / 2;
        return padL + (i / (points.length - 1)) * (w - padL - padR);
      };
      const y = (v) => padT + (1 - (v - min) / span) * (h - padT - padB);
      const coords = points.map((p, i) => [x(i), y(toDisplay(p.weightLbs))]);
      const line = coords.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
      const area = line + " L" + coords[coords.length - 1][0].toFixed(1) + " " + (h - padB) +
        " L" + coords[0][0].toFixed(1) + " " + (h - padB) + " Z";
      const dots = coords.map((c, i) => {
        const last = i === coords.length - 1;
        return `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${last ? 4.5 : 3.2}" fill="${last ? "#ff6a2a" : "#ffd7a8"}" />`;
      }).join("");
      const lastPt = coords[coords.length - 1];
      const lastVal = fmtWeight(points[points.length - 1].weightLbs, false);
      const valX = Math.min(w - 16, Math.max(16, lastPt[0] + (points.length === 1 ? 0 : 8)));
      const valAnchor = points.length === 1 ? "middle" : (lastPt[0] > w - 50 ? "end" : "start");
      const firstLbl = points[0].date.slice(5);
      const lastLbl = points[points.length - 1].date.slice(5);
      const dateLabels = firstLbl === lastLbl
        ? `<text x="${w / 2}" y="${h - 6}" fill="#8d8a86" font-size="10" text-anchor="middle">${escapeHtml(firstLbl)}</text>`
        : `<text x="${padL}" y="${h - 6}" fill="#8d8a86" font-size="10">${escapeHtml(firstLbl)}</text>
        <text x="${w - padR}" y="${h - 6}" fill="#8d8a86" font-size="10" text-anchor="end">${escapeHtml(lastLbl)}</text>`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Top set weight over time">
        <path d="${area}" fill="rgba(255,106,42,0.14)"></path>
        <path d="${line}" fill="none" stroke="#ff6a2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}
        <text x="${valX.toFixed(1)}" y="${Math.max(12, lastPt[1] - 10).toFixed(1)}" fill="#ffd7a8" font-size="11" font-weight="700" text-anchor="${valAnchor}">${escapeHtml(lastVal)}</text>
        ${dateLabels}
      </svg>`;
    }

    function screenName() {
      if (recoveryMode) return "recovery";
      if (!authResolved || (session && loading)) return "loading";
      if (!session) return "auth";
      if (bootError) return "error";
      if (route.name === "settings") return "settings";
      if (route.name === "exercise") return "exercise";
      if (route.name === "workout") return "workout";
      if (route.name === "template") return "template";
      return "home";
    }

    function render() {
      const scrollY = window.scrollY;
      const active = document.activeElement;
      const activeId = active && active.id;
      const activePos = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
      const screen = screenName();
      appEl.dataset.screen = screen;

      let html = "";
      if (screen === "recovery") html = renderRecovery();
      else if (screen === "loading") html = renderLoading();
      else if (screen === "auth") html = renderAuth();
      else if (screen === "error") html = renderBootError();
      else if (screen === "settings") html = renderSettings();
      else if (screen === "exercise") html = renderExercise();
      else if (screen === "workout") html = renderWorkout();
      else if (screen === "template") html = renderTemplateEditor();
      else html = renderHome();

      const showModal = screen !== "auth" && screen !== "loading" && screen !== "recovery" && screen !== "error";
      if (showModal && modal) html += renderModal();
      if (toastMsg) html += `<div class="toast" role="status">${escapeHtml(toastMsg)}</div>`;
      appEl.innerHTML = html;
      hydrateAuthFields();
      bind();

      if (focusAuthField) {
        const preferred = document.getElementById(focusAuthField);
        focusAuthField = "";
        if (preferred) {
          preferred.focus();
          return;
        }
      }
      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (activePos && el.setSelectionRange) {
            try { el.setSelectionRange(activePos[0], activePos[1]); } catch {}
          }
        }
      } else {
        window.scrollTo(0, scrollY);
      }
    }

    function hydrateAuthFields() {
      const email = document.getElementById("auth-email");
      const password = document.getElementById("auth-password");
      const password2 = document.getElementById("auth-password2");
      if (email) email.value = authForm.email;
      if (password) password.value = authForm.password;
      if (password2) password2.value = authForm.password2;
    }

    function brandHeader(extra) {
      return `<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">${barbellIcon()}</div><h1>Lift Log</h1></div>${extra || ""}</header>`;
    }

    function renderLoading() {
      const label = session ? "Loading your log…" : "Loading…";
      return brandHeader() + `<main class="screen"><div class="status-block" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <h2>${label}</h2>
      </div></main>`;
    }

    function renderBootError() {
      return brandHeader() + `<main class="screen"><div class="status-block">
        <h2>Couldn't load your log</h2>
        <p class="form-error" role="alert">${escapeHtml(bootError)}</p>
        <button class="add-set" data-action="retry-load">Try again</button>
        <button class="auth-link" data-action="log-out">Log out</button>
      </div></main>`;
    }

    function renderAuth() {
      const mode = authMode === "signup" || authMode === "forgot" ? authMode : "login";
      const title = mode === "signup" ? "Create your account" : mode === "forgot" ? "Reset password" : "Welcome back";
      const lead = mode === "signup"
        ? "Your exercises and sets stay with this account."
        : mode === "forgot"
          ? "We'll email a reset link that opens this page."
          : "Log lifts by exercise. Each account keeps its own history.";
      const submit = mode === "signup" ? "Sign up" : mode === "forgot" ? "Send reset link" : "Log in";
      const busyLabel = mode === "signup" ? "Creating account…" : mode === "forgot" ? "Sending…" : "Logging in…";
      const passwordAuto = mode === "signup" ? "new-password" : "current-password";
      const alert = authError
        ? `<p class="form-error" role="alert">${escapeHtml(authError)}</p>`
        : authNotice
          ? `<p class="form-note" role="status">${escapeHtml(authNotice)}</p>`
          : "";
      const passwords = mode === "forgot" ? "" : `
        <label class="field-lbl" for="auth-password">Password</label>
        <input class="text-input" id="auth-password" name="password" type="password" autocomplete="${passwordAuto}" aria-label="Password">
        ${mode === "signup" ? `<label class="field-lbl" for="auth-password2">Confirm password</label>
        <input class="text-input" id="auth-password2" name="password2" type="password" autocomplete="new-password" aria-label="Confirm password">` : ""}`;
      const links = mode === "login"
        ? `<button type="button" class="auth-link" data-action="auth-mode" data-mode="forgot">Forgot password</button>
           <button type="button" class="auth-link" data-action="auth-mode" data-mode="signup">Need an account? Sign up</button>`
        : mode === "signup"
          ? `<button type="button" class="auth-link" data-action="auth-mode" data-mode="login">Already have an account? Log in</button>`
          : `<button type="button" class="auth-link" data-action="auth-mode" data-mode="login">Back to log in</button>`;
      return brandHeader() + `<main class="screen"><div class="auth-card">
        <h2>${title}</h2>
        <p class="auth-lead">${lead}</p>
        ${alert}
        <form id="auth-form" novalidate>
          <label class="field-lbl" for="auth-email">Email</label>
          <input class="text-input" id="auth-email" name="email" type="email" inputmode="email" autocomplete="username" aria-label="Email">
          ${passwords}
          <button class="add-set" type="submit" ${authBusy ? "disabled" : ""}>${authBusy ? busyLabel : submit}</button>
        </form>
        <div class="auth-links">${links}</div>
      </div></main>`;
    }

    function renderRecovery() {
      if (!session) {
        return brandHeader() + `<main class="screen"><div class="status-block" role="status">
          <div class="spinner" aria-hidden="true"></div>
          <h2>Checking your reset link…</h2>
        </div></main>`;
      }
      const alert = authError ? `<p class="form-error" role="alert">${escapeHtml(authError)}</p>` : "";
      return brandHeader() + `<main class="screen"><div class="auth-card">
        <h2>Set a new password</h2>
        <p class="auth-lead">${escapeHtml(signedInEmail() || "Choose a new password for your account.")}</p>
        ${alert}
        <form id="recovery-form" novalidate>
          <label class="field-lbl" for="auth-password">New password</label>
          <input class="text-input" id="auth-password" name="password" type="password" autocomplete="new-password" aria-label="New password">
          <label class="field-lbl" for="auth-password2">Confirm password</label>
          <input class="text-input" id="auth-password2" name="password2" type="password" autocomplete="new-password" aria-label="Confirm password">
          <button class="add-set" type="submit" ${authBusy ? "disabled" : ""}>${authBusy ? "Saving…" : "Update password"}</button>
        </form>
      </div></main>`;
    }

    function renderHome() {
      const used = new Map();
      for (const s of state.sets) used.set(s.exerciseId, s.createdAt);
      const exercises = state.exercises.slice().sort((a, b) => {
        const ta = used.get(a.id) || 0, tb = used.get(b.id) || 0;
        if (ta !== tb) return tb - ta;
        return a.name.localeCompare(b.name);
      });
      const rows = exercises.map(ex => {
        const last = lastSet(ex.id);
        const lastTxt = last
          ? `${fmtWeight(last.weightLbs, true)} × ${last.reps} · ${formatDay(todayKey(last.createdAt))}`
          : "No sets yet";
        return `<button class="ex-row" data-go="#/exercise/${encodeURIComponent(ex.id)}">
          <span class="meta">
            <span class="name">${escapeHtml(ex.name)}</span>
            <span class="last">${escapeHtml(lastTxt)}</span>
          </span>
          <span class="chev" aria-hidden="true">${chevron()}</span>
        </button>`;
      }).join("");
      return `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">${barbellIcon()}</div>
            <h1>Lift Log</h1>
          </div>
          <button class="icon-btn" data-go="#/settings" aria-label="Settings">${gearIcon()}</button>
        </header>
        <main class="screen">
          ${renderWorkoutSection()}
          <div class="eyebrow">Exercises</div>
          <div class="ex-list">${rows || `<div class="empty">No exercises yet. Add one to start logging.</div>`}</div>
          <div class="add-ex-wrap">
            <button class="add-ex" data-action="add-exercise">+ Add exercise</button>
          </div>
        </main>`;
    }

    function renderExercise() {
      const ex = exerciseById(route.id);
      if (!ex) {
        return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Not found</h1>
        </header>
        <main class="screen"><div class="empty">That exercise is gone.</div>
        <button class="add-ex" data-go="#/">Back to list</button></main>`;
      }
      ensureDraft(ex.id);
      const pr = prsFor(ex.id);
      const points = topWeightByDay(ex.id);
      const heavy = pr.heaviest ? fmtWeight(pr.heaviest.weightLbs, true) : "—";
      const e1 = pr.epley ? fmtWeight(pr.epley.value, true) : "—";
      const eSub = pr.epley
        ? `From ${fmtWeight(pr.epley.set.weightLbs, true)} × ${pr.epley.set.reps}`
        : "Epley formula";
      const hSub = pr.heaviest ? repLabel(pr.heaviest.reps) : "No sets yet";

      const groups = groupSets(ex.id);
      let history = "";
      if (!groups.length) {
        history = `<div class="empty">No history yet. Log your first set above.</div>`;
      } else {
        history = groups.map(g => {
          const vol = g.sets.reduce((sum, s) => sum + toDisplay(s.weightLbs) * s.reps, 0);
          const volTxt = unit() === "kg"
            ? Math.round(vol) + " kg volume"
            : Math.round(vol) + " lb volume";
          const rows = g.sets.map((s, i) => `
            <div class="set-row">
              <div class="set-idx">${i + 1}</div>
              <div class="set-main">${escapeHtml(fmtWeight(s.weightLbs, true))} <span>× ${s.reps}</span></div>
              <div class="row-actions">
                <button class="mini" data-action="edit-set" data-id="${s.id}">Edit</button>
                <button class="mini danger" data-action="delete-set" data-id="${s.id}">Delete</button>
              </div>
            </div>`).join("");
          return `<section class="day-group">
            <div class="day-head"><div class="when">${escapeHtml(formatDay(g.date))}</div><div class="vol">${escapeHtml(volTxt)}</div></div>
            ${rows}
          </section>`;
        }).join("");
      }

      return `
        <header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>${escapeHtml(ex.name)}</h1>
          <button class="icon-btn" data-action="ex-menu" aria-label="Exercise options">${dotsIcon()}</button>
        </header>
        <main class="screen">
          <div class="pr-grid">
            <div class="pr-card">
              <div class="lbl">Heaviest</div>
              <div class="val">${escapeHtml(heavy)}</div>
              <div class="sub">${escapeHtml(hSub)}</div>
            </div>
            <div class="pr-card best">
              <div class="lbl">Est. 1RM</div>
              <div class="val">${escapeHtml(e1)}</div>
              <div class="sub">${escapeHtml(eSub)}</div>
            </div>
          </div>
          <div class="chart-card">
            <div class="lbl">Top set over time</div>
            <div class="chart-wrap">${svgChart(points)}</div>
          </div>
          <div class="logger">
            <div class="logger-grid">
              <div class="stepper">
                <div class="unit-lbl">Weight (${unit()})</div>
                <input id="draft-weight" inputmode="decimal" type="text" value="${escapeHtml(draft.weight)}" aria-label="Weight">
                <div class="step-row">
                  <button class="step-btn" data-action="step-w" data-dir="-1" aria-label="Decrease weight">−</button>
                  <button class="step-btn" data-action="step-w" data-dir="1" aria-label="Increase weight">+</button>
                </div>
              </div>
              <div class="stepper">
                <div class="unit-lbl">Reps</div>
                <input id="draft-reps" inputmode="numeric" type="text" value="${escapeHtml(draft.reps)}" aria-label="Reps">
                <div class="step-row">
                  <button class="step-btn" data-action="step-r" data-dir="-1" aria-label="Decrease reps">−</button>
                  <button class="step-btn" data-action="step-r" data-dir="1" aria-label="Increase reps">+</button>
                </div>
              </div>
            </div>
            <button class="add-set" data-action="add-set" ${saving ? "disabled" : ""}>Add set</button>
          </div>
          <div class="eyebrow">History</div>
          ${history}
        </main>`;
    }

    function groupSets(exId) {
      const map = new Map();
      for (const s of setsFor(exId).slice().reverse()) {
        const k = todayKey(s.createdAt);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(s);
      }
      // Within a day, show chronological order (first set first)
      return Array.from(map.entries()).map(([date, sets]) => ({
        date,
        sets: sets.slice().sort((a, b) => a.createdAt - b.createdAt)
      }));
    }

    function renderSettings() {
      const u = unit();
      const count = state.sets.length;
      const email = signedInEmail();
      return `
        <header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Settings</h1>
        </header>
        <main class="screen">
          <div class="eyebrow">Account</div>
          <div class="settings-card">
            <div class="settings-row">
              <div>
                <div class="k">Signed in</div>
                <div class="d">${escapeHtml(email)}</div>
              </div>
            </div>
            <button class="settings-row tappable" data-action="log-out">
              <div>
                <div class="k">Log out</div>
                <div class="d">End this session on this phone</div>
              </div>
            </button>
          </div>
          <div class="eyebrow">Units</div>
          <div class="settings-card">
            <div class="settings-row">
              <div>
                <div class="k">Weight unit</div>
                <div class="d">Used for logging and history</div>
              </div>
              <div class="seg" role="group" aria-label="Weight unit">
                <button data-action="set-unit" data-unit="lbs" class="${u === "lbs" ? "on" : ""}">lbs</button>
                <button data-action="set-unit" data-unit="kg" class="${u === "kg" ? "on" : ""}">kg</button>
              </div>
            </div>
          </div>
          <div class="eyebrow">Backup</div>
          <div class="settings-card">
            <button class="settings-row tappable" data-action="export-json">
              <div>
                <div class="k">Export JSON</div>
                <div class="d">${count} set${count === 1 ? "" : "s"} · download a backup</div>
              </div>
              <span class="chev">${chevron()}</span>
            </button>
            <button class="settings-row tappable" data-action="import-json">
              <div>
                <div class="k">Import JSON</div>
                <div class="d">Replace current data from a backup</div>
              </div>
              <span class="chev">${chevron()}</span>
            </button>
          </div>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
          <p class="hint">Your sets are saved to this account. Export a backup anytime. Add Lift Log to your home screen for a full-screen gym view.</p>
        </main>`;
    }

    function renderModal() {
      if (!modal) return "";
      if (modal.type === "new-template") {
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="New template">
            <div class="grab"></div>
            <h2>New template</h2>
            <label class="field-lbl" for="tpl-new-name">Name</label>
            <input class="text-input" id="tpl-new-name" maxlength="40" value="${escapeHtml(modal.value || "")}" placeholder="e.g. Arms">
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn primary" data-action="save-new-template">Create</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "add-template-exercise") {
        const t = templateById(modal.id);
        const have = new Set((t ? t.exerciseNames : []).map(n => n.toLowerCase()));
        const picks = state.exercises.filter(e => !have.has(e.name.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name));
        const list = picks.map(e => `<button type="button" data-action="tpl-add-existing" data-id="${escapeHtml(modal.id)}" data-name="${escapeHtml(e.name)}">${escapeHtml(e.name)}</button>`).join("");
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Add exercise">
            <div class="grab"></div>
            <h2>Add exercise</h2>
            <div class="pick-list">${list || `<div class="empty">No other exercises yet.</div>`}</div>
            <label class="field-lbl" for="tpl-add-name">Or a new name</label>
            <input class="text-input" id="tpl-add-name" maxlength="60" value="${escapeHtml(modal.value || "")}" placeholder="e.g. Face Pull">
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn primary" data-action="tpl-add-named" data-id="${escapeHtml(modal.id)}">Add</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "add-exercise" || modal.type === "rename-exercise") {
        const title = modal.type === "add-exercise" ? "New exercise" : "Rename exercise";
        const val = modal.value || "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
            <div class="grab"></div>
            <h2>${title}</h2>
            <label class="field-lbl" for="modal-name">Name</label>
            <input class="text-input" id="modal-name" maxlength="60" value="${escapeHtml(val)}" placeholder="e.g. Romanian Deadlift">
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn primary" data-action="save-exercise-name">${modal.type === "add-exercise" ? "Add" : "Save"}</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "ex-menu") {
        const ex = exerciseById(modal.id);
        if (!ex) return "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Exercise options">
            <div class="grab"></div>
            <h2>${escapeHtml(ex.name)}</h2>
            <div class="more-menu">
              <button data-action="rename-exercise">Rename</button>
              <button class="warn" data-action="confirm-delete-ex">Delete exercise</button>
            </div>
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Close</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "confirm-delete-ex") {
        const ex = exerciseById(modal.id);
        const n = setsFor(modal.id).length;
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Delete exercise">
            <div class="grab"></div>
            <h2>Delete ${escapeHtml(ex ? ex.name : "exercise")}?</h2>
            <p class="hint">This removes the exercise and ${n} set${n === 1 ? "" : "s"}. This cannot be undone.</p>
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn danger" data-action="delete-exercise">Delete</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "edit-set") {
        const s = state.sets.find(x => x.id === modal.id);
        if (!s) return "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Edit set">
            <div class="grab"></div>
            <h2>Edit set</h2>
            <div class="num-row">
              <div>
                <label class="field-lbl" for="edit-weight">Weight (${unit()})</label>
                <input class="num-input" id="edit-weight" inputmode="decimal" value="${escapeHtml(fmtWeight(s.weightLbs, false))}">
              </div>
              <div>
                <label class="field-lbl" for="edit-reps">Reps</label>
                <input class="num-input" id="edit-reps" inputmode="numeric" value="${s.reps}">
              </div>
            </div>
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn primary" data-action="save-set">Save</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "confirm-import") {
        const busy = modal.busy ? "disabled" : "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Replace data">
            <div class="grab"></div>
            <h2>Replace all data?</h2>
            <p class="hint">Importing a backup overwrites the exercises and sets in this account.</p>
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal" ${busy}>Cancel</button>
              <button class="btn primary" data-action="do-import" ${busy}>${modal.busy ? "Importing…" : "Import"}</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "migrate-local") {
        const data = modal.data || { exercises: [], sets: [] };
        const setCount = data.sets.length;
        const exCount = data.exercises.length;
        const busy = modal.busy ? "disabled" : "";
        const detail = `${setCount} set${setCount === 1 ? "" : "s"} across ${exCount} exercise${exCount === 1 ? "" : "s"} on this phone.`;
        const err = modal.error ? `<p class="form-error" role="alert">${escapeHtml(modal.error)}</p>` : "";
        return `<div class="overlay">
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="migrate-title">
            <div class="grab"></div>
            <h2 id="migrate-title">Import your saved logs into this account</h2>
            <p class="hint">${escapeHtml(detail)} They'll be added to ${escapeHtml(signedInEmail() || "this account")}.</p>
            ${err}
            <div class="sheet-actions">
              <button class="btn ghost" data-action="migrate-dismiss" ${busy}>Not now</button>
              <button class="btn primary" data-action="migrate-import" ${busy}>${modal.busy ? "Importing…" : "Import"}</button>
            </div>
          </div>
        </div>`;
      }
      return "";
    }

    function barbellIcon() {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="8" width="3.2" height="8" rx="1" fill="#1a0a00"/>
        <rect x="18.8" y="8" width="3.2" height="8" rx="1" fill="#1a0a00"/>
        <rect x="5.4" y="9.5" width="2" height="5" rx="0.6" fill="#1a0a00"/>
        <rect x="16.6" y="9.5" width="2" height="5" rx="0.6" fill="#1a0a00"/>
        <rect x="7.6" y="11" width="8.8" height="2" rx="0.6" fill="#1a0a00"/>
      </svg>`;
    }
    function gearIcon() {
      return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
