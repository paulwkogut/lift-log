        <div class="time" id="rest-clock">${formatClock(left)}</div>
        <div class="rest-controls">
          <button type="button" data-action="rest-adjust" data-dir="-15" aria-label="Subtract 15 seconds">−15s</button>
          <button type="button" data-action="rest-pause">${paused ? "Resume" : "Pause"}</button>
          <button type="button" data-action="rest-adjust" data-dir="15" aria-label="Add 15 seconds">+15s</button>
          <button type="button" data-action="rest-skip">Skip</button>
        </div>
      </div>`;
    }
    function paintRest() {
      const el = document.getElementById("rest-clock");
      if (!el || !restSession || restSession.phase === "done") return;
      el.textContent = formatClock(Math.ceil(restRemainingMs() / 1000));
    }
    function unlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playBeep() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.22].forEach(offset => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.2);
      });
    }
    function completeRest() {
      if (!restSession || restSession.phase === "done") return;
      restSession.phase = "done";
      restSession.doneUntil = Date.now() + 8000;
      if (!restAlerted) {
        restAlerted = true;
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch {}
        try { playBeep(); } catch {}
        try {
          if (typeof Notification !== "undefined" && Notification.permission === "granted") {
            new Notification("Lift Log", { body: "Rest over - next set" });
          }
        } catch {}
      }
      render();
    }
    function syncRest() {
      if (!restSession) return;
      if (restSession.phase === "run" && Date.now() >= restSession.endsAt) {
        completeRest();
        return;
      }
      if (restSession.phase === "done" && Date.now() >= restSession.doneUntil) {
        restSession = null;
        restAlerted = false;
        const el = document.getElementById("rest-sheet");
        if (el) el.remove();
        return;
      }
      paintRest();
    }
    function armRestTick() {
      clearInterval(restTick);
      restTick = setInterval(syncRest, 250);
    }
    function maybeStartRest(name) {
      if (!restSettings.auto) return;
      const seconds = restSecondsFor(name);
      restAlerted = false;
      restSession = { phase: "run", endsAt: Date.now() + seconds * 1000, remaining: seconds * 1000 };
      armRestTick();
    }
    function clearRest() {
      restSession = null;
      restAlerted = false;
      clearInterval(restTick);
      render();
    }
    function toggleRestPause() {
      if (!restSession || restSession.phase === "done") return;
      if (restSession.phase === "pause") {
        restSession.endsAt = Date.now() + restSession.remaining;
        restSession.phase = "run";
      } else {
        restSession.remaining = restRemainingMs();
        restSession.phase = "pause";
      }
      render();
    }
    function adjustRest(deltaSeconds) {
      if (!restSession || restSession.phase === "done") return;
      let ms = restRemainingMs() + deltaSeconds * 1000;
      ms = Math.max(0, Math.min(300000, ms));
      if (restSession.phase === "pause") restSession.remaining = ms;
      else restSession.endsAt = Date.now() + ms;
      if (ms <= 0) completeRest();
      else {
        paintRest();
        render();
      }
    }
    function setRestAuto(on) {
      restSettings.auto = !!on;
      saveRestSettings();
      render();
    }
    function setDefaultRest(delta) {
      restSettings.seconds = clampTarget(restSettings.seconds + delta, 30, 300, 90);
      saveRestSettings();
      render();
    }
    function setExerciseRest(name, delta) {
      if (!name) return;
      const key = name.toLowerCase();
      const current = restSecondsFor(name);
      restSettings.overrides[key] = clampTarget(current + delta, 30, 300, 90);
      saveRestSettings();
      render();
    }
    function clearExerciseRest(name) {
      if (!name) return;
      delete restSettings.overrides[name.toLowerCase()];
      saveRestSettings();
      render();
    }
    function renderWorkoutExercise(item) {
      const id = item.exerciseId;
      const ex = exerciseById(id);
      const name = ex ? ex.name : "Missing exercise";
      const planned = item.sets + (item.extra || 0);
      const logged = sessionSetsFor(id);
      const rows = [];
      for (let i = 0; i < planned; i++) {
        const doneSet = logged[i];
        if (doneSet) {
          rows.push(`<div class="set-plan done">
            <span class="set-no">Set ${i + 1}</span>
            <span class="done-mark">✓ ${escapeHtml(fmtWeight(doneSet.weightLbs, true))} × ${doneSet.reps}</span>
          </div>`);
          continue;
        }
        const draft = ensurePlan(id, i, item.reps);
        const ready = logged.length === i;
        rows.push(`<div class="set-plan">
          <span class="set-no">Set ${i + 1}</span>
          <input class="plan-input" id="plan-w-${escapeHtml(id)}-${i}" data-plan-weight="${escapeHtml(id)}" data-index="${i}" inputmode="decimal" type="text" value="${escapeHtml(draft.weight)}" aria-label="Weight for set ${i + 1} of ${escapeHtml(name)}">
          <span class="plan-x">×</span>
          <input class="plan-input reps" id="plan-r-${escapeHtml(id)}-${i}" data-plan-reps="${escapeHtml(id)}" data-index="${i}" inputmode="numeric" type="text" value="${escapeHtml(draft.reps)}" aria-label="Reps for set ${i + 1} of ${escapeHtml(name)}">
          <button type="button" class="log-btn" data-action="log-plan" data-id="${escapeHtml(id)}" data-index="${i}" ${ready ? "" : "disabled"} aria-label="Log set ${i + 1} of ${escapeHtml(name)}">Log</button>
        </div>`);
      }
      const doneCount = Math.min(logged.length, planned);
      return `<section class="wo-block">
        <div class="wo-block-head">
          <div>
            <div class="wo-ex-name">${escapeHtml(name)}</div>
            <div class="wo-last">${doneCount}/${planned} sets</div>
          </div>
          <button type="button" class="icon-x" data-action="wo-skip" data-id="${escapeHtml(id)}" aria-label="Skip ${escapeHtml(name)}">×</button>
        </div>
        ${rows.join("")}
        <button type="button" class="add-extra" data-action="wo-extra-set" data-id="${escapeHtml(id)}">+ Add set</button>
      </section>`;
    }
    async function logPlannedSet(exId, index) {
      if (saving || !activeWorkout || !Number.isFinite(index)) return;
      const logged = sessionSetsFor(exId);
      if (logged.length !== index) return;
      const draft = readPlan(exId, index);
      const w = parseWeight(draft.weight);
      const r = parseReps(draft.reps);
      if (w == null) { showToast("Enter a valid weight"); return; }
      if (r == null) { showToast("Enter at least 1 rep"); return; }
      const row = {
        id: uid(),
        exerciseId: exId,
        weightLbs: toLbs(w),
        reps: r,
        createdAt: Date.now()
      };
      saving = true;
      state.sets.push(row);
      try {
        await persistSetInsert(row, w);
        saving = false;
        const loggedEx = exerciseById(exId);
        maybeStartRest(loggedEx && loggedEx.name);
        showToast("Set " + (index + 1) + " logged");
      } catch (err) {
        state.sets = state.sets.filter(s => s.id !== row.id);
        showToast(err.message || "Couldn't log that set.");
      } finally {
        saving = false;
      }
    }
    function addExtraSet(exId) {
      if (!activeWorkout) return;
      const items = workoutItems();
      if (!activeWorkout.items) activeWorkout.items = items;
      const item = activeWorkout.items.find(i => i.exerciseId === exId);
      if (!item) return;
      item.extra = clampTarget((item.extra || 0) + 1, 0, 30, 0);
      persistActive();
      render();
    }
    function skipWorkoutExercise(id) {
      if (!activeWorkout || !id) return;
      const items = workoutItems().filter(item => item.exerciseId !== id);
      activeWorkout.items = items;
      activeWorkout.exerciseIds = items.map(item => item.exerciseId);
      persistActive();
      render();
    }
    function alsoSaveChecked() {
      const box = document.getElementById("also-save-template");
      return !!(box && box.checked);
    }
    function renderExercisePicker() {
      const workoutMode = modal.type === "add-workout-exercise";
      const query = String(modal.query || "").trim().toLowerCase();
      let exclude = new Set();
      if (workoutMode && activeWorkout) {
        workoutItems().forEach(item => {
          const ex = exerciseById(item.exerciseId);
          if (ex) exclude.add(ex.name.toLowerCase());
        });
      } else {
        const t = templateById(modal.id);
        exclude = new Set(((t && t.exerciseNames) || []).map(n => n.toLowerCase()));
      }
      const picks = state.exercises
        .filter(e => !exclude.has(e.name.toLowerCase()))
        .filter(e => !query || e.name.toLowerCase().indexOf(query) !== -1)
        .sort((a, b) => a.name.localeCompare(b.name));
      const list = picks.map(e => `<button type="button" data-action="tpl-add-existing" data-name="${escapeHtml(e.name)}">${escapeHtml(e.name)}</button>`).join("");
      const owned = new Set(state.exercises.map(e => e.name.toLowerCase()));
      const libHits = query ? LIBRARY.filter(e => {
        const key = e.name.toLowerCase();
        return key.indexOf(query) !== -1 && !exclude.has(key) && !owned.has(key);
      }).slice(0, 30) : [];
      const libList = libHits.map(e => `<button type="button" data-action="tpl-add-library" data-name="${escapeHtml(e.name)}">${escapeHtml(e.name)} <span style="color:var(--muted);font-weight:500">· ${escapeHtml(e.equipment)}</span></button>`).join("");
      const also = workoutMode
        ? `<label class="also-save"><input type="checkbox" id="also-save-template" ${modal.alsoSave ? "checked" : ""}><span>Also save to template</span></label>`
        : "";
      return `<div class="overlay" data-action="close-modal">
        <div class="sheet" role="dialog" aria-modal="true" aria-label="Add exercise">
          <div class="grab"></div>
          <h2>Add exercise</h2>
          <label class="field-lbl" for="picker-search">Search yours and the library</label>
          <input class="text-input" id="picker-search" type="search" placeholder="Search" value="${escapeHtml(modal.query || "")}" aria-label="Search exercises">
          <div class="pick-list">
            <div class="pick-label">Yours</div>
            ${list || `<div class="picker-empty">${query ? "No matches in your list." : "No other exercises yet."}</div>`}
            ${query ? `<div class="pick-label">Library</div>${libList || `<div class="picker-empty">No library matches.</div>`}` : `<div class="picker-empty">Search to add from the gym library.</div>`}
          </div>
          ${also}
          <label class="field-lbl" for="tpl-add-name">Create new exercise</label>
          <input class="text-input" id="tpl-add-name" maxlength="60" value="${escapeHtml(modal.value || "")}" placeholder="e.g. Cable Fly">
          <div class="sheet-actions">
            <button class="btn ghost" data-action="close-modal">Cancel</button>
            <button class="btn primary" data-action="tpl-add-named">Create and add</button>
          </div>
        </div>
      </div>`;
    }
    function pickExistingExercise(name) {
      if (modal && modal.type === "add-workout-exercise") return addExerciseToWorkout(name, alsoSaveChecked());
      return addTemplateExercise(modal && modal.id, name);
    }
    async function addNamedFromPicker() {
      const input = document.getElementById("tpl-add-name");
      const name = (input ? input.value : (modal && modal.value) || "").trim();
      if (!name) { showToast("Type an exercise name"); return; }
      if (modal && modal.type === "add-workout-exercise") return addExerciseToWorkout(name, alsoSaveChecked());
      try {
        const ex = await ensureExercise(name);
        return addTemplateExercise(modal && modal.id, ex.name);
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }
    async function addExerciseToWorkout(name, alsoSave) {
      if (!activeWorkout) return;
      try {
        const ex = await ensureExercise(name);
        const items = workoutItems();
        if (!activeWorkout.items) activeWorkout.items = items.slice();
        if (activeWorkout.items.some(item => item.exerciseId === ex.id)) {
          showToast("Already in this workout");
          return;
        }
        activeWorkout.items.push({ exerciseId: ex.id, sets: 3, reps: 10, extra: 0 });
        activeWorkout.exerciseIds = activeWorkout.items.map(item => item.exerciseId);
        persistActive();
        if (alsoSave && activeWorkout.templateId) {
          const t = templateById(activeWorkout.templateId);
          if (t && !t.exerciseNames.some(n => n.toLowerCase() === ex.name.toLowerCase())) {
            ensureTargets(t);
            t.exerciseNames = t.exerciseNames.concat(ex.name);
            t.targets = t.targets.concat([defaultTarget()]);
            await saveTemplateRecord(t);
          }
        }
        modal = null;
        showToast(alsoSave ? "Added to this workout and the template" : "Added to this workout");
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }
    async function changeTemplateTarget(el) {
      const t = templateById(el.getAttribute("data-id"));
      const index = parseInt(el.getAttribute("data-index"), 10);
      const field = el.getAttribute("data-field");
      const dir = Number(el.getAttribute("data-dir"));
      if (!t || !Number.isFinite(index) || (field !== "sets" && field !== "reps")) return;
      ensureTargets(t);
      const max = field === "sets" ? 20 : 100;
      const min = 1;
      t.targets[index][field] = clampTarget(t.targets[index][field] + dir, min, max, field === "sets" ? 3 : 10);
      try {
        await saveTemplateRecord(t);
        render();
      } catch (err) {
        showToast(err.message || "Couldn't save that template.");
      }
    }



    function startingWeight(name) {
      const hit = libraryEntry(name);
      if (hit && hit.equipment === "Bodyweight") return "0";
      return unit() === "kg" ? "20" : "45";
    }
    function libraryEntry(name) {
      const key = String(name || "").trim().toLowerCase();
      if (!key) return null;
      return LIBRARY.find(e => e.name.toLowerCase() === key) || null;
    }
    function renderLibrary() {
      const q = libQuery.trim().toLowerCase();
      const matches = LIBRARY.filter(e => {
        if (libEquip !== "All" && e.equipment !== libEquip) return false;
        if (libMuscle !== "All" && e.muscle !== libMuscle) return false;
        if (q && e.name.toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      const equipChips = ["All"].concat(EQUIPMENT).map(name =>
        `<button type="button" class="chip${libEquip === name ? " on" : ""}" data-action="lib-equip" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>`
      ).join("");
      const muscleChips = ["All"].concat(MUSCLES).map(name =>
        `<button type="button" class="chip${libMuscle === name ? " on" : ""}" data-action="lib-muscle" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>`
      ).join("");
      const groups = [];
      EQUIPMENT.forEach(eq => {
        const rows = matches.filter(e => e.equipment === eq);
        if (!rows.length) return;
        const buttons = rows.map(e => {
          const owned = state.exercises.some(x => x.name.toLowerCase() === e.name.toLowerCase());
          return `<button type="button" class="ex-row" data-action="add-library" data-name="${escapeHtml(e.name)}">
            <span class="meta"><span class="name">${escapeHtml(e.name)}</span><span class="last">${escapeHtml(e.muscle)}</span></span>
            <span class="chev">${owned ? "Added" : "Add"}</span>
          </button>`;
        }).join("");
        groups.push(`<section class="lib-group"><div class="eyebrow">${escapeHtml(eq)}</div><div class="ex-list">${buttons}</div></section>`);
      });
      return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Library</h1>
        </header>
        <main class="screen">
          <label class="field-lbl" for="lib-search">Search</label>
          <input class="text-input" id="lib-search" type="search" placeholder="Search exercises" value="${escapeHtml(libQuery)}" aria-label="Search library">
          <div class="chip-row" aria-label="Equipment">${equipChips}</div>
          <div class="chip-row" aria-label="Muscle group">${muscleChips}</div>
          <div class="lib-count">${matches.length} exercise${matches.length === 1 ? "" : "s"}</div>
          ${groups.join("") || `<div class="empty">No exercises match.</div>`}
        </main>`;
    }
    async function addFromLibrary(name) {
      const clean = String(name || "").trim();
      if (!clean) return;
      const existing = state.exercises.find(e => e.name.toLowerCase() === clean.toLowerCase());
      if (existing) {
        go("#/exercise/" + encodeURIComponent(existing.id));
        return;
      }
      try {
        const ex = await ensureExercise(clean, true);
        showToast(ex.name + " added");
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }
    async function pickLibraryExercise(name) {
      try {
        const ex = await ensureExercise(name, true);
        if (modal && modal.type === "add-workout-exercise") return addExerciseToWorkout(ex.name, alsoSaveChecked());
        return addTemplateExercise(modal && modal.id, ex.name);
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }

    window.addEventListener("hashchange", () => {
      if (isAuthHash(location.hash)) return;
      route = parseHash();
      if (route.name !== "exercise") draftExId = null;
      if (!modal || modal.type !== "migrate-local") modal = null;
      render();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal && modal.type !== "migrate-local" && !modal.busy) closeModal();
    });

    loadRestSettings();
    document.addEventListener("pointerdown", unlockAudio, { passive: true });
    document.addEventListener("keydown", unlockAudio);
    document.addEventListener("visibilitychange", syncRest);
    window.addEventListener("focus", syncRest);
    window.addEventListener("pageshow", syncRest);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    sb.auth.onAuthStateChange((event, sess) => onAuth(event, sess));

    setTimeout(() => {
      if (authResolved) return;
      sb.auth.getSession().then(({ data }) => {
        if (authResolved) return;
        bootFromSession(data && data.session ? "SIGNED_IN" : "INITIAL_SESSION", (data && data.session) || null);
      }).catch(() => {
        if (authResolved) return;
        authResolved = true;
        loading = false;
        authError = authError || "Couldn't check your session.";
        render();
      });
    }, 2500);

    render();
  })();
  </script>
</body>
</html>
