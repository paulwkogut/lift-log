<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#0b0b0d">
  <meta name="color-scheme" id="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <meta name="application-name" content="Lift Log">
  <meta name="description" content="Log your lifts by exercise. Each account keeps its own history.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <title>Lift Log</title>
  <script>
    (function () {
      var mode = "dark", accent = "orange", theme = "dark";
      try {
        var raw = JSON.parse(localStorage.getItem("lift-log-theme-v1") || "null") || {};
        if (raw.mode === "light" || raw.mode === "black" || raw.mode === "system" || raw.mode === "dark") mode = raw.mode;
        if (/^(orange|blue|green|red|purple|pink|teal|yellow)$/.test(raw.accent)) accent = raw.accent;
      } catch (e) {}
      if (mode === "system") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      else theme = mode;
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      root.setAttribute("data-accent", accent);
      root.setAttribute("data-theme-mode", mode);
      var bg = theme === "light" ? "#f6f3ee" : theme === "black" ? "#000000" : "#0b0b0d";
      var themeMeta = document.getElementById("theme-color");
      var schemeMeta = document.getElementById("color-scheme");
      var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (themeMeta) themeMeta.setAttribute("content", bg);
      if (schemeMeta) schemeMeta.setAttribute("content", theme === "light" ? "light" : "dark");
      if (bar) bar.setAttribute("content", theme === "light" ? "default" : "black-translucent");
    })();
  </script>
  <style>
    :root {
      --bg: #0b0b0d;
      --bg-elev: #121216;
      --surface: #18181e;
      --surface-2: #202028;
      --line: #2a2a34;
      --text: #f4f1ec;
      --muted: #8d8a86;
      --faint: #5c5a58;
      --accent: #ff6a2a;
      --accent-2: #ffd7a8;
      --accent-dim: rgba(255, 106, 42, 0.16);
      --good: #3ee08f;
      --good-dim: rgba(62, 224, 143, 0.12);
      --danger: #ff5a5a;
      --danger-dim: rgba(255, 90, 90, 0.12);
      --accent-ink: #1a0a00;
      --on-good: #04210f;
      --dash: #3a3a44;
      --toast-bg: #f4f1ec;
      --toast-text: #16140f;
      --overlay: rgba(0, 0, 0, 0.62);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --radius: 18px;
      --tap: 52px;
      color-scheme: dark;
    }
    :root[data-theme="black"] {
      --bg: #000000;
      --bg-elev: #050505;
      --surface: #101010;
      --surface-2: #1a1a1a;
      --line: #2c2c2c;
      --text: #f5f2ec;
      --muted: #a39e98;
      --faint: #6e6a66;
      --dash: #3a3a3a;
      --on-good: #04210f;
      --toast-bg: #f4f1ec;
      --toast-text: #16140f;
      --overlay: rgba(0, 0, 0, 0.72);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f6f3ee;
      --bg-elev: #fffdfb;
      --surface: #ffffff;
      --surface-2: #efe8df;
      --line: #e4dcd2;
      --text: #1c1612;
      --muted: #5c564f;
      --faint: #8a8178;
      --dash: #d5cdc3;
      --good: #0b7a45;
      --good-dim: rgba(11, 122, 69, 0.12);
      --danger: #c42323;
      --danger-dim: rgba(196, 35, 35, 0.1);
      --on-good: #f4fff8;
      --toast-bg: #1c1612;
      --toast-text: #f6f3ee;
      --overlay: rgba(28, 22, 18, 0.46);
      --shadow: 0 10px 28px rgba(48, 32, 12, 0.08);
      color-scheme: light;
    }
    :root[data-accent="blue"] { --accent: #3b82f6; --accent-ink: #04101f; --accent-2: #bfdbfe; --accent-dim: rgba(59, 130, 246, 0.18); }
    :root[data-accent="green"] { --accent: #22c55e; --accent-ink: #05210f; --accent-2: #bbf7d0; --accent-dim: rgba(34, 197, 94, 0.18); }
    :root[data-accent="red"] { --accent: #ef4444; --accent-ink: #2a0606; --accent-2: #fecaca; --accent-dim: rgba(239, 68, 68, 0.18); }
    :root[data-accent="purple"] { --accent: #a855f7; --accent-ink: #1a0528; --accent-2: #e9d5ff; --accent-dim: rgba(168, 85, 247, 0.2); }
    :root[data-accent="pink"] { --accent: #ec4899; --accent-ink: #2a0616; --accent-2: #fbcfe8; --accent-dim: rgba(236, 72, 153, 0.18); }
    :root[data-accent="teal"] { --accent: #14b8a6; --accent-ink: #04221e; --accent-2: #99f6e4; --accent-dim: rgba(20, 184, 166, 0.18); }
    :root[data-accent="yellow"] { --accent: #eab308; --accent-ink: #1c1402; --accent-2: #fef08a; --accent-dim: rgba(234, 179, 8, 0.2); }
    :root[data-theme="light"][data-accent="orange"],
    :root[data-theme="light"]:not([data-accent]) { --accent-2: #c2410c; }
    :root[data-theme="light"][data-accent="blue"] { --accent-2: #1d4ed8; }
    :root[data-theme="light"][data-accent="green"] { --accent-2: #047857; }
    :root[data-theme="light"][data-accent="red"] { --accent-2: #b91c1c; }
    :root[data-theme="light"][data-accent="purple"] { --accent-2: #7e22ce; }
    :root[data-theme="light"][data-accent="pink"] { --accent-2: #be185d; }
    :root[data-theme="light"][data-accent="teal"] { --accent-2: #0f766e; }
    :root[data-theme="light"][data-accent="yellow"] { --accent-2: #854d0e; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      overscroll-behavior: none;
    }
    button, input { font: inherit; color: inherit; }
    button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; }
    input { background: none; border: 0; outline: none; }
    input[type="number"] { -moz-appearance: textfield; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(24px + var(--safe-b));
      padding-left: var(--safe-l);
      padding-right: var(--safe-r);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(10px + var(--safe-t)) 14px 10px;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
    }
    .topbar.scrolled { border-bottom-color: var(--line); }
    .topbar h1 {
      flex: 1;
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
    }
    .brand-mark svg { display: block; }
    .brand h1 { font-size: 22px; }

    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--text);
      flex-shrink: 0;
    }
    .icon-btn:active { background: var(--surface-2); transform: scale(0.96); }
    .icon-btn.ghost { color: var(--muted); }

    .screen { padding: 8px 16px 0; flex: 1; }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 8px 2px 10px;
    }

    .ex-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
    .ex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px 10px 16px;
      min-height: 64px;
    }
    .ex-row:active { background: var(--surface-2); }
    .ex-row .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; }
    .ex-row .name, .ex-row .last, .ex-row .chev-btn, .title-link, .wo-ex-name {
      background: none;
      text-align: left;
    }
    .ex-row .name, .title-link, button.wo-ex-name {
      font-weight: 650;
      font-size: 17px;
      letter-spacing: -0.02em;
      display: block;
      color: var(--text);
    }
    .ex-row .last {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      display: block;
    }
    .ex-row .chev, .ex-row .chev-btn { color: var(--faint); flex-shrink: 0; }
    .ex-row .chev-btn { min-width: 44px; min-height: 44px; }
    .ex-row .chev { color: var(--faint); flex-shrink: 0; }
    .ex-row.cal-jump { border-color: var(--accent); }

    .cal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 8px 12px;
      margin-bottom: 16px;
      touch-action: pan-y;
    }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .cal-head h2 {
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .cal-head .icon-btn { width: 40px; height: 40px; }
    .cal-next { display: grid; transform: scaleX(-1); }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-top: 4px;
    }
    .cal-dow {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1;
      min-height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .cal-day.empty { visibility: hidden; }
    .cal-day.mark { background: var(--accent); color: var(--accent-ink); }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .cal-day.mark.today { box-shadow: inset 0 0 0 1.5px var(--accent-ink); }
    .cal-count {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }
    .add-ex-wrap {
      position: sticky;
      bottom: 0;
      margin: 8px -16px 0;
      padding: 14px 16px calc(8px + var(--safe-b));
      background: linear-gradient(180deg, transparent, var(--bg) 36%);
    }
    .add-ex {
      width: 100%;
      min-height: var(--tap);
      border-radius: var(--radius);
      border: 1.5px dashed var(--dash);
      background: var(--bg-elev);
      color: var(--accent-2);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .add-ex:active { background: var(--surface); }

    .pr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pr-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
    }
    .pr-card .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .pr-card .val {
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.04em;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .pr-card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .pr-card.best .val { color: var(--good); }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 12px 8px;
      margin-bottom: 16px;
    }
    .chart-card .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 2px 4px 8px;
    }
    .chart-wrap { height: 128px; }
    .chart-wrap svg { width: 100%; height: 100%; display: block; }
    .chart-empty {
      height: 128px;
      display: grid;
      place-items: center;
      color: var(--faint);
      font-size: 13px;
    }

    .logger {
      background: linear-gradient(180deg, var(--bg-elev) 0%, var(--surface) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 14px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .logger-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
    }
    .stepper { text-align: center; }
    .stepper .unit-lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stepper input {
      width: 100%;
      min-width: 0;
      text-align: center;
      font-size: 40px;
      font-weight: 750;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      padding: 2px 0 4px;
      height: 52px;
    }
    .step-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }
    .step-btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 26px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent-2);
    }
    .step-btn:active { background: var(--accent-dim); transform: scale(0.95); }
    .add-set {
      margin-top: 14px;
      width: 100%;
      height: 58px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.02em;
    }
    .add-set:active { filter: brightness(0.92); transform: scale(0.99); }
    .add-set:disabled { opacity: 0.45; }

    .day-group { margin-bottom: 16px; }
    .day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 4px 8px;
    }
    .day-head .when { font-weight: 700; font-size: 14px; }
    .day-head .vol { color: var(--muted); font-size: 12px; }
    .set-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 8px 8px 14px;
      margin-bottom: 6px;
      min-height: 52px;
    }
    .set-idx {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      min-width: 46px;
    }
    .set-main { flex: 1; font-weight: 650; font-variant-numeric: tabular-nums; }
    .set-main span { color: var(--muted); font-weight: 500; }
    .row-actions { display: flex; gap: 4px; }
    .mini {
      min-width: 44px;
      height: 44px;
      padding: 0 10px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .mini:active { background: var(--surface-2); }
    .mini.danger { color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 22px 12px;
      font-size: 14px;
    }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      width: 100%;
      text-align: left;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
    }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row .k { font-weight: 650; }
    .settings-row .d { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .settings-row .d.push-status { color: var(--danger); }
    .settings-row:active.tappable { background: var(--surface-2); }

    .seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
    }
    .seg button {
      min-width: 64px;
      height: 36px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
    }
    .seg button.on {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      padding: 4px 8px 16px;
      line-height: 1.5;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-elev);
      border-radius: 22px 22px 0 0;
      padding: 10px 16px calc(20px + var(--safe-b));
      border-top: 1px solid var(--line);
      animation: up 0.22s ease;
    }
    @keyframes up {
      from { transform: translateY(16px); opacity: 0.6; }
      to { transform: none; opacity: 1; }
    }
    .grab {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: var(--line);
      margin: 4px auto 14px;
    }
    .sheet h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: -0.02em; }
    .field-lbl {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .text-input, .num-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 17px;
      margin-bottom: 14px;
    }
    .num-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sheet-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      font-weight: 750;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.primary:active { filter: brightness(0.92); }
    .btn.ghost { background: var(--surface-2); color: var(--text); }
    .btn.danger { background: var(--danger-dim); color: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + var(--safe-b));
      transform: translateX(-50%);
      background: var(--toast-bg);
      color: var(--toast-text);
      font-weight: 700;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      z-index: 80;
      box-shadow: var(--shadow);
      max-width: calc(100% - 32px);
      text-align: center;
      overflow-wrap: anywhere;
      animation: pop 0.2s ease;
    }
    body:has(#rest-sheet) .toast { bottom: calc(248px + var(--safe-b)); }
    @keyframes pop {
      from { transform: translateX(-50%) translateY(8px); opacity: 0; }
      to { transform: translateX(-50%); opacity: 1; }
    }

    .more-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .more-menu button {
      text-align: left;
      padding: 14px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 650;
      min-height: 52px;
    }
    .more-menu button:active { background: var(--surface-2); }
    .more-menu button.warn { color: var(--danger); }

    function uid() {
      if (globalThis.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {

        return v.toString(16);

    function hashSignalsRecovery() {

    function isAuthHash(hash) {
      return /access_token=|refresh_token=|error=|type=/.test(hash || "");
    }

    function readAuthHashError() {
      const raw = (location.hash || "").replace(/^#/, "");
      if (!raw || raw.startsWith("/") || raw.indexOf("error=") === -1) return "";
      const params = new URLSearchParams(raw);
      return (params.get("error_description") || params.get("error") || "").replace(/\+/g, " ");
    }

    function stripAuthParams() {
      const hash = location.hash || "";
      const search = location.search || "";
      if (!isAuthHash(hash) && !/[?&]code=/.test(search)) return;
      const url = new URL(location.href);
      url.hash = "";
      url.searchParams.delete("code");
      history.replaceState(null, "", url.pathname + url.search);
      route = parseHash();
    }

    function currentPageUrl() {
      const url = new URL(location.href);

    function parseHash() {
      const raw = location.hash || "";
      if (isAuthHash(raw)) return { name: "home" };
      const h = raw.replace(/^#/, "") || "/";
      if (h === "/settings") return { name: "settings" };
      if (h === "/admin") return { name: "admin" };
      if (h === "/workout") return { name: "workout" };
      if (h === "/history") return { name: "history" };
      const hist = h.match(/^\/history\/(\d{4}-\d{2}-\d{2})$/);
      if (hist) return { name: "history", id: hist[1] };
      if (h === "/library") return { name: "library" };
      if (h === "/progress") return { name: "progress" };
      const pg = h.match(/^\/progress\/([^/]+)$/);
      if (pg) return { name: "progress", id: decodeURIComponent(pg[1]) };
      const tm = h.match(/^\/template\/([^/]+)$/);
      if (tm) return { name: "template", id: decodeURIComponent(tm[1]) };
      const m = h.match(/^\/exercise\/([^/]+)$/);
      if (m) return { name: "exercise", id: decodeURIComponent(m[1]) };
      return { name: "home" };
    }

    function unit() { return state.settings.unit; }
    function toDisplay(lbs) {

    function toLbsFrom(weight, fromUnit) {
      const n = typeof weight === "number" ? weight : parseFloat(weight);
      if (!Number.isFinite(n)) return 0;
      if (fromUnit === "kg") return n * LB_PER_KG;
      return n;
    }
    function fmtWeight(lbs, withUnit) {
      const n = toDisplay(lbs);
      const rounded = unit() === "kg" ? Math.round(n * 10) / 10 : Math.round(n * 2) / 2;
      if (rounded === 0) return withUnit ? "BW" : "0";
      const s = unit() === "kg"
        ? (Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1))
        : (Number.isInteger(rounded) ? String(rounded) : String(rounded));
      return withUnit ? s + " " + unit() : s;
    }
    function weightStep() { return unit() === "kg" ? 2.5 : 5; }
    function epley(lbs, reps) {
      if (!reps || reps < 1 || !lbs) return 0;
      if (reps === 1) return lbs;
      return lbs * (1 + reps / 30);
    }
    function todayKey(ts) {
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
    function formatDay(key) {
      const [y, m, d] = key.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      const today = todayKey(Date.now());
      const yest = todayKey(Date.now() - 86400000);
      if (key === today) return "Today";
      if (key === yest) return "Yesterday";
      return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }
    function repLabel(n) { return n === 1 ? "1 rep" : n + " reps"; }
    function escapeHtml(s) {

      }[c]));
    }
    function toIso(ts) {

    function setsFor(exId) {

    function prsFor(exId) {
      const list = setsFor(exId);
      if (!list.length) return { heaviest: null, epley: null };
      let heaviest = list[0];
      let best = list[0];
      let bestVal = epley(list[0].weightLbs, list[0].reps);
      for (const s of list) {
        if (s.weightLbs > heaviest.weightLbs) heaviest = s;
        const v = epley(s.weightLbs, s.reps);
        if (v > bestVal) { bestVal = v; best = s; }
      }
      return { heaviest, epley: { set: best, value: bestVal } };

    function topWeightByDay(exId) {

    async function fetchAll() {
      const [exRes, setRes, settingsRes] = await Promise.all([
        sb.from("exercises").select("id,name,custom,created_at").order("created_at", { ascending: true }),
        sb.from("sets").select("id,exercise_id,weight,reps,unit,performed_at").order("performed_at", { ascending: true }),
        sb.from("user_settings").select("unit").maybeSingle()
      ]);
      if (exRes.error) throw asError(exRes.error, "Couldn't load exercises.");
      if (setRes.error) throw asError(setRes.error, "Couldn't load sets.");
      if (settingsRes.error) throw asError(settingsRes.error, "Couldn't load settings.");
      return {
        exercises: exRes.data || [],
        sets: setRes.data || [],
        settings: settingsRes.data
      };
    }

    async function seedAccount(uid) {
      const rows = DEFAULT_NAMES.map(name => ({ user_id: uid, name, custom: false }));
      const ex = await sb.from("exercises").insert(rows);
      if (ex.error) throw asError(ex.error, "Couldn't set up your exercises.");
      const st = await sb.from("user_settings").insert({ user_id: uid, unit: "lbs" });
      if (st.error) throw asError(st.error, "Couldn't set up your settings.");

    async function doLoad() {
      const seq = ++loadSeq;
      const uid = session && session.user && session.user.id;
      if (!uid) return;
      loading = true;
      bootError = "";
      render();
      try {
        let pack = await fetchAll();
        if (seq !== loadSeq) return;
        const brandNew = !pack.settings && pack.exercises.length === 0 && pack.sets.length === 0;
        if (brandNew) {
          await seedAccount(uid);
          if (seq !== loadSeq) return;
          pack = await fetchAll();
        } else if (!pack.settings) {
          const st = await sb.from("user_settings").insert({ user_id: uid, unit: "lbs" });
          if (st.error) throw asError(st.error, "Couldn't set up your settings.");
          pack.settings = { unit: "lbs" };
        }
        if (seq !== loadSeq) return;
        applyServerState(pack.exercises, pack.sets, pack.settings);
        await loadTemplates();
        if (seq !== loadSeq) return;
        dataReadyFor = uid;
        loading = false;
        bootError = "";
        offerMigration();
        maybeOpenTutorial();
        render();
        if (!restSettings.push) turnPushOff({ quiet: true });
      } catch (err) {
        if (seq !== loadSeq) return;
        console.error(err);
        loading = false;
        bootError = err.message || "Couldn't load your log.";
        render();
      }
    }

    async function persistUnit(next) {
      const res = await sb.from("user_settings").upsert({
        user_id: session.user.id,

        updated_at: new Date().toISOString()
      }, { onConflict: "user_id" });
      if (res.error) throw asError(res.error, "Couldn't update units.");
    }

    function rowsFromBackup(data) {
      const idMap = new Map();
      const seen = new Map();
      const exRows = [];
      for (const ex of data.exercises) {
        const name = String((ex && ex.name) || "").trim().slice(0, 60);
        if (!name) continue;
        const key = name.toLowerCase();
        if (seen.has(key)) {
          if (ex.id != null) idMap.set(ex.id, seen.get(key));
          continue;
        }
        const id = uid();
        seen.set(key, id);
        if (ex.id != null) idMap.set(ex.id, id);
        exRows.push({
          id,
          user_id: session.user.id,
          name,
          custom: !!(ex && ex.custom),
          created_at: toIso(ex && ex.createdAt)
        });
      }
      const setRows = [];
      for (const s of data.sets) {
        const exerciseId = idMap.get(s.exerciseId);
        if (!exerciseId) continue;
        const weight = toLbsFrom(s.weightLbs, "lbs");
        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(weight) || weight < 0 || !Number.isFinite(reps) || reps < 1) continue;
        setRows.push({
          id: uid(),
          user_id: session.user.id,
          exercise_id: exerciseId,
          weight,
          reps,
          unit: "lbs",
          performed_at: toIso(s.createdAt)
        });
      }
      const unitName = data.settings && data.settings.unit === "kg" ? "kg" : "lbs";
      return { exRows, setRows, unitName };
    }

    async function replaceWithBackup(data) {
      const built = rowsFromBackup(data);
      const uidNow = session.user.id;
      const deleted = await sb.from("exercises").delete().eq("user_id", uidNow);
      if (deleted.error) throw asError(deleted.error, "Couldn't replace your log.");
      if (built.exRows.length) {
        const ex = await sb.from("exercises").insert(built.exRows);
        if (ex.error) throw asError(ex.error, "Couldn't import exercises.");
      }
      if (built.setRows.length) {
        const sets = await sb.from("sets").insert(built.setRows);
        if (sets.error) throw asError(sets.error, "Couldn't import sets.");
      }
      await persistUnit(built.unitName);
    }

    async function mergeLegacy(data) {
      const nameToId = new Map(state.exercises.map(e => [e.name.trim().toLowerCase(), e.id]));
      const idMap = new Map();
      const newRows = [];
      for (const ex of data.exercises) {
        const name = String((ex && ex.name) || "").trim().slice(0, 60);
        if (!name) continue;
        const key = name.toLowerCase();
        let id = nameToId.get(key);
        if (!id) {
          id = uid();
          nameToId.set(key, id);
          newRows.push({
            id,
            user_id: session.user.id,
            name,
            custom: ex.custom !== false,
            created_at: toIso(ex.createdAt)
          });
        }
        if (ex.id != null) idMap.set(ex.id, id);
      }
      if (newRows.length) {
        const ex = await sb.from("exercises").insert(newRows);
        if (ex.error) throw asError(ex.error, "Couldn't import exercises.");
      }
      const setRows = [];
      for (const s of data.sets) {
        const exerciseId = idMap.get(s.exerciseId);
        if (!exerciseId) continue;
        const weight = toLbsFrom(s.weightLbs, "lbs");
        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(weight) || weight < 0 || !Number.isFinite(reps) || reps < 1) continue;
        setRows.push({
          id: uid(),
          user_id: session.user.id,
          exercise_id: exerciseId,
          weight,
          reps,
          unit: "lbs",
          performed_at: toIso(s.createdAt)
        });
      }
      if (setRows.length) {
        const sets = await sb.from("sets").insert(setRows);
        if (sets.error) throw asError(sets.error, "Couldn't import sets.");
      }
      if (data.settings && (data.settings.unit === "kg" || data.settings.unit === "lbs")) {

    function onAuth(event, sess) {
      if (event === "PASSWORD_RECOVERY") recoveryMode = true;
      if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
        if (sess) session = sess;
        return;
      }
      const next = (!sess || event === "SIGNED_OUT") ? null : sess;
      if (!next) {
        session = null;
        loadSeq++;
      } else {
        session = next;
        if (!recoveryMode && dataReadyFor !== next.user.id) {
          loading = true;
          bootError = "";
        }
      }
      setTimeout(() => bootFromSession(event, next), 0);
    }

    function bootFromSession(event, sess) {
      if (recoveryMode && sess && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        session = sess;
        authResolved = true;
        loading = false;
        stripAuthParams();
        render();
        return;
      }
      if (!sess) {
        const failedRecovery = recoveryMode;
        session = null;
        recoveryMode = false;
        dataReadyFor = null;
        adminStats = undefined;
        adminStatsBusy = false;
        adminStatsToken++;
        state = blankState();
        activeWorkout = null;
        workoutDrafts = {};
        planDrafts = {};
        restSession = null;
        restAlerted = false;
        clearInterval(restTick);
        try { localStorage.removeItem(REST_SESSION_KEY); } catch {}
        screenLockHold = false;
        syncScreenLock();
        templatesMode = "local";
        modal = null;
        draft = { weight: "", reps: "" };
        draftExId = null;
        loading = false;
        bootError = "";
        authResolved = true;
        authBusy = false;
        authMode = "login";
        tutorialOpen = false;
        if (accountJustDeleted) {
          authNotice = "Your account was deleted";
          accountJustDeleted = false;
        } else {
          authNotice = "";
        }
        authForm.password = "";
        authForm.password2 = "";
        if (failedRecovery) {
          authMode = "forgot";
          authError = authError || "This reset link is invalid or expired.";
        } else {
          authError = "";
        }
        stripAuthParams();
        render();
        return;
      }
      session = sess;
      authResolved = true;
      stripAuthParams();

        render();
        return;

    function svgChart(points) {
      if (!points.length) return '<div class="chart-empty">Log a few sessions to see your trend</div>';
      const w = 360, h = 128, padL = 8, padR = 8, padT = 12, padB = 22;
      const ys = points.map(p => toDisplay(p.weightLbs));
      let min = Math.min(...ys), max = Math.max(...ys);
      if (min === max) { min = min * 0.9; max = max * 1.1 || 1; }
      const span = max - min || 1;
      const x = (i) => {
        if (points.length === 1) return w / 2;
        return padL + (i / (points.length - 1)) * (w - padL - padR);
      };
      const y = (v) => padT + (1 - (v - min) / span) * (h - padT - padB);
      const coords = points.map((p, i) => [x(i), y(toDisplay(p.weightLbs))]);
      const line = coords.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
      const area = line + " L" + coords[coords.length - 1][0].toFixed(1) + " " + (h - padB) +
        " L" + coords[0][0].toFixed(1) + " " + (h - padB) + " Z";
      const dots = coords.map((c, i) => {
        const last = i === coords.length - 1;
        return `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${last ? 4.5 : 3.2}" fill="${last ? "var(--accent)" : "var(--accent-2)"}" />`;
      }).join("");
      const lastPt = coords[coords.length - 1];
      const lastVal = fmtWeight(points[points.length - 1].weightLbs, false);
      const valX = Math.min(w - 16, Math.max(16, lastPt[0] + (points.length === 1 ? 0 : 8)));
      const valAnchor = points.length === 1 ? "middle" : (lastPt[0] > w - 50 ? "end" : "start");
      const firstLbl = points[0].date.slice(5);
      const lastLbl = points[points.length - 1].date.slice(5);
      const dateLabels = firstLbl === lastLbl
        ? `<text x="${w / 2}" y="${h - 6}" fill="var(--muted)" font-size="10" text-anchor="middle">${escapeHtml(firstLbl)}</text>`
        : `<text x="${padL}" y="${h - 6}" fill="var(--muted)" font-size="10">${escapeHtml(firstLbl)}</text>
        <text x="${w - padR}" y="${h - 6}" fill="var(--muted)" font-size="10" text-anchor="end">${escapeHtml(lastLbl)}</text>`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Top set weight over time">
        <path d="${area}" fill="var(--accent-dim)"></path>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}
        <text x="${valX.toFixed(1)}" y="${Math.max(12, lastPt[1] - 10).toFixed(1)}" fill="var(--accent-2)" font-size="11" font-weight="700" text-anchor="${valAnchor}">${escapeHtml(lastVal)}</text>
        ${dateLabels}
      </svg>`;
    }

    function screenName() {
      if (recoveryMode) return "recovery";
      if (!authResolved || (session && loading)) return "loading";
      if (!session) return "auth";

      if (route.name === "admin") return "admin";
      if (route.name === "exercise") return "exercise";
      if (route.name === "workout") return "workout";
      if (route.name === "history") return "history";
      if (route.name === "template") return "template";
      if (route.name === "library") return "library";
      if (route.name === "progress") return "progress";

    function render() {
      const scrollY = window.scrollY;
      const active = document.activeElement;
      const activeId = active && active.id;
      const activePos = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
      const screen = screenName();
      appEl.dataset.screen = screen;
      if (screen === "settings" || screen === "admin") ensureAdminStats();

      let html = "";
      if (screen === "recovery") html = renderRecovery();

      else if (screen === "error") html = renderBootError();
      else if (screen === "settings") html = renderSettings();
      else if (screen === "admin") html = renderAdmin();
      else if (screen === "exercise") html = renderExercise();
      else if (screen === "workout") html = renderWorkout();
      else if (screen === "history") html = renderHistory();
      else if (screen === "template") html = renderTemplateEditor();
      else if (screen === "library") html = renderLibrary();

      if (session && restSession && screen !== "loading" && screen !== "auth" && screen !== "recovery") html += restSheetHtml();
      appEl.innerHTML = html;

        const preferred = document.getElementById(focusAuthField);
        focusAuthField = "";
        if (preferred) {
          preferred.focus();
          syncScreenLock();

        }

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (activePos && el.setSelectionRange) {
            try { el.setSelectionRange(activePos[0], activePos[1]); } catch {}
          }

      } else {
        window.scrollTo(0, scrollY);

        const target = document.getElementById("wo-" + focusWorkoutId);
        focusWorkoutId = "";

        historyFocus = "";
        if (target && target.scrollIntoView) target.scrollIntoView({ block: "center" });
      }
    }

    function rangeCutoff(range) {
      if (range === "1m" || range === "3m" || range === "6m") {
        const months = range === "1m" ? 1 : range === "3m" ? 3 : 6;
        const d = new Date();
        d.setMonth(d.getMonth() - months);
        return d.getTime();
      }
      return 0;
    }
    function isBwSet(lbs) { return fmtWeight(lbs, false) === "0"; }
    function progressSets(exId) {
      const cutoff = rangeCutoff(progressRange);
      return setsFor(exId).filter(s => !cutoff || s.createdAt >= cutoff);
    }
    function progressIsBw(sets) {
      return sets.length > 0 && sets.every(s => isBwSet(s.weightLbs));
    }
    function progressDays(sets) {
      const map = new Map();
      for (const s of sets) {
        const k = todayKey(s.createdAt);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(s);
      }
      return Array.from(map.entries()).map(([date, daySets]) => ({
        date,
        sets: daySets.slice().sort((a, b) => a.createdAt - b.createdAt)
      })).sort((a, b) => a.date < b.date ? -1 : 1);
    }
    function dayMetric(day, metric, bw) {
      if (bw && metric === "weight") return Math.max.apply(null, day.sets.map(s => s.reps));
      if (bw && metric === "volume") return day.sets.reduce((sum, s) => sum + s.reps, 0);
      if (metric === "epley") return Math.max.apply(null, day.sets.map(s => toDisplay(epley(s.weightLbs, s.reps))));
      if (metric === "volume") return day.sets.reduce((sum, s) => sum + toDisplay(s.weightLbs) * s.reps, 0);
      return Math.max.apply(null, day.sets.map(s => toDisplay(s.weightLbs)));
    }
    function fmtMetric(value, metric, bw) {
      if (bw && (metric === "weight" || metric === "volume")) {
        const n = Math.round(value);
        return n === 1 ? "1 rep" : n + " reps";
      }
      if (metric === "volume") return Math.round(value) + (unit() === "kg" ? " kg" : " lb");
      if (!value) return "—";
      const rounded = unit() === "kg" ? Math.round(value * 10) / 10 : Math.round(value);
      if (rounded === 0) return "BW";
      const s = unit() === "kg" && !Number.isInteger(rounded) ? rounded.toFixed(1) : String(rounded);
      return s + " " + unit();
    }
    function keyTime(key) {
      const parts = key.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
    }
    function trendText(points, metric, bw) {
      if (points.length < 2) return "Log another session to see a trend.";
      const days = Math.max(1, Math.round((keyTime(points[points.length - 1].date) - keyTime(points[0].date)) / 86400000));
      const delta = points[points.length - 1].value - points[0].value;
      const repsMode = bw && (metric === "weight" || metric === "volume");
      const flat = repsMode || metric === "volume" ? 0.5 : 0.25;
      if (Math.abs(delta) < flat) return "No change in " + days + " days";
      const sign = delta > 0 ? "+" : "";
      if (repsMode) return sign + Math.round(delta) + " reps in " + days + " days";
      const rounded = unit() === "kg" ? Math.round(delta * 10) / 10 : Math.round(delta);
      return sign + rounded + " " + (unit() === "kg" ? "kg" : "lb") + " in " + days + " days";
    }
    function svgValueChart(points) {
      if (!points.length) return '<div class="chart-empty">Nothing in this range yet.</div>';
      const w = 360, h = 148, padL = 8, padR = 8, padT = 16, padB = 22;
      const ys = points.map(p => p.value);
      let min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
      if (min === max) { min = min === 0 ? 0 : min * 0.9; max = (max * 1.1) || 1; }
      const span = (max - min) || 1;

    function formatDuration(sets) {
      if (!sets || sets.length < 2) return "";
      const times = sets.map(s => s.createdAt).slice().sort((a, b) => a - b);

      if (mins < 1) return "";
      if (mins < 60) return mins + " min";
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return m ? h + "h " + m + "m" : h + "h";
    }
    function templateNameForDay(date, sets) {

      return activeWorkout.name;
    }
    function workoutHistory() {

      });
      return Array.from(map.entries()).map(([date, sets]) => {
        const ordered = sets.slice().sort((a, b) => a.createdAt - b.createdAt);
        const exerciseIds = [];
        ordered.forEach(s => { if (exerciseIds.indexOf(s.exerciseId) === -1) exerciseIds.push(s.exerciseId); });
        const volume = ordered.reduce((sum, s) => sum + toDisplay(s.weightLbs) * s.reps, 0);
        return {
          date,
          sets: ordered,
          exerciseIds,
          volume,
          duration: formatDuration(ordered),
          templateName: templateNameForDay(date, ordered)

      }).sort((a, b) => a.date < b.date ? 1 : -1);

    function groupSets(exId) {
      const map = new Map();
      for (const s of setsFor(exId).slice().reverse()) {
        const k = todayKey(s.createdAt);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(s);
      }
      // Within a day, show chronological order (first set first)
      return Array.from(map.entries()).map(([date, sets]) => ({
        date,
        sets: sets.slice().sort((a, b) => a.createdAt - b.createdAt)
      }));
    }

    function iosInstallTip() {
      const ua = navigator.userAgent || "";
      const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const safari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
      const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      if (!ios || !safari || standalone) return "";
      return `<div class="eyebrow">Add to Home Screen</div>
        <p class="hint">In Safari, tap Share, then Add to Home Screen. Lift Log opens full screen, clear of the notch and home bar.</p>`;
    }
    function statNum(v) {

    function ensureAdminStats() {
      if (adminStats !== undefined || adminStatsBusy || !session) return;
      adminStatsBusy = true;
      const token = ++adminStatsToken;
      sb.rpc("admin_stats").then(res => {
        if (token !== adminStatsToken) return;
        adminStatsBusy = false;
        let data = res && res.data;
        if (!res || res.error || data == null) adminStats = null;
        else {
          if (typeof data === "string") {
            try { data = JSON.parse(data); } catch { data = null; }
          }
          adminStats = data && typeof data === "object" ? data : null;
        }
        if (route.name === "settings" || route.name === "admin") render();
      }).catch(() => {
        if (token !== adminStatsToken) return;
        adminStatsBusy = false;
        adminStats = null;
      });
    }
    function adminBars(days) {
      const list = Array.isArray(days) ? days.slice(0, 14) : [];
      if (!list.length) return `<div class="chart-empty">No days yet</div>`;
      const w = 360, h = 128, padB = 20, padT = 10, gap = 4;
      const max = Math.max(1, ...list.map(d => Number(d.n) || 0));
      const bw = (w - gap * (list.length - 1)) / list.length;
      const bars = list.map((d, i) => {
        const n = Number(d.n) || 0;
        const bh = n ? Math.max(4, (n / max) * (h - padT - padB)) : 2;
        const x = i * (bw + gap);
        const y = h - padB - bh;
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, bw).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${n ? "var(--accent)" : "var(--line)"}"></rect>`;
      }).join("");
      const label = (d) => escapeHtml(String(d && d.d || "").slice(5));
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Active lifters for the last 14 days">
        ${bars}
        <text x="0" y="${h - 4}" fill="var(--muted)" font-size="10">${label(list[0])}</text>
        <text x="${w}" y="${h - 4}" fill="var(--muted)" font-size="10" text-anchor="end">${label(list[list.length - 1])}</text>
      </svg>`;
    }

              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn danger" data-action="delete-exercise">Delete</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "edit-set") {
        const s = state.sets.find(x => x.id === modal.id);
        if (!s) return "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Edit set">
            <div class="grab"></div>
            <h2>Edit set</h2>
            <div class="num-row">

                <label class="field-lbl" for="edit-weight">Weight (${unit()})</label>
                <input class="num-input" id="edit-weight" inputmode="decimal" value="${escapeHtml(fmtWeight(s.weightLbs, false))}">
              </div>
              <div>
                <label class="field-lbl" for="edit-reps">Reps</label>
                <input class="num-input" id="edit-reps" inputmode="numeric" value="${s.reps}">
              </div>
            </div>
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal">Cancel</button>
              <button class="btn primary" data-action="save-set">Save</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "confirm-import") {
        const busy = modal.busy ? "disabled" : "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Replace data">
            <div class="grab"></div>
            <h2>Replace all data?</h2>
            <p class="hint">Importing a backup overwrites the exercises and sets in this account.</p>
            <div class="sheet-actions">
              <button class="btn ghost" data-action="close-modal" ${busy}>Cancel</button>
              <button class="btn primary" data-action="do-import" ${busy}>${modal.busy ? "Importing…" : "Import"}</button>
            </div>
          </div>
        </div>`;
      }
      if (modal.type === "migrate-local") {
        const data = modal.data || { exercises: [], sets: [] };
        const setCount = data.sets.length;
        const exCount = data.exercises.length;
        const busy = modal.busy ? "disabled" : "";
        const detail = `${setCount} set${setCount === 1 ? "" : "s"} across ${exCount} exercise${exCount === 1 ? "" : "s"} on this phone.`;
        const err = modal.error ? `<p class="form-error" role="alert">${escapeHtml(modal.error)}</p>` : "";
        return `<div class="overlay">
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="migrate-title">
            <div class="grab"></div>
            <h2 id="migrate-title">Import your saved logs into this account</h2>
            <p class="hint">${escapeHtml(detail)} They'll be added to ${escapeHtml(signedInEmail() || "this account")}.</p>
            ${err}
            <div class="sheet-actions">
              <button class="btn ghost" data-action="migrate-dismiss" ${busy}>Not now</button>
              <button class="btn primary" data-action="migrate-import" ${busy}>${modal.busy ? "Importing…" : "Import"}</button>
            </div>
          </div>
        </div>`;
      }
      return "";
    }

    function parseWeight(str) {
      const n = parseFloat(String(str).replace(",", "."));
      if (!Number.isFinite(n) || n < 0) return null;
      return n;
    }
    function parseReps(str) {
      const n = parseInt(String(str), 10);
      if (!Number.isFinite(n) || n < 1) return null;
      return n;
    }
    function validateAuth(mode) {
      const email = authForm.email.trim();
      if (mode !== "recovery") {
        if (!email || email.indexOf("@") === -1) return "Enter a valid email.";
      }
      if (mode === "forgot") return "";
      if (!authForm.password || authForm.password.length < 6) return "Use at least 6 characters.";
      if ((mode === "signup" || mode === "recovery") && authForm.password !== authForm.password2) return "Passwords don't match.";
      return "";
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach(el => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          go(el.getAttribute("data-go"));
        });
      });

      const overlay = document.querySelector(".overlay");
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay && (!modal || modal.type !== "migrate-local")) closeModal();
        });
        const sheet = overlay.querySelector(".sheet");
        if (sheet) sheet.addEventListener("click", (e) => e.stopPropagation());
      }

      const nameInput = document.getElementById("modal-name");
      if (nameInput && modal && (modal.type === "add-exercise" || modal.type === "rename-exercise")) {
        setTimeout(() => { nameInput.focus(); nameInput.select(); }, 30);
        nameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") saveExerciseName();
        });
      }

      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", (e) => {
          const action = el.getAttribute("data-action");
          if (action === "close-modal" && e.currentTarget.classList.contains("overlay") && e.target !== el) return;
          if (action === "push-alerts" && el.getAttribute("data-on") === "1") {
            const blocked = pushEnableBlocker();
            if (blocked) {
              failPush(blocked);
              return;
            }
            pushClosing = false;
            pushEpoch++;
            let permissionPromise;
            try {
              permissionPromise = Notification.requestPermission();
            } catch (err) {
              permissionPromise = Promise.reject(err);
            }
            setPushAlerts(true, permissionPromise);
            return;
          }
          handleAction(action, el);
        });
      });
      bindHomeCalendar();

      const dw = document.getElementById("draft-weight");
      const dr = document.getElementById("draft-reps");
      if (dw) dw.addEventListener("input", () => { draft.weight = dw.value; });
      if (dr) dr.addEventListener("input", () => { draft.reps = dr.value; });
      document.querySelectorAll("[data-draft-weight]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-draft-weight");
          readWorkoutDraft(id);
        });
      });
      document.querySelectorAll("[data-draft-reps]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-draft-reps");
          readWorkoutDraft(id);
        });
      });
      const tplName = document.getElementById("tpl-name");
      if (tplName) tplName.addEventListener("change", () => saveTemplateName());
      const progressSearch = document.getElementById("progress-search");
      if (progressSearch) {
        progressSearch.addEventListener("input", () => {
          progressQuery = progressSearch.value;
          render();
        });
      }
      const libSearch = document.getElementById("lib-search");
      if (libSearch) {
        libSearch.addEventListener("input", () => {
          libQuery = libSearch.value;
          render();
        });
      }
      const picker = document.getElementById("picker-search");
      if (picker && modal) {
        picker.addEventListener("input", () => {
          const box = document.getElementById("also-save-template");
          const nameInput = document.getElementById("tpl-add-name");
          if (box) modal.alsoSave = box.checked;
          if (nameInput) modal.value = nameInput.value;
          modal.query = picker.value;
          render();
        });
      }
      document.querySelectorAll("[data-plan-weight], [data-plan-reps]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-plan-weight") || input.getAttribute("data-plan-reps");
          const index = input.getAttribute("data-index");
          readPlan(id, index);
        });
      });

      const authFormEl = document.getElementById("auth-form");
      if (authFormEl) authFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        submitAuth();
      });
      const recoveryFormEl = document.getElementById("recovery-form");
      if (recoveryFormEl) recoveryFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        submitNewPassword();
      });
      const tutorial = document.getElementById("tutorial");
      if (tutorial) {
        let startX = 0, startY = 0, tracking = false;
        tutorial.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button")) return;
          tracking = true;
          startX = e.clientX;
          startY = e.clientY;
        });
        tutorial.addEventListener("pointerup", (e) => {
          if (!tracking) return;
          tracking = false;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
          if (dx < 0) tutorialNext();
          else tutorialBack();
        });
      }
      const deleteConfirm = document.getElementById("delete-confirm");
      if (deleteConfirm && modal && modal.type === "delete-account") {
        deleteConfirm.addEventListener("input", () => {
          modal.phrase = deleteConfirm.value;
          const goBtn = document.getElementById("delete-account-go");
          if (goBtn) goBtn.disabled = deleteConfirm.value.trim() !== "DELETE";
        });
      }
      ["auth-email", "auth-password", "auth-password2"].forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;
        input.addEventListener("input", () => {
          if (id === "auth-email") authForm.email = input.value;
          if (id === "auth-password") authForm.password = input.value;
          if (id === "auth-password2") authForm.password2 = input.value;
        });
      });
    }

      modal = null;

    async function handleAction(action, el) {
      if (action === "close-modal") {
        if (modal && modal.busy) return;
        return closeModal();
      }
      if (action === "auth-mode") {
        authMode = el.getAttribute("data-mode") || "login";
        authError = "";
        authNotice = "";
        authForm.password = "";
        authForm.password2 = "";
        focusAuthField = "auth-email";
        render();
        return;
      }
      if (action === "retry-load") {
        dataReadyFor = null;
        bootError = "";
        loadAccount();
        return;
      }
      if (action === "log-out") {
        authForm.password = "";
        authForm.password2 = "";
        try {
          await sb.auth.signOut();
        } catch (err) {
          showToast(err.message || "Couldn't log out.");
        }
        return;
      }
      if (action === "migrate-dismiss") {
        localStorage.setItem(migrationFlag(), "dismissed");
        modal = null;
        maybeOpenTutorial();
        render();
        return;
      }
      if (action === "share-app") return shareLiftLog();
      if (action === "show-tutorial") {
        tutorialOpen = true;
        tutorialStep = 0;
        return render();
      }
      if (action === "tutorial-next") return tutorialNext();
      if (action === "tutorial-back") return tutorialBack();
      if (action === "tutorial-skip") return closeTutorial();
      if (action === "tutorial-go") {
        const n = parseInt(el.getAttribute("data-step"), 10);
        if (Number.isFinite(n)) tutorialStep = Math.max(0, Math.min(TUTORIAL_STEPS.length - 1, n));
        return render();
      }
      if (action === "delete-account-open") {
        modal = { type: "delete-account", phrase: "" };
        return render();
      }
      if (action === "delete-account") return deleteAccount();
      if (action === "migrate-import") return migrateImport();
      if (action === "add-exercise") {
        modal = { type: "add-exercise", value: "" };
        return render();
      }
      if (action === "ex-menu") {
        modal = { type: "ex-menu", id: route.id };
        return render();
      }
      if (action === "rename-exercise") {
        const ex = exerciseById((modal && modal.id) || route.id);
        modal = { type: "rename-exercise", id: ex && ex.id, value: ex ? ex.name : "" };
        return render();
      }
      if (action === "confirm-delete-ex") {
        modal = { type: "confirm-delete-ex", id: (modal && modal.id) || route.id };
        return render();
      }
      if (action === "delete-exercise") return deleteExercise();
      if (action === "save-exercise-name") return saveExerciseName();
      if (action === "step-w") {
        readDraftInputs();
        const cur = parseWeight(draft.weight);
        const base = cur == null ? 0 : cur;
        const next = Math.max(0, Math.round((base + Number(el.getAttribute("data-dir")) * weightStep()) * 10) / 10);
        draft.weight = String(next);
        draftExId = route.id;
        return render();
      }
      if (action === "step-r") {
        readDraftInputs();
        const cur = parseReps(draft.reps);
        const base = cur == null ? 0 : cur;
        const next = Math.max(1, base + Number(el.getAttribute("data-dir")));
        draft.reps = String(next);
        draftExId = route.id;
        return render();
      }
      if (action === "add-set") return addSet();
      if (action === "edit-set") {
        modal = { type: "edit-set", id: el.getAttribute("data-id") };
        return render();
      }
      if (action === "save-set") return saveSetEdit();
      if (action === "delete-set") return deleteSet(el.getAttribute("data-id"));
      if (action === "set-unit") return setUnit(el.getAttribute("data-unit"));
      if (action === "set-theme") return setThemeMode(el.getAttribute("data-mode"));
      if (action === "set-accent") return setAccent(el.getAttribute("data-accent"));
      if (action === "export-json") return exportJson();
      if (action === "import-json") return chooseImportFile();
      if (action === "do-import") return doImport();
      if (action === "start-template") return startTemplate(el.getAttribute("data-id"));
      if (action === "resume-workout") return go("#/workout");
      if (action === "edit-template") return go("#/template/" + encodeURIComponent(el.getAttribute("data-id")));
      if (action === "new-template") {
        modal = { type: "new-template", value: "" };
        return render();
      }
      if (action === "save-new-template") return saveNewTemplate();
      if (action === "save-template-name") return saveTemplateName();
      if (action === "tpl-move") return moveTemplateExercise(el.getAttribute("data-id"), el.getAttribute("data-index"), el.getAttribute("data-dir"));
      if (action === "tpl-remove") return removeTemplateExercise(el.getAttribute("data-id"), el.getAttribute("data-index"));
      if (action === "tpl-add-open") {
        modal = { type: "add-template-exercise", id: el.getAttribute("data-id"), value: "", query: "" };
        return render();
      }
      if (action === "wo-add-open") {

        return render();
      }
      if (action === "tpl-add-library") return pickLibraryExercise(el.getAttribute("data-name"));
      if (action === "progress-metric") {

        render();
        return;
      }

        render();
        return;
      }
      if (action === "open-library") {
        libQuery = "";

      }
      if (action === "lib-equip") { libEquip = el.getAttribute("data-value") || "All"; render(); return; }
      if (action === "lib-muscle") { libMuscle = el.getAttribute("data-value") || "All"; render(); return; }
      if (action === "add-library") return addFromLibrary(el.getAttribute("data-name"));
      if (action === "tpl-add-existing") return pickExistingExercise(el.getAttribute("data-name"));
      if (action === "tpl-add-named") return addNamedFromPicker();

      if (action === "log-plan") return logPlannedSet(el.getAttribute("data-id"), parseInt(el.getAttribute("data-index"), 10));
      if (action === "wo-extra-set") return addExtraSet(el.getAttribute("data-id"));

      if (action === "rest-pause") return toggleRestPause();
      if (action === "rest-adjust") return adjustRest(Number(el.getAttribute("data-dir")));
      if (action === "rest-auto") return setRestAuto(el.getAttribute("data-on") === "1");
      if (action === "rest-sound") return setRestSound(el.getAttribute("data-on") === "1");
      if (action === "wake-lock") return setWakeLock(el.getAttribute("data-on") === "1");
      if (action === "push-alerts") return setPushAlerts(el.getAttribute("data-on") === "1");
      if (action === "push-test") return sendTestPush();
      if (action === "rest-default") return setDefaultRest(Number(el.getAttribute("data-dir")));
      if (action === "rest-ex") return setExerciseRest(el.getAttribute("data-name"), Number(el.getAttribute("data-dir")));
      if (action === "rest-ex-clear") return clearExerciseRest(el.getAttribute("data-name"));
      if (action === "delete-template") return deleteTemplate(el.getAttribute("data-id"));
      if (action === "wo-step-w" || action === "wo-step-r") return stepWorkout(action, el);
      if (action === "wo-add-set") return addWorkoutSet(el.getAttribute("data-id"));
      if (action === "finish-workout") return finishWorkout();

        modal = { type: "delete-workout", date: el.getAttribute("data-date"), count: day ? day.sets.length : 0 };
        return render();
      }
      if (action === "history-delete-confirm") return deleteWorkout();
      if (action === "history-delete-set") return deleteHistorySet(el.getAttribute("data-id"), el.getAttribute("data-date"));
    }

    async function submitAuth() {
      if (authBusy) return;
      readAuthInputs();
      const mode = authMode === "signup" || authMode === "forgot" ? authMode : "login";
      const problem = validateAuth(mode);
      authError = "";
      authNotice = "";
      if (problem) {
        authError = problem;
        render();
        return;
      }
      authBusy = true;
      render();
      try {
        if (mode === "forgot") {
          const { error } = await sb.auth.resetPasswordForEmail(authForm.email.trim(), {
            redirectTo: currentPageUrl()
          });
          if (error) throw error;
          authNotice = "Check your email for a link to reset your password.";
          return;
        }
        if (mode === "signup") {
          const { data, error } = await sb.auth.signUp({
            email: authForm.email.trim(),
            password: authForm.password,
            options: { emailRedirectTo: currentPageUrl() }
          });
          if (error) throw error;
          if (!data.session) {
            authMode = "login";
            authForm.password = "";
            authForm.password2 = "";
            authNotice = "Check your email to confirm your account, then log in.";
          }
          return;
        }
        const { error } = await sb.auth.signInWithPassword({
          email: authForm.email.trim(),
          password: authForm.password
        });
        if (error) throw error;
        authForm.password = "";
      } catch (err) {
        authError = err.message || "Something went wrong.";
      } finally {
        authBusy = false;
        render();
      }
    }

    async function submitNewPassword() {
      if (authBusy) return;
      readAuthInputs();
      const problem = validateAuth("recovery");
      if (problem) {
        authError = problem;
        render();
        return;
      }
      authBusy = true;
      authError = "";
      render();
      try {
        const { error } = await sb.auth.updateUser({ password: authForm.password });
        if (error) throw error;
        recoveryMode = false;
        authForm.password = "";
        authForm.password2 = "";
        authBusy = false;
        if (!dataReadyFor && session) await loadAccount();
        else render();
        showToast("Password updated");
      } catch (err) {
        authError = err.message || "Couldn't update that password.";
        authBusy = false;
        render();
      }
    }

    async function saveExerciseName() {
      if (saving) return;
      const input = document.getElementById("modal-name");

    function templatesCacheKey() {

    function isMissingSchema(error) {

      const code = String(error.code || "");

      if (code === "42P01" || code === "42703" || code === "PGRST205" || code === "PGRST204") return true;

    function isMissingColumn(error) {

    function builtinTemplateRecords() {

    function readTemplateCache() {

    function cacheTemplates() {

    function useLocalTemplates() {

    function rowToTemplate(row) {
      const names = (Array.isArray(row.exercise_names) ? row.exercise_names : []).map(n => String(n));
      const raw = Array.isArray(row.exercise_targets) ? row.exercise_targets : [];
      const targets = names.map((name, i) => {
        const hit = raw.find(x => x && String(x.name || "").toLowerCase() === name.toLowerCase()) || raw[i] || {};
        return {
          sets: clampTarget(hit.sets, 1, 20, 3),
          reps: clampTarget(hit.reps, 1, 100, 10)
        };
      });
      return {

        kind: row.kind || "custom",

    function templateById(id) {

    function suggestedTemplate() {
      const last = templateById(state.lastTemplateId);
      const lastKind = last && ROTATION.indexOf(last.kind) !== -1 ? last.kind : null;
      const nextKind = lastKind ? ROTATION[(ROTATION.indexOf(lastKind) + 1) % ROTATION.length] : "push";
      return (state.templates || []).find(t => t.kind === nextKind) || null;

    function restoreActive() {
      try {
        const raw = localStorage.getItem(activeWorkoutKey());
        if (!raw) { activeWorkout = null; return; }
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.exerciseIds) && !Array.isArray(data.items)) {
          data.items = data.exerciseIds.map(id => ({ exerciseId: id, sets: 3, reps: 10, extra: 0 }));
        }
        if (data && Array.isArray(data.items) && !Array.isArray(data.exerciseIds)) {

        if (!data || !Array.isArray(data.items) || !data.items.length) {

    async function loadTemplates() {

        let res = await sb.from("templates").select("id,name,kind,position,exercise_names,exercise_targets").order("position", { ascending: true });
        if (res.error && isMissingColumn(res.error)) {
          targetsColumn = false;

        }
        if (res.error) {
          console.warn(res.error);
          if (!(state.templates || []).length || isMissingSchema(res.error)) useLocalTemplates();
          return;
        }
        templatesMode = "remote";
        let rows = res.data || [];
        if (!rows.length && !localStorage.getItem(templatesSeedKey())) {
          const flag = await sb.from("user_settings").select("templates_seeded").maybeSingle();
          const already = !flag.error && flag.data && flag.data.templates_seeded;
          if (!already) {
            const cached = readTemplateCache();
            const source = cached && cached.templates && cached.templates.length ? cached.templates : null;
            rows = await seedRemoteTemplates(source);

        }
        state.templates = rows.map(rowToTemplate).sort((a, b) => a.position - b.position || a.name.localeCompare(b.name));
        const lastRes = await sb.from("user_settings").select("last_template_id").maybeSingle();
        state.lastTemplateId = (lastRes.data && lastRes.data.last_template_id) || localStorage.getItem(lastTemplateKey()) || null;

    async function seedRemoteTemplates(source) {
      const list = source && source.length ? source : builtinTemplateRecords();
      const idMap = {};
      const rows = list.map((t, i) => {
        const id = uid();
        if (t.id) idMap[t.id] = id;
        const kind = ROTATION.indexOf(t.kind) === -1 ? "custom" : t.kind;
        const names = t.exerciseNames || t.names || [];
        const targets = (t.targets && t.targets.length === names.length)
          ? names.map((name, n) => ({ name, sets: clampTarget(t.targets[n].sets, 1, 20, 3), reps: clampTarget(t.targets[n].reps, 1, 100, 10) }))
          : names.map(name => ({ name, sets: 3, reps: 10 }));
        const row = {
          id,
          user_id: session.user.id,
          name: t.name,
          kind,
          position: t.position != null ? t.position : i,
          exercise_names: names
        };
        if (targetsColumn) row.exercise_targets = targets;
        return row;
      });
      let ins = await sb.from("templates").insert(rows);
      if (ins.error && isMissingColumn(ins.error)) {
        targetsColumn = false;
        rows.forEach(row => { delete row.exercise_targets; });
        ins = await sb.from("templates").insert(rows);

      if (ins.error && ins.error.code !== "23505") console.warn(ins.error);
