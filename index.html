<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <meta name="application-name" content="Lift Log">
  <meta name="description" content="Log your lifts by exercise. Each account keeps its own history.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <title>Lift Log</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --bg-elev: #121216;
      --surface: #18181e;
      --surface-2: #202028;
      --line: #2a2a34;
      --text: #f4f1ec;
      --muted: #8d8a86;
      --faint: #5c5a58;
      --accent: #ff6a2a;
      --accent-2: #ffd7a8;
      --accent-dim: rgba(255, 106, 42, 0.16);
      --good: #3ee08f;
      --good-dim: rgba(62, 224, 143, 0.12);
      --danger: #ff5a5a;
      --danger-dim: rgba(255, 90, 90, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --radius: 18px;
      --tap: 52px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      overscroll-behavior: none;
    }
    button, input { font: inherit; color: inherit; }
    button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; }
    input { background: none; border: 0; outline: none; }
    input[type="number"] { -moz-appearance: textfield; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(24px + var(--safe-b));
      padding-left: var(--safe-l);
      padding-right: var(--safe-r);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(10px + var(--safe-t)) 14px 10px;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
    }
    .topbar.scrolled { border-bottom-color: var(--line); }
    .topbar h1 {
      flex: 1;
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--accent);
      display: grid;
      place-items: center;
    }
    .brand-mark svg { display: block; }
    .brand h1 { font-size: 22px; }

    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--text);
      flex-shrink: 0;
    }
    .icon-btn:active { background: var(--surface-2); transform: scale(0.96); }
    .icon-btn.ghost { color: var(--muted); }

    .screen { padding: 8px 16px 0; flex: 1; }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 8px 2px 10px;
    }

    .ex-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
    .ex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px 10px 16px;
      min-height: 64px;
    }
    .ex-row:active { transform: scale(0.99); background: var(--surface-2); }
    .ex-row .meta { flex: 1; min-width: 0; }
    .ex-row .name {
      font-weight: 650;
      font-size: 17px;
      letter-spacing: -0.02em;
      display: block;
    }
    .ex-row .last {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      display: block;
    }
    .ex-row .chev { color: var(--faint); flex-shrink: 0; }
    .add-ex-wrap {
      position: sticky;
      bottom: 0;
      margin: 8px -16px 0;
      padding: 14px 16px calc(8px + var(--safe-b));
      background: linear-gradient(180deg, transparent, var(--bg) 36%);
    }
    .add-ex {
      width: 100%;
      min-height: var(--tap);
      border-radius: var(--radius);
      border: 1.5px dashed #3a3a44;
      background: var(--bg-elev);
      color: var(--accent-2);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .add-ex:active { background: var(--surface); }

    .pr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pr-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
    }
    .pr-card .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .pr-card .val {
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.04em;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .pr-card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .pr-card.best .val { color: var(--good); }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 12px 8px;
      margin-bottom: 16px;
    }
    .chart-card .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 2px 4px 8px;
    }
    .chart-wrap { height: 128px; }
    .chart-wrap svg { width: 100%; height: 100%; display: block; }
    .chart-empty {
      height: 128px;
      display: grid;
      place-items: center;
      color: var(--faint);
      font-size: 13px;
    }

    .logger {
      background: linear-gradient(180deg, #1a1a22 0%, var(--surface) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 14px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .logger-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
    }
    .stepper { text-align: center; }
    .stepper .unit-lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stepper input {
      width: 100%;
      min-width: 0;
      text-align: center;
      font-size: 40px;
      font-weight: 750;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      padding: 2px 0 4px;
      height: 52px;
    }
    .step-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }
    .step-btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 26px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent-2);
    }
    .step-btn:active { background: var(--accent-dim); transform: scale(0.95); }
    .add-set {
      margin-top: 14px;
      width: 100%;
      height: 58px;
      border-radius: 16px;
      background: var(--accent);
      color: #1a0a00;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.02em;
    }
    .add-set:active { filter: brightness(0.92); transform: scale(0.99); }
    .add-set:disabled { opacity: 0.45; }

    .day-group { margin-bottom: 16px; }
    .day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 4px 8px;
    }
    .day-head .when { font-weight: 700; font-size: 14px; }
    .day-head .vol { color: var(--muted); font-size: 12px; }
    .set-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 8px 8px 14px;
      margin-bottom: 6px;
      min-height: 52px;
    }
    .set-idx {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      min-width: 46px;
    }
    .set-main { flex: 1; font-weight: 650; font-variant-numeric: tabular-nums; }
    .set-main span { color: var(--muted); font-weight: 500; }
    .row-actions { display: flex; gap: 4px; }
    .mini {
      min-width: 44px;
      height: 44px;
      padding: 0 10px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .mini:active { background: var(--surface-2); }
    .mini.danger { color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 22px 12px;
      font-size: 14px;
    }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      width: 100%;
      text-align: left;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
    }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row .k { font-weight: 650; }
    .settings-row .d { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .settings-row:active.tappable { background: var(--surface-2); }

    .seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
    }
    .seg button {
      min-width: 64px;
      height: 36px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
    }
    .seg button.on {
      background: var(--accent);
      color: #1a0a00;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      padding: 4px 8px 16px;
      line-height: 1.5;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-elev);
      border-radius: 22px 22px 0 0;
      padding: 10px 16px calc(20px + var(--safe-b));
      border-top: 1px solid var(--line);
      animation: up 0.22s ease;
    }
    @keyframes up {
      from { transform: translateY(16px); opacity: 0.6; }
      to { transform: none; opacity: 1; }
    }
    .grab {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: #3a3a44;
      margin: 4px auto 14px;
    }
    .sheet h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: -0.02em; }
    .field-lbl {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .text-input, .num-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 17px;
      margin-bottom: 14px;
    }
    .num-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sheet-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      font-weight: 750;
    }
    .btn.primary { background: var(--accent); color: #1a0a00; }
    .btn.primary:active { filter: brightness(0.92); }
    .btn.ghost { background: var(--surface-2); color: var(--text); }
    .btn.danger { background: var(--danger-dim); color: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + var(--safe-b));
      transform: translateX(-50%);
      background: #f4f1ec;
      color: #16140f;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      z-index: 80;
      box-shadow: var(--shadow);
      animation: pop 0.2s ease;
      max-width: calc(100% - 32px);
    }
    body:has(#rest-sheet) .toast { bottom: calc(248px + var(--safe-b)); }
    @keyframes pop {
      from { transform: translateX(-50%) translateY(8px); opacity: 0; }
      to { transform: translateX(-50%); opacity: 1; }
    }

    .more-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .more-menu button {
      text-align: left;
      padding: 14px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 650;
      min-height: 52px;
    }
    .more-menu button:active { background: var(--surface-2); }
    .more-menu button.warn { color: var(--danger); }

    .settings-row > div:first-child { min-width: 0; flex: 1; }
    .settings-row .d { overflow-wrap: anywhere; }

    .auth-card {
      background: linear-gradient(180deg, #1a1a22 0%, var(--surface) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 16px 16px;
      margin-top: 8px;
      box-shadow: var(--shadow);
    }
    .auth-card h2 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    .auth-lead {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 16px;
      line-height: 1.45;
    }
    .auth-links { display: flex; flex-direction: column; margin-top: 6px; }
    .auth-link {
      min-height: 44px;
      padding: 10px 8px;
      color: var(--accent-2);
      font-weight: 650;
      width: 100%;
      text-align: center;
    }
    .auth-link:active { opacity: 0.7; }
    .form-error {
      color: var(--danger);
      background: var(--danger-dim);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .form-note {
      color: var(--accent-2);
      background: var(--accent-dim);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .status-block {
      min-height: 52dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      color: var(--muted);
      padding: 12px 8px 24px;
    }
    .status-block h2 { color: var(--text); margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .status-block .add-set { width: min(100%, 320px); }
    .status-block .form-error { width: min(100%, 320px); text-align: left; }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn:disabled, .add-set:disabled { opacity: 0.45; }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }

    .wo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .wo-card {
      display: flex;
      align-items: stretch;
      gap: 4px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 6px 6px 14px;
      min-height: 84px;
    }
    .wo-card.next {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(255, 106, 42, 0.18), var(--surface) 58%);
    }
    .wo-start { flex: 1; min-width: 0; text-align: left; padding: 8px 4px; }
    .wo-start .kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .wo-start .nm {
      display: block;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin-top: 2px;
    }
    .wo-start .sub {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .edit-chip {
      align-self: center;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 64px;
      min-height: 72px;
      margin: 4px;
      border-radius: 16px;
      background: var(--accent-dim);
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 750;
    }
    .edit-chip:active { transform: scale(0.96); }
    .edit-chip svg { display: block; }
    .reorder-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--accent-2);
      font-size: 18px;
      line-height: 1;
    }
    .reorder-btn:active { background: var(--accent-dim); }
    .icon-x {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--danger-dim);
      color: var(--danger);
      font-size: 22px;
      line-height: 1;
    }
    .icon-x:active { transform: scale(0.96); }
    .grip {
      width: 18px;
      flex-shrink: 0;
      display: grid;
      gap: 3px;
      color: var(--faint);
    }
    .grip i {
      display: block;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }
    .wo-block-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .wo-block-head > div { flex: 1; min-width: 0; }
    .also-save {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      margin: 0 0 12px;
      font-weight: 650;
    }
    .also-save input { width: 22px; height: 22px; accent-color: var(--accent); }
    .picker-empty { color: var(--muted); font-size: 14px; padding: 8px 4px 12px; }
    .tpl-row { flex-wrap: wrap; }
    .tpl-line { display: flex; align-items: center; gap: 6px; width: 100%; }
    .tpl-targets {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 2px 0 4px;
    }
    .tpl-targets .lbl {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .target-val { min-width: 22px; text-align: center; font-weight: 750; font-variant-numeric: tabular-nums; }
    .wo-progress { color: var(--muted); font-size: 13px; font-weight: 700; margin: 0 0 12px; }
    .set-plan {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 52px;
      margin-top: 8px;
    }
    .set-no { width: 48px; flex-shrink: 0; color: var(--muted); font-size: 13px; font-weight: 750; }
    .set-plan.done .set-no { color: var(--good); }
    .plan-input {
      width: 64px;
      height: 44px;
      text-align: center;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-weight: 750;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }
    .plan-input.reps { width: 52px; }
    .plan-x { color: var(--muted); font-weight: 650; }
    .log-btn {
      margin-left: auto;
      min-width: 64px;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--accent);
      color: #1a0a00;
      font-weight: 800;
    }
    .log-btn:disabled { opacity: 0.35; }

    function readLegacy() {
      try {
        const raw = localStorage.getItem(LEGACY_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.exercises) || !Array.isArray(data.sets)) return null;
        return data;
      } catch {
        return null;
      }
    }

    function setsFor(exId) {
      return state.sets.filter(s => s.exerciseId === exId).sort((a, b) => a.createdAt - b.createdAt);
    }
    function lastSet(exId) {
      const list = setsFor(exId);
      return list.length ? list[list.length - 1] : null;
    }
    function prsFor(exId) {
      const list = setsFor(exId);
      if (!list.length) return { heaviest: null, epley: null };
      let heaviest = list[0];
      let best = list[0];
      let bestVal = epley(list[0].weightLbs, list[0].reps);
      for (const s of list) {
        if (s.weightLbs > heaviest.weightLbs) heaviest = s;
        const v = epley(s.weightLbs, s.reps);
        if (v > bestVal) { bestVal = v; best = s; }
      }
      return { heaviest, epley: { set: best, value: bestVal } };
    }
    function topWeightByDay(exId) {
      const map = new Map();
      for (const s of setsFor(exId)) {
        const k = todayKey(s.createdAt);
        const prev = map.get(k);
        if (!prev || s.weightLbs > prev) map.set(k, s.weightLbs);
      }
      return Array.from(map.entries()).map(([date, weightLbs]) => ({ date, weightLbs }));
    }
    function ensureDraft(exId) {
      if (draftExId === exId && draft.weight !== "" && draft.reps !== "") return;
      const last = lastSet(exId);
      if (last) {
        draft = { weight: fmtWeight(last.weightLbs, false), reps: String(last.reps) };
      } else {
        const ex = exerciseById(exId);
        draft = { weight: startingWeight(ex && ex.name), reps: "5" };
      }
      draftExId = exId;
    }
    function showToast(msg) {
      toastMsg = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastMsg = ""; render(); }, 1800);
      render();
    }
    function exerciseById(id) {
      return state.exercises.find(e => e.id === id);
    }
    function signedInEmail() {
      return (session && session.user && session.user.email) || "";
    }

    function applyServerState(exercises, sets, settings) {
      const templates = state.templates || [];
      const lastTemplateId = state.lastTemplateId || null;
      state = {
        version: 2,
        settings: { unit: settings && settings.unit === "kg" ? "kg" : "lbs" },
        exercises: (exercises || []).map(ex => ({
          id: ex.id,
          name: ex.name,
          custom: !!ex.custom,
          createdAt: ex.created_at ? new Date(ex.created_at).getTime() : Date.now()
        })),
        sets: (sets || []).map(s => ({
          id: s.id,
          exerciseId: s.exercise_id,
          weightLbs: toLbsFrom(s.weight, s.unit),
          reps: parseInt(s.reps, 10),
          createdAt: new Date(s.performed_at).getTime()
        })),
        templates,
        lastTemplateId
      };
    }

    async function fetchAll() {
      const [exRes, setRes, settingsRes] = await Promise.all([
        sb.from("exercises").select("id,name,custom,created_at").order("created_at", { ascending: true }),
        sb.from("sets").select("id,exercise_id,weight,reps,unit,performed_at").order("performed_at", { ascending: true }),
        sb.from("user_settings").select("unit").maybeSingle()
      ]);
      if (exRes.error) throw asError(exRes.error, "Couldn't load exercises.");
      if (setRes.error) throw asError(setRes.error, "Couldn't load sets.");
      if (settingsRes.error) throw asError(settingsRes.error, "Couldn't load settings.");
      return {
        exercises: exRes.data || [],
        sets: setRes.data || [],
        settings: settingsRes.data
      };
    }

    async function seedAccount(uid) {
      const rows = DEFAULT_NAMES.map(name => ({ user_id: uid, name, custom: false }));
      const ex = await sb.from("exercises").insert(rows);
      if (ex.error) throw asError(ex.error, "Couldn't set up your exercises.");
      const st = await sb.from("user_settings").insert({ user_id: uid, unit: "lbs" });
      if (st.error) throw asError(st.error, "Couldn't set up your settings.");
    }

    function offerMigration() {
      if (!session || !session.user) return;
      if (localStorage.getItem(migrationFlag())) return;
      const data = readLegacy();
      if (!data) return;
      modal = { type: "migrate-local", data };
    }

    function loadAccount() {
      if (accountLoad) return accountLoad;
      accountLoad = doLoad().finally(() => { accountLoad = null; });
      return accountLoad;
    }

    async function doLoad() {
      const seq = ++loadSeq;
      const uid = session && session.user && session.user.id;
      if (!uid) return;
      loading = true;
      bootError = "";
      render();
      try {
        let pack = await fetchAll();
        if (seq !== loadSeq) return;
        const brandNew = !pack.settings && pack.exercises.length === 0 && pack.sets.length === 0;
        if (brandNew) {
          await seedAccount(uid);
          if (seq !== loadSeq) return;
          pack = await fetchAll();
        } else if (!pack.settings) {
          const st = await sb.from("user_settings").insert({ user_id: uid, unit: "lbs" });
          if (st.error) throw asError(st.error, "Couldn't set up your settings.");
          pack.settings = { unit: "lbs" };
        }
        if (seq !== loadSeq) return;
        applyServerState(pack.exercises, pack.sets, pack.settings);
        await loadTemplates();
        if (seq !== loadSeq) return;
        dataReadyFor = uid;
        loading = false;
        bootError = "";
        offerMigration();
        render();
      } catch (err) {
        if (seq !== loadSeq) return;
        console.error(err);
        loading = false;
        bootError = err.message || "Couldn't load your log.";
        render();
      }
    }

    async function persistExerciseInsert(ex) {
      const res = await sb.from("exercises").insert({
        id: ex.id,
        user_id: session.user.id,
        name: ex.name,
        custom: !!ex.custom,
        created_at: new Date(ex.createdAt).toISOString()
      });
      if (res.error) throw asError(res.error, "Couldn't add that exercise.");
    }

    async function persistExerciseName(id, name) {
      const res = await sb.from("exercises").update({ name }).eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't rename that exercise.");
    }

    async function persistExerciseDelete(id) {
      const res = await sb.from("exercises").delete().eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't delete that exercise.");
    }

    async function persistSetInsert(row, displayWeight) {
      const res = await sb.from("sets").insert({
        id: row.id,
        user_id: session.user.id,
        exercise_id: row.exerciseId,
        weight: displayWeight,
        reps: row.reps,
        unit: unit(),
        performed_at: new Date(row.createdAt).toISOString()
      });
      if (res.error) throw asError(res.error, "Couldn't log that set.");
    }

    async function persistSetUpdate(id, displayWeight, reps) {
      const res = await sb.from("sets").update({
        weight: displayWeight,
        reps,
        unit: unit()
      }).eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't update that set.");
    }

    async function persistSetDelete(id) {
      const res = await sb.from("sets").delete().eq("id", id);
      if (res.error) throw asError(res.error, "Couldn't delete that set.");
    }

    async function persistUnit(next) {
      const res = await sb.from("user_settings").upsert({
        user_id: session.user.id,
        unit: next,
        updated_at: new Date().toISOString()
      }, { onConflict: "user_id" });
      if (res.error) throw asError(res.error, "Couldn't update units.");
    }

    function rowsFromBackup(data) {
      const idMap = new Map();
      const seen = new Map();
      const exRows = [];
      for (const ex of data.exercises) {
        const name = String((ex && ex.name) || "").trim().slice(0, 60);
        if (!name) continue;
        const key = name.toLowerCase();
        if (seen.has(key)) {
          if (ex.id != null) idMap.set(ex.id, seen.get(key));
          continue;
        }
        const id = uid();
        seen.set(key, id);
        if (ex.id != null) idMap.set(ex.id, id);
        exRows.push({
          id,
          user_id: session.user.id,
          name,
          custom: !!(ex && ex.custom),
          created_at: toIso(ex && ex.createdAt)
        });
      }
      const setRows = [];
      for (const s of data.sets) {
        const exerciseId = idMap.get(s.exerciseId);
        if (!exerciseId) continue;
        const weight = toLbsFrom(s.weightLbs, "lbs");
        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(weight) || weight < 0 || !Number.isFinite(reps) || reps < 1) continue;
        setRows.push({
          id: uid(),
          user_id: session.user.id,
          exercise_id: exerciseId,
          weight,
          reps,
          unit: "lbs",
          performed_at: toIso(s.createdAt)
        });
      }
      const unitName = data.settings && data.settings.unit === "kg" ? "kg" : "lbs";
      return { exRows, setRows, unitName };
    }

    async function replaceWithBackup(data) {
      const built = rowsFromBackup(data);
      const uidNow = session.user.id;
      const deleted = await sb.from("exercises").delete().eq("user_id", uidNow);
      if (deleted.error) throw asError(deleted.error, "Couldn't replace your log.");
      if (built.exRows.length) {
        const ex = await sb.from("exercises").insert(built.exRows);
        if (ex.error) throw asError(ex.error, "Couldn't import exercises.");
      }
      if (built.setRows.length) {
        const sets = await sb.from("sets").insert(built.setRows);
        if (sets.error) throw asError(sets.error, "Couldn't import sets.");
      }
      await persistUnit(built.unitName);
    }

    async function mergeLegacy(data) {
      const nameToId = new Map(state.exercises.map(e => [e.name.trim().toLowerCase(), e.id]));
      const idMap = new Map();
      const newRows = [];
      for (const ex of data.exercises) {
        const name = String((ex && ex.name) || "").trim().slice(0, 60);
        if (!name) continue;
        const key = name.toLowerCase();
        let id = nameToId.get(key);
        if (!id) {
          id = uid();
          nameToId.set(key, id);
          newRows.push({
            id,
            user_id: session.user.id,
            name,
            custom: ex.custom !== false,
            created_at: toIso(ex.createdAt)
          });
        }
        if (ex.id != null) idMap.set(ex.id, id);
      }
      if (newRows.length) {
        const ex = await sb.from("exercises").insert(newRows);
        if (ex.error) throw asError(ex.error, "Couldn't import exercises.");
      }
      const setRows = [];
      for (const s of data.sets) {
        const exerciseId = idMap.get(s.exerciseId);
        if (!exerciseId) continue;
        const weight = toLbsFrom(s.weightLbs, "lbs");
        const reps = parseInt(s.reps, 10);
        if (!Number.isFinite(weight) || weight < 0 || !Number.isFinite(reps) || reps < 1) continue;
        setRows.push({
          id: uid(),
          user_id: session.user.id,
          exercise_id: exerciseId,
          weight,
          reps,
          unit: "lbs",
          performed_at: toIso(s.createdAt)
        });
      }
      if (setRows.length) {
        const sets = await sb.from("sets").insert(setRows);
        if (sets.error) throw asError(sets.error, "Couldn't import sets.");
      }
      if (data.settings && (data.settings.unit === "kg" || data.settings.unit === "lbs")) {
        await persistUnit(data.settings.unit);
      }
    }

    function onAuth(event, sess) {
      if (event === "PASSWORD_RECOVERY") recoveryMode = true;
      if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
        if (sess) session = sess;
        return;
      }
      const next = (!sess || event === "SIGNED_OUT") ? null : sess;
      if (!next) {
        session = null;
        loadSeq++;
      } else {
        session = next;
        if (!recoveryMode && dataReadyFor !== next.user.id) {
          loading = true;
          bootError = "";
        }
      }
      setTimeout(() => bootFromSession(event, next), 0);
    }

    function bootFromSession(event, sess) {
      if (recoveryMode && sess && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        session = sess;
        authResolved = true;
        loading = false;
        stripAuthParams();
        render();
        return;
      }
      if (!sess) {
        const failedRecovery = recoveryMode;
        session = null;
        recoveryMode = false;
        dataReadyFor = null;
        state = blankState();
        activeWorkout = null;
        workoutDrafts = {};
        planDrafts = {};
        restSession = null;
        restAlerted = false;
        clearInterval(restTick);
        templatesMode = "local";
        modal = null;
        draft = { weight: "", reps: "" };
        draftExId = null;
        loading = false;
        bootError = "";
        authResolved = true;
        authBusy = false;
        authMode = "login";
        authNotice = "";
        authForm.password = "";
        authForm.password2 = "";
        if (failedRecovery) {
          authMode = "forgot";
          authError = authError || "This reset link is invalid or expired.";
        } else {
          authError = "";
        }
        stripAuthParams();
        render();
        return;
      }
      session = sess;
      authResolved = true;
      stripAuthParams();
      if (dataReadyFor === sess.user.id && !bootError) {
        loading = false;
        render();
        return;
      }
      loadAccount();
    }

    function svgChart(points) {
      if (!points.length) return '<div class="chart-empty">Log a few sessions to see your trend</div>';
      const w = 360, h = 128, padL = 8, padR = 8, padT = 12, padB = 22;
      const ys = points.map(p => toDisplay(p.weightLbs));
      let min = Math.min(...ys), max = Math.max(...ys);
      if (min === max) { min = min * 0.9; max = max * 1.1 || 1; }
      const span = max - min || 1;
      const x = (i) => {
        if (points.length === 1) return w / 2;
        return padL + (i / (points.length - 1)) * (w - padL - padR);
      };
      const y = (v) => padT + (1 - (v - min) / span) * (h - padT - padB);
      const coords = points.map((p, i) => [x(i), y(toDisplay(p.weightLbs))]);
      const line = coords.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
      const area = line + " L" + coords[coords.length - 1][0].toFixed(1) + " " + (h - padB) +
        " L" + coords[0][0].toFixed(1) + " " + (h - padB) + " Z";
      const dots = coords.map((c, i) => {
        const last = i === coords.length - 1;
        return `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${last ? 4.5 : 3.2}" fill="${last ? "#ff6a2a" : "#ffd7a8"}" />`;
      }).join("");
      const lastPt = coords[coords.length - 1];
      const lastVal = fmtWeight(points[points.length - 1].weightLbs, false);
      const valX = Math.min(w - 16, Math.max(16, lastPt[0] + (points.length === 1 ? 0 : 8)));
      const valAnchor = points.length === 1 ? "middle" : (lastPt[0] > w - 50 ? "end" : "start");
      const firstLbl = points[0].date.slice(5);
      const lastLbl = points[points.length - 1].date.slice(5);
      const dateLabels = firstLbl === lastLbl
        ? `<text x="${w / 2}" y="${h - 6}" fill="#8d8a86" font-size="10" text-anchor="middle">${escapeHtml(firstLbl)}</text>`
        : `<text x="${padL}" y="${h - 6}" fill="#8d8a86" font-size="10">${escapeHtml(firstLbl)}</text>
        <text x="${w - padR}" y="${h - 6}" fill="#8d8a86" font-size="10" text-anchor="end">${escapeHtml(lastLbl)}</text>`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Top set weight over time">
        <path d="${area}" fill="rgba(255,106,42,0.14)"></path>
        <path d="${line}" fill="none" stroke="#ff6a2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}
        <text x="${valX.toFixed(1)}" y="${Math.max(12, lastPt[1] - 10).toFixed(1)}" fill="#ffd7a8" font-size="11" font-weight="700" text-anchor="${valAnchor}">${escapeHtml(lastVal)}</text>
        ${dateLabels}
      </svg>`;
    }

    function screenName() {
      if (recoveryMode) return "recovery";
      if (!authResolved || (session && loading)) return "loading";
      if (!session) return "auth";
      if (bootError) return "error";
      if (route.name === "settings") return "settings";
      if (route.name === "exercise") return "exercise";
      if (route.name === "workout") return "workout";
      if (route.name === "template") return "template";
      if (route.name === "library") return "library";
      return "home";
    }

    function render() {
      const scrollY = window.scrollY;
      const active = document.activeElement;
      const activeId = active && active.id;
      const activePos = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
      const screen = screenName();
      appEl.dataset.screen = screen;

      let html = "";
      if (screen === "recovery") html = renderRecovery();
      else if (screen === "loading") html = renderLoading();
      else if (screen === "auth") html = renderAuth();
      else if (screen === "error") html = renderBootError();
      else if (screen === "settings") html = renderSettings();
      else if (screen === "exercise") html = renderExercise();
      else if (screen === "workout") html = renderWorkout();
      else if (screen === "template") html = renderTemplateEditor();
      else if (screen === "library") html = renderLibrary();
      else html = renderHome();

      const showModal = screen !== "auth" && screen !== "loading" && screen !== "recovery" && screen !== "error";
      if (showModal && modal) html += renderModal();
      if (toastMsg) html += `<div class="toast" role="status">${escapeHtml(toastMsg)}</div>`;
      if (session && restSession && screen !== "loading" && screen !== "auth" && screen !== "recovery") html += restSheetHtml();
      appEl.innerHTML = html;
      hydrateAuthFields();
      bind();
      document.querySelectorAll(".chip.on").forEach(el => {
        if (el.scrollIntoView) el.scrollIntoView({ inline: "center", block: "nearest" });
      });

      if (focusAuthField) {
        const preferred = document.getElementById(focusAuthField);
        focusAuthField = "";
        if (preferred) {
          preferred.focus();
          return;
        }
      }
      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (activePos && el.setSelectionRange) {
            try { el.setSelectionRange(activePos[0], activePos[1]); } catch {}
          }
        }
      } else {
        window.scrollTo(0, scrollY);
      }
    }

    function hydrateAuthFields() {
      const email = document.getElementById("auth-email");
      const password = document.getElementById("auth-password");
      const password2 = document.getElementById("auth-password2");
      if (email) email.value = authForm.email;
      if (password) password.value = authForm.password;
      if (password2) password2.value = authForm.password2;
    }

    function brandHeader(extra) {
      return `<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">${barbellIcon()}</div><h1>Lift Log</h1></div>${extra || ""}</header>`;
    }

    function renderLoading() {
      const label = session ? "Loading your log…" : "Loading…";
      return brandHeader() + `<main class="screen"><div class="status-block" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <h2>${label}</h2>
      </div></main>`;
    }

    function renderBootError() {
      return brandHeader() + `<main class="screen"><div class="status-block">
        <h2>Couldn't load your log</h2>
        <p class="form-error" role="alert">${escapeHtml(bootError)}</p>
        <button class="add-set" data-action="retry-load">Try again</button>
        <button class="auth-link" data-action="log-out">Log out</button>
      </div></main>`;
    }

    function renderAuth() {
      const mode = authMode === "signup" || authMode === "forgot" ? authMode : "login";
      const title = mode === "signup" ? "Create your account" : mode === "forgot" ? "Reset password" : "Welcome back";
      const lead = mode === "signup"
        ? "Your exercises and sets stay with this account."
        : mode === "forgot"
          ? "We'll email a reset link that opens this page."
          : "Log lifts by exercise. Each account keeps its own history.";
      const submit = mode === "signup" ? "Sign up" : mode === "forgot" ? "Send reset link" : "Log in";
      const busyLabel = mode === "signup" ? "Creating account…" : mode === "forgot" ? "Sending…" : "Logging in…";
      const passwordAuto = mode === "signup" ? "new-password" : "current-password";
      const alert = authError
        ? `<p class="form-error" role="alert">${escapeHtml(authError)}</p>`
        : authNotice
          ? `<p class="form-note" role="status">${escapeHtml(authNotice)}</p>`
          : "";
      const passwords = mode === "forgot" ? "" : `
        <label class="field-lbl" for="auth-password">Password</label>
        <input class="text-input" id="auth-password" name="password" type="password" autocomplete="${passwordAuto}" aria-label="Password">
        ${mode === "signup" ? `<label class="field-lbl" for="auth-password2">Confirm password</label>
        <input class="text-input" id="auth-password2" name="password2" type="password" autocomplete="new-password" aria-label="Confirm password">` : ""}`;
      const links = mode === "login"
        ? `<button type="button" class="auth-link" data-action="auth-mode" data-mode="forgot">Forgot password</button>
           <button type="button" class="auth-link" data-action="auth-mode" data-mode="signup">Need an account? Sign up</button>`
        : mode === "signup"
          ? `<button type="button" class="auth-link" data-action="auth-mode" data-mode="login">Already have an account? Log in</button>`
          : `<button type="button" class="auth-link" data-action="auth-mode" data-mode="login">Back to log in</button>`;
      return brandHeader() + `<main class="screen"><div class="auth-card">
        <h2>${title}</h2>
        <p class="auth-lead">${lead}</p>
        ${alert}
        <form id="auth-form" novalidate>
          <label class="field-lbl" for="auth-email">Email</label>
          <input class="text-input" id="auth-email" name="email" type="email" inputmode="email" autocomplete="username" aria-label="Email">
          ${passwords}
          <button class="add-set" type="submit" ${authBusy ? "disabled" : ""}>${authBusy ? busyLabel : submit}</button>
        </form>
        <div class="auth-links">${links}</div>
      </div></main>`;
    }

    function renderRecovery() {
      if (!session) {
        return brandHeader() + `<main class="screen"><div class="status-block" role="status">
          <div class="spinner" aria-hidden="true"></div>
          <h2>Checking your reset link…</h2>
        </div></main>`;
      }
      const alert = authError ? `<p class="form-error" role="alert">${escapeHtml(authError)}</p>` : "";
      return brandHeader() + `<main class="screen"><div class="auth-card">
        <h2>Set a new password</h2>
        <p class="auth-lead">${escapeHtml(signedInEmail() || "Choose a new password for your account.")}</p>
        ${alert}
        <form id="recovery-form" novalidate>
          <label class="field-lbl" for="auth-password">New password</label>
          <input class="text-input" id="auth-password" name="password" type="password" autocomplete="new-password" aria-label="New password">
          <label class="field-lbl" for="auth-password2">Confirm password</label>
          <input class="text-input" id="auth-password2" name="password2" type="password" autocomplete="new-password" aria-label="Confirm password">

    function renderHome() {
      const used = new Map();
      for (const s of state.sets) used.set(s.exerciseId, s.createdAt);
      const exercises = state.exercises.slice().sort((a, b) => {
        const ta = used.get(a.id) || 0, tb = used.get(b.id) || 0;
        if (ta !== tb) return tb - ta;
        return a.name.localeCompare(b.name);
      });
      const rows = exercises.map(ex => {
        const last = lastSet(ex.id);
        const lastTxt = last
          ? `${fmtWeight(last.weightLbs, true)} × ${last.reps} · ${formatDay(todayKey(last.createdAt))}`
          : "No sets yet";
        return `<button class="ex-row" data-go="#/exercise/${encodeURIComponent(ex.id)}">
          <span class="meta">
            <span class="name">${escapeHtml(ex.name)}</span>
            <span class="last">${escapeHtml(lastTxt)}</span>
          </span>
          <span class="chev" aria-hidden="true">${chevron()}</span>
        </button>`;
      }).join("");
      return `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">${barbellIcon()}</div>
            <h1>Lift Log</h1>
          </div>
          <button class="icon-btn" data-go="#/settings" aria-label="Settings">${gearIcon()}</button>
        </header>
        <main class="screen">
          ${renderWorkoutSection()}
          <div class="eyebrow">Exercises</div>
          <button type="button" class="browse-lib" data-action="open-library">Browse library</button>

          </div>
        </main>`;
    }

    function renderExercise() {
      const ex = exerciseById(route.id);
      if (!ex) {
        return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Not found</h1>
        </header>
        <main class="screen"><div class="empty">That exercise is gone.</div>
        <button class="add-ex" data-go="#/">Back to list</button></main>`;
      }
      ensureDraft(ex.id);
      const pr = prsFor(ex.id);
      const points = topWeightByDay(ex.id);
      const heavy = pr.heaviest ? fmtWeight(pr.heaviest.weightLbs, true) : "—";
      const e1 = pr.epley ? fmtWeight(pr.epley.value, true) : "—";
      const eSub = pr.epley
        ? `From ${fmtWeight(pr.epley.set.weightLbs, true)} × ${pr.epley.set.reps}`
        : "Epley formula";
      const hSub = pr.heaviest ? repLabel(pr.heaviest.reps) : "No sets yet";

      const groups = groupSets(ex.id);
      let history = "";
      if (!groups.length) {
        history = `<div class="empty">No history yet. Log your first set above.</div>`;
      } else {
        history = groups.map(g => {
          const vol = g.sets.reduce((sum, s) => sum + toDisplay(s.weightLbs) * s.reps, 0);
          const volTxt = unit() === "kg"
            ? Math.round(vol) + " kg volume"
            : Math.round(vol) + " lb volume";
          const rows = g.sets.map((s, i) => `
            <div class="set-row">
              <div class="set-idx">Set ${i + 1}</div>
              <div class="set-main">${escapeHtml(fmtWeight(s.weightLbs, true))} <span>× ${s.reps}</span></div>
              <div class="row-actions">
                <button class="mini" data-action="edit-set" data-id="${s.id}">Edit</button>
                <button class="mini danger" data-action="delete-set" data-id="${s.id}">Delete</button>
              </div>
            </div>`).join("");
          return `<section class="day-group">
            <div class="day-head"><div class="when">${escapeHtml(formatDay(g.date))}</div><div class="vol">${escapeHtml(volTxt)}</div></div>
            ${rows}
          </section>`;
        }).join("");
      }

      return `
        <header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>${escapeHtml(ex.name)}</h1>
          <button class="icon-btn" data-action="ex-menu" aria-label="Exercise options">${dotsIcon()}</button>
        </header>
        <main class="screen">
          <div class="pr-grid">
            <div class="pr-card">
              <div class="lbl">Heaviest</div>
              <div class="val">${escapeHtml(heavy)}</div>
              <div class="sub">${escapeHtml(hSub)}</div>
            </div>
            <div class="pr-card best">
              <div class="lbl">Est. 1RM</div>
              <div class="val">${escapeHtml(e1)}</div>
              <div class="sub">${escapeHtml(eSub)}</div>
            </div>
          </div>
          <div class="chart-card">
            <div class="lbl">Top set over time</div>
            <div class="chart-wrap">${svgChart(points)}</div>
          </div>
          <div class="logger">
            <div class="logger-grid">
              <div class="stepper">
                <div class="unit-lbl">Weight (${unit()})</div>
                <input id="draft-weight" inputmode="decimal" type="text" value="${escapeHtml(draft.weight)}" aria-label="Weight">
                <div class="step-row">
                  <button class="step-btn" data-action="step-w" data-dir="-1" aria-label="Decrease weight">−</button>
                  <button class="step-btn" data-action="step-w" data-dir="1" aria-label="Increase weight">+</button>
                </div>
              </div>
              <div class="stepper">
                <div class="unit-lbl">Reps</div>
                <input id="draft-reps" inputmode="numeric" type="text" value="${escapeHtml(draft.reps)}" aria-label="Reps">
                <div class="step-row">
                  <button class="step-btn" data-action="step-r" data-dir="-1" aria-label="Decrease reps">−</button>
                  <button class="step-btn" data-action="step-r" data-dir="1" aria-label="Increase reps">+</button>
                </div>
              </div>
            </div>
            <button class="add-set" data-action="add-set" ${saving ? "disabled" : ""}>Add set</button>
          </div>
          <div class="eyebrow">History</div>
          ${history}
        </main>`;
    }

    function groupSets(exId) {
      const map = new Map();
      for (const s of setsFor(exId).slice().reverse()) {
        const k = todayKey(s.createdAt);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(s);
      }
      // Within a day, show chronological order (first set first)
      return Array.from(map.entries()).map(([date, sets]) => ({
        date,
        sets: sets.slice().sort((a, b) => a.createdAt - b.createdAt)
      }));
    }

      return `<div class="eyebrow">Add to Home Screen</div>
        <p class="hint">In Safari, tap Share, then Add to Home Screen. Lift Log opens full screen, clear of the notch and home bar.</p>`;

    function renderModal() {
      if (!modal) return "";

        return `<div class="overlay" data-action="close-modal">

              <button class="btn danger" data-action="delete-exercise">Delete</button>
            </div>

        </div>`;

      if (modal.type === "confirm-import") {
        const busy = modal.busy ? "disabled" : "";
        return `<div class="overlay" data-action="close-modal">
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Replace data">

        const data = modal.data || { exercises: [], sets: [] };
        const setCount = data.sets.length;
        const exCount = data.exercises.length;
        const busy = modal.busy ? "disabled" : "";
        const detail = `${setCount} set${setCount === 1 ? "" : "s"} across ${exCount} exercise${exCount === 1 ? "" : "s"} on this phone.`;
        const err = modal.error ? `<p class="form-error" role="alert">${escapeHtml(modal.error)}</p>` : "";

            </div>

    function readDraftInputs() {
      const w = document.getElementById("draft-weight");
      const r = document.getElementById("draft-reps");
      if (w) draft.weight = w.value;
      if (r) draft.reps = r.value;

    function readAuthInputs() {
      const email = document.getElementById("auth-email");
      const password = document.getElementById("auth-password");
      const password2 = document.getElementById("auth-password2");
      if (email) authForm.email = email.value;
      if (password) authForm.password = password.value;
      if (password2) authForm.password2 = password2.value;
    }
    function parseWeight(str) {
      const n = parseFloat(String(str).replace(",", "."));
      if (!Number.isFinite(n) || n < 0) return null;
      return n;
    }
    function parseReps(str) {
      const n = parseInt(String(str), 10);
      if (!Number.isFinite(n) || n < 1) return null;
      return n;
    }
    function validateAuth(mode) {
      const email = authForm.email.trim();
      if (mode !== "recovery") {
        if (!email || email.indexOf("@") === -1) return "Enter a valid email.";
      }
      if (mode === "forgot") return "";
      if (!authForm.password || authForm.password.length < 6) return "Use at least 6 characters.";
      if ((mode === "signup" || mode === "recovery") && authForm.password !== authForm.password2) return "Passwords don't match.";
      return "";
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach(el => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          go(el.getAttribute("data-go"));
        });
      });

      const overlay = document.querySelector(".overlay");
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay && (!modal || modal.type !== "migrate-local")) closeModal();
        });
        const sheet = overlay.querySelector(".sheet");
        if (sheet) sheet.addEventListener("click", (e) => e.stopPropagation());
      }

      const nameInput = document.getElementById("modal-name");
      if (nameInput && modal && (modal.type === "add-exercise" || modal.type === "rename-exercise")) {
        setTimeout(() => { nameInput.focus(); nameInput.select(); }, 30);
        nameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") saveExerciseName();
        });
      }

      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", (e) => {
          const action = el.getAttribute("data-action");
          if (action === "close-modal" && e.currentTarget.classList.contains("overlay") && e.target !== el) return;
          handleAction(action, el);
        });
      });

      const dw = document.getElementById("draft-weight");
      const dr = document.getElementById("draft-reps");
      if (dw) dw.addEventListener("input", () => { draft.weight = dw.value; });
      if (dr) dr.addEventListener("input", () => { draft.reps = dr.value; });
      document.querySelectorAll("[data-draft-weight]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-draft-weight");
          readWorkoutDraft(id);
        });
      });
      document.querySelectorAll("[data-draft-reps]").forEach(input => {
        input.addEventListener("input", () => {
          const id = input.getAttribute("data-draft-reps");
          readWorkoutDraft(id);
        });
      });
      const tplName = document.getElementById("tpl-name");
      if (tplName) tplName.addEventListener("change", () => saveTemplateName());
      const libSearch = document.getElementById("lib-search");
      if (libSearch) {
        libSearch.addEventListener("input", () => {
          libQuery = libSearch.value;
          render();
        });
      }
      const picker = document.getElementById("picker-search");
      if (picker && modal) {
        picker.addEventListener("input", () => {
          const box = document.getElementById("also-save-template");
          const nameInput = document.getElementById("tpl-add-name");
          if (box) modal.alsoSave = box.checked;
          if (nameInput) modal.value = nameInput.value;
          modal.query = picker.value;
          render();
        });
      }

    async function handleAction(action, el) {
      if (action === "close-modal") return closeModal();
      if (action === "auth-mode") {
        authMode = el.getAttribute("data-mode") || "login";
        authError = "";
        authNotice = "";
        authForm.password = "";
        authForm.password2 = "";
        focusAuthField = "auth-email";
        render();
        return;
      }
      if (action === "retry-load") {
        dataReadyFor = null;
        bootError = "";
        loadAccount();
        return;
      }
      if (action === "log-out") {
        authForm.password = "";
        authForm.password2 = "";
        try {
          await sb.auth.signOut();
        } catch (err) {
          showToast(err.message || "Couldn't log out.");
        }
        return;
      }
      if (action === "migrate-dismiss") {
        localStorage.setItem(migrationFlag(), "dismissed");

        render();
        return;
      }
      if (action === "migrate-import") return migrateImport();

        return render();
      }
      if (action === "ex-menu") {

        return render();

      if (action === "rename-exercise") {
        const ex = exerciseById((modal && modal.id) || route.id);

        return render();
      }
      if (action === "confirm-delete-ex") {
        modal = { type: "confirm-delete-ex", id: (modal && modal.id) || route.id };
        return render();
      }
      if (action === "delete-exercise") return deleteExercise();
      if (action === "save-exercise-name") return saveExerciseName();
      if (action === "step-w") {
        readDraftInputs();
        const cur = parseWeight(draft.weight);
        const base = cur == null ? 0 : cur;
        const next = Math.max(0, Math.round((base + Number(el.getAttribute("data-dir")) * weightStep()) * 10) / 10);
        draft.weight = String(next);
        draftExId = route.id;
        return render();
      }
      if (action === "step-r") {

        draftExId = route.id;
        return render();

      if (action === "resume-workout") return go("#/workout");

    async function submitAuth() {
      if (authBusy) return;
      readAuthInputs();
      const mode = authMode === "signup" || authMode === "forgot" ? authMode : "login";
      const problem = validateAuth(mode);
      authError = "";
      authNotice = "";
      if (problem) {
        authError = problem;
        render();
        return;
      }
      authBusy = true;
      render();
      try {
        if (mode === "forgot") {
          const { error } = await sb.auth.resetPasswordForEmail(authForm.email.trim(), {
            redirectTo: currentPageUrl()
          });
          if (error) throw error;
          authNotice = "Check your email for a link to reset your password.";
          return;
        }
        if (mode === "signup") {
          const { data, error } = await sb.auth.signUp({
            email: authForm.email.trim(),
            password: authForm.password,
            options: { emailRedirectTo: currentPageUrl() }
          });
          if (error) throw error;
          if (!data.session) {
            authMode = "login";
            authForm.password = "";
            authForm.password2 = "";
            authNotice = "Check your email to confirm your account, then log in.";
          }
          return;
        }
        const { error } = await sb.auth.signInWithPassword({
          email: authForm.email.trim(),
          password: authForm.password
        });
        if (error) throw error;
        authForm.password = "";
      } catch (err) {
        authError = err.message || "Something went wrong.";
      } finally {
        authBusy = false;
        render();
      }
    }

    async function submitNewPassword() {
      if (authBusy) return;
      readAuthInputs();
      const problem = validateAuth("recovery");
      if (problem) {
        authError = problem;
        render();
        return;
      }
      authBusy = true;
      authError = "";
      render();
      try {
        const { error } = await sb.auth.updateUser({ password: authForm.password });

        recoveryMode = false;
        authForm.password = "";
        authForm.password2 = "";
        authBusy = false;
        if (!dataReadyFor && session) await loadAccount();

        authError = err.message || "Couldn't update that password.";
        authBusy = false;
        render();
      }
    }

    async function saveExerciseName() {
      if (saving) return;
      const input = document.getElementById("modal-name");
      const name = (input ? input.value : (modal && modal.value) || "").trim();
      if (!name) { showToast("Give the exercise a name"); return; }
      const exists = state.exercises.some(e => e.name.toLowerCase() === name.toLowerCase() && e.id !== (modal && modal.id));
      if (exists) { showToast("That exercise already exists"); return; }
      saving = true;
      try {
        if (modal.type === "add-exercise") {
          const ex = { id: uid(), name, custom: true, createdAt: Date.now() };
          await persistExerciseInsert(ex);
          state.exercises.push(ex);
          modal = null;
          saving = false;
          showToast("Exercise added");
          go("#/exercise/" + encodeURIComponent(ex.id));
          return;
        }
        const ex = exerciseById(modal.id);
        if (!ex) { modal = null; render(); return; }
        const prev = ex.name;
        ex.name = name;
        try {
          await persistExerciseName(ex.id, name);
        } catch (err) {
          ex.name = prev;
          throw err;
        }
        modal = null;
        saving = false;
        showToast("Renamed");
      } catch (err) {
        const duplicate = err.code === "23505";
        showToast(duplicate ? "That exercise already exists" : (err.message || "Couldn't save that exercise."));
      } finally {
        saving = false;
      }
    }

    function exportJson() {
      const payload = {
        version: 2,
        settings: { unit: state.settings.unit },
        exercises: state.exercises,
        sets: state.sets
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      const day = todayKey(Date.now());
      a.href = URL.createObjectURL(blob);
      a.download = "lift-log-backup-" + day + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      showToast("Backup downloaded");

    function chooseImportFile() {
      const input = document.getElementById("import-file");
      if (!input) return;
      input.value = "";
      input.onchange = () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();

    function templatesCacheKey() {
      return "lift-log-templates:" + (session && session.user ? session.user.id : "");
    }
    function lastTemplateKey() {
      return "lift-log-last-template:" + (session && session.user ? session.user.id : "");
    }
    function templatesSeedKey() {
      return "lift-log-templates-seeded:" + (session && session.user ? session.user.id : "");
    }
    function activeWorkoutKey() {
      return "lift-log-active-workout:" + (session && session.user ? session.user.id : "");
    }
    function isMissingSchema(error) {
      if (!error) return false;
      const code = String(error.code || "");
      const msg = String(error.message || "").toLowerCase();
      if (code === "42P01" || code === "42703" || code === "PGRST205" || code === "PGRST204") return true;
      return msg.includes("does not exist") || msg.includes("could not find") || msg.includes("schema cache");
    }
    function clampTarget(n, min, max, fallback) {
      const v = parseInt(n, 10);
      if (!Number.isFinite(v)) return fallback;
      return Math.min(max, Math.max(min, v));
    }
    function defaultTarget() { return { sets: 3, reps: 10 }; }
    function ensureTargets(t) {
      if (!t) return;
      if (!Array.isArray(t.targets)) t.targets = [];
      while (t.targets.length < t.exerciseNames.length) t.targets.push(defaultTarget());
      if (t.targets.length > t.exerciseNames.length) t.targets = t.targets.slice(0, t.exerciseNames.length);
      t.targets = t.targets.map(x => ({
        sets: clampTarget(x && x.sets, 1, 20, 3),
        reps: clampTarget(x && x.reps, 1, 100, 10)
      }));
    }
    function isMissingColumn(error) {
      if (!error) return false;
      const code = String(error.code || "");
      const msg = String(error.message || "").toLowerCase();
      return code === "42703" || code === "PGRST204" || (msg.includes("column") && (msg.includes("does not exist") || msg.includes("could not find") || msg.includes("schema cache")));
    }
    function builtinTemplateRecords() {
      return BUILTIN_TEMPLATES.map(t => ({
        id: "local-" + t.kind,
        name: t.name,
        kind: t.kind,
        position: t.position,
        exerciseNames: t.names.slice(),
        targets: t.names.map(() => defaultTarget())
      }));
    }
    function readTemplateCache() {
      try {
        const raw = localStorage.getItem(templatesCacheKey());
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.templates)) return null;
        return data;
      } catch {
        return null;
      }
    }
    function cacheTemplates() {
      if (!session || !session.user) return;
      localStorage.setItem(templatesCacheKey(), JSON.stringify({
        seeded: true,
        templates: state.templates,
        lastTemplateId: state.lastTemplateId || null
      }));
    }
    function useLocalTemplates() {
      templatesMode = "local";
      const cached = readTemplateCache();
      state.templates = cached ? cached.templates : builtinTemplateRecords();
      state.lastTemplateId = (cached && cached.lastTemplateId) || localStorage.getItem(lastTemplateKey()) || null;
      restoreActive();
    }
    function rowToTemplate(row) {
      const names = (Array.isArray(row.exercise_names) ? row.exercise_names : []).map(n => String(n));
      const raw = Array.isArray(row.exercise_targets) ? row.exercise_targets : [];
      const targets = names.map((name, i) => {
        const hit = raw.find(x => x && String(x.name || "").toLowerCase() === name.toLowerCase()) || raw[i] || {};
        return {
          sets: clampTarget(hit.sets, 1, 20, 3),
          reps: clampTarget(hit.reps, 1, 100, 10)
        };
      });
      return {
        id: row.id,
        name: row.name,
        kind: row.kind || "custom",
        position: row.position || 0,
        exerciseNames: names,
        targets
      };
    }
    function templateById(id) {
      return (state.templates || []).find(t => t.id === id);
    }
    function suggestedTemplate() {
      const last = templateById(state.lastTemplateId);
      const lastKind = last && ROTATION.indexOf(last.kind) !== -1 ? last.kind : null;
      const nextKind = lastKind ? ROTATION[(ROTATION.indexOf(lastKind) + 1) % ROTATION.length] : "push";
      return (state.templates || []).find(t => t.kind === nextKind) || null;
    }
    function restoreActive() {
      try {
        const raw = localStorage.getItem(activeWorkoutKey());
        if (!raw) { activeWorkout = null; return; }
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.exerciseIds) && !Array.isArray(data.items)) {
          data.items = data.exerciseIds.map(id => ({ exerciseId: id, sets: 3, reps: 10, extra: 0 }));
        }
        if (data && Array.isArray(data.items) && !Array.isArray(data.exerciseIds)) {
          data.exerciseIds = data.items.map(item => item.exerciseId);
        }
        if (!data || !Array.isArray(data.items) || !data.items.length) {
          activeWorkout = null;
          return;
        }
        data.items.forEach(item => {
          item.sets = clampTarget(item.sets, 1, 20, 3);
          item.reps = clampTarget(item.reps, 1, 100, 10);
          item.extra = clampTarget(item.extra, 0, 30, 0);
        });
        activeWorkout = data;
      } catch {
        activeWorkout = null;
      }
    }
    function persistActive() {
      if (!activeWorkout) localStorage.removeItem(activeWorkoutKey());
      else localStorage.setItem(activeWorkoutKey(), JSON.stringify(activeWorkout));
    }
    async function loadTemplates() {
      try {
        let res = await sb.from("templates").select("id,name,kind,position,exercise_names,exercise_targets").order("position", { ascending: true });
        if (res.error && isMissingColumn(res.error)) {
          targetsColumn = false;
          res = await sb.from("templates").select("id,name,kind,position,exercise_names").order("position", { ascending: true });
        }
        if (res.error) {
          console.warn(res.error);
          if (!(state.templates || []).length || isMissingSchema(res.error)) useLocalTemplates();
          return;
        }
        templatesMode = "remote";
        let rows = res.data || [];
        if (!rows.length && !localStorage.getItem(templatesSeedKey())) {
          const flag = await sb.from("user_settings").select("templates_seeded").maybeSingle();
          const already = !flag.error && flag.data && flag.data.templates_seeded;
          if (!already) {
            const cached = readTemplateCache();
            const source = cached && cached.templates && cached.templates.length ? cached.templates : null;
            rows = await seedRemoteTemplates(source);
          }
        }
        state.templates = rows.map(rowToTemplate).sort((a, b) => a.position - b.position || a.name.localeCompare(b.name));
        const lastRes = await sb.from("user_settings").select("last_template_id").maybeSingle();
        state.lastTemplateId = (lastRes.data && lastRes.data.last_template_id) || localStorage.getItem(lastTemplateKey()) || null;
        cacheTemplates();
        restoreActive();
      } catch (err) {
        console.warn(err);
        if (!(state.templates || []).length) useLocalTemplates();
      }
    }
    async function seedRemoteTemplates(source) {
      const list = source && source.length ? source : builtinTemplateRecords();
      const idMap = {};
      const rows = list.map((t, i) => {
        const id = uid();
        if (t.id) idMap[t.id] = id;
        const kind = ROTATION.indexOf(t.kind) === -1 ? "custom" : t.kind;
        const names = t.exerciseNames || t.names || [];
        const targets = (t.targets && t.targets.length === names.length)
          ? names.map((name, n) => ({ name, sets: clampTarget(t.targets[n].sets, 1, 20, 3), reps: clampTarget(t.targets[n].reps, 1, 100, 10) }))
          : names.map(name => ({ name, sets: 3, reps: 10 }));
        const row = {
          id,
