        const ex = await ensureExercise(name);
        const items = workoutItems();
        if (!activeWorkout.items) activeWorkout.items = items.slice();
        if (activeWorkout.items.some(item => item.exerciseId === ex.id)) {
          showToast("Already in this workout");
          return;
        }
        activeWorkout.items.push({ exerciseId: ex.id, sets: 3, reps: 10, extra: 0 });
        activeWorkout.exerciseIds = activeWorkout.items.map(item => item.exerciseId);
        persistActive();
        if (alsoSave && activeWorkout.templateId) {
          const t = templateById(activeWorkout.templateId);
          if (t && !t.exerciseNames.some(n => n.toLowerCase() === ex.name.toLowerCase())) {
            ensureTargets(t);
            t.exerciseNames = t.exerciseNames.concat(ex.name);
            t.targets = t.targets.concat([defaultTarget()]);
            await saveTemplateRecord(t);
          }
        }
        modal = null;
        showToast(alsoSave ? "Added to this workout and the template" : "Added to this workout");
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }
    async function changeTemplateTarget(el) {
      const t = templateById(el.getAttribute("data-id"));
      const index = parseInt(el.getAttribute("data-index"), 10);
      const field = el.getAttribute("data-field");
      const dir = Number(el.getAttribute("data-dir"));
      if (!t || !Number.isFinite(index) || (field !== "sets" && field !== "reps")) return;
      ensureTargets(t);
      const max = field === "sets" ? 20 : 100;
      const min = 1;
      t.targets[index][field] = clampTarget(t.targets[index][field] + dir, min, max, field === "sets" ? 3 : 10);
      try {
        await saveTemplateRecord(t);
        render();
      } catch (err) {
        showToast(err.message || "Couldn't save that template.");
      }
    }



    function startingWeight(name) {
      const hit = libraryEntry(name);
      if (hit && hit.equipment === "Bodyweight") return "0";
      return unit() === "kg" ? "20" : "45";
    }
    function libraryEntry(name) {
      const key = String(name || "").trim().toLowerCase();
      if (!key) return null;
      return LIBRARY.find(e => e.name.toLowerCase() === key) || null;
    }
    function renderLibrary() {
      const q = libQuery.trim().toLowerCase();
      const matches = LIBRARY.filter(e => {
        if (libEquip !== "All" && e.equipment !== libEquip) return false;
        if (libMuscle !== "All" && e.muscle !== libMuscle) return false;
        if (q && e.name.toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      const equipChips = ["All"].concat(EQUIPMENT).map(name =>
        `<button type="button" class="chip${libEquip === name ? " on" : ""}" data-action="lib-equip" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>`
      ).join("");
      const muscleChips = ["All"].concat(MUSCLES).map(name =>
        `<button type="button" class="chip${libMuscle === name ? " on" : ""}" data-action="lib-muscle" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>`
      ).join("");
      const groups = [];
      EQUIPMENT.forEach(eq => {
        const rows = matches.filter(e => e.equipment === eq);
        if (!rows.length) return;
        const buttons = rows.map(e => {
          const owned = state.exercises.some(x => x.name.toLowerCase() === e.name.toLowerCase());
          return `<button type="button" class="ex-row" data-action="add-library" data-name="${escapeHtml(e.name)}">
            <span class="meta"><span class="name">${escapeHtml(e.name)}</span><span class="last">${escapeHtml(e.muscle)}</span></span>
            <span class="chev">${owned ? "Added" : "Add"}</span>
          </button>`;
        }).join("");
        groups.push(`<section class="lib-group"><div class="eyebrow">${escapeHtml(eq)}</div><div class="ex-list">${buttons}</div></section>`);
      });
      return `<header class="topbar">
          <button class="icon-btn" data-go="#/" aria-label="Back">${backIcon()}</button>
          <h1>Library</h1>
        </header>
        <main class="screen">
          <label class="field-lbl" for="lib-search">Search</label>
          <input class="text-input" id="lib-search" type="search" placeholder="Search exercises" value="${escapeHtml(libQuery)}" aria-label="Search library">
          <div class="chip-row" aria-label="Equipment">${equipChips}</div>
          <div class="chip-row" aria-label="Muscle group">${muscleChips}</div>
          <div class="lib-count">${matches.length} exercise${matches.length === 1 ? "" : "s"}</div>
          ${groups.join("") || `<div class="empty">No exercises match.</div>`}
        </main>`;
    }
    async function addFromLibrary(name) {
      const clean = String(name || "").trim();
      if (!clean) return;
      const existing = state.exercises.find(e => e.name.toLowerCase() === clean.toLowerCase());
      if (existing) {
        go("#/exercise/" + encodeURIComponent(existing.id));
        return;
      }
      try {
        const ex = await ensureExercise(clean, true);
        showToast(ex.name + " added");
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }
    async function pickLibraryExercise(name) {
      try {
        const ex = await ensureExercise(name, true);
        if (modal && modal.type === "add-workout-exercise") return addExerciseToWorkout(ex.name, alsoSaveChecked());
        return addTemplateExercise(modal && modal.id, ex.name);
      } catch (err) {
        showToast(err.message || "Couldn't add that exercise.");
      }
    }

    window.addEventListener("hashchange", () => {
      if (isAuthHash(location.hash)) return;
      route = parseHash();
      if (route.name !== "exercise") draftExId = null;
      if (!modal || modal.type !== "migrate-local") modal = null;
      render();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal && modal.type !== "migrate-local" && !modal.busy) closeModal();
    });

    function loadThemeChoice() {
      try {
        const raw = JSON.parse(localStorage.getItem(THEME_KEY) || "null") || {};
        const mode = ["dark", "light", "black", "system"].indexOf(raw.mode) >= 0 ? raw.mode : "dark";
        const accent = ACCENTS.some(item => item[0] === raw.accent) ? raw.accent : "orange";
        themeChoice = { mode, accent };
      } catch {
        themeChoice = { mode: "dark", accent: "orange" };
      }
    }
    function resolvedTheme() {
      if (themeChoice.mode === "system") {
        return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      return themeChoice.mode;
    }
    function applyTheme() {
      const theme = resolvedTheme();
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-accent", themeChoice.accent);
      document.documentElement.setAttribute("data-theme-mode", themeChoice.mode);
      const bg = theme === "light" ? "#f6f3ee" : theme === "black" ? "#000000" : "#0b0b0d";
      const themeMeta = document.getElementById("theme-color");
      const schemeMeta = document.getElementById("color-scheme");
      const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (themeMeta) themeMeta.setAttribute("content", bg);
      if (schemeMeta) schemeMeta.setAttribute("content", theme === "light" ? "light" : "dark");
      if (bar) bar.setAttribute("content", theme === "light" ? "default" : "black-translucent");
    }
    function saveThemeChoice() {
      try { localStorage.setItem(THEME_KEY, JSON.stringify(themeChoice)); } catch {}
      applyTheme();
    }
    function setThemeMode(mode) {
      if (["dark", "light", "black", "system"].indexOf(mode) < 0) return;
      themeChoice.mode = mode;
      saveThemeChoice();
      render();
    }
    function setAccent(id) {
      if (!ACCENTS.some(item => item[0] === id)) return;
      themeChoice.accent = id;
      saveThemeChoice();
      render();
    }
    loadThemeChoice();
    applyTheme();
    const themeMq = window.matchMedia("(prefers-color-scheme: light)");
    if (themeMq.addEventListener) themeMq.addEventListener("change", () => {
      if (themeChoice.mode === "system") applyTheme();
    });
    loadRestSettings();
    restoreRestSession();
    document.addEventListener("pointerdown", () => { if (wakeWanted()) acquireScreenLock(); }, { passive: true });
    document.addEventListener("visibilitychange", () => {
      revealPendingRest();
      syncRest();
      if (document.visibilityState === "visible") syncScreenLock();
    });
    window.addEventListener("focus", () => { revealPendingRest(); syncRest(); syncScreenLock(); });
    window.addEventListener("pageshow", () => { revealPendingRest(); syncRest(); syncScreenLock(); });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    sb.auth.onAuthStateChange((event, sess) => onAuth(event, sess));

    setTimeout(() => {
      if (authResolved) return;
      sb.auth.getSession().then(({ data }) => {
        if (authResolved) return;
        bootFromSession(data && data.session ? "SIGNED_IN" : "INITIAL_SESSION", (data && data.session) || null);
      }).catch(() => {
        if (authResolved) return;
        authResolved = true;
        loading = false;
        authError = authError || "Couldn't check your session.";
        render();
      });
    }, 2500);

    render();
  })();
  </script>
</body>
</html>
